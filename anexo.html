<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Anexos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        /* ===== VARIÁVEIS ===== */
        :root {
            --primary: #0a5f2a;
            --primary-dark: #084d22;
            --primary-light: #10b981;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --accent-2: #8b5cf6;
            --accent-3: #ec4899;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --card-bg: rgba(15, 23, 42, 0.8);
            --glass: rgba(255, 255, 255, 0.05);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent;
            color: var(--light);
            min-height: 100vh;
        }

        /* ===== CONTAINER PRINCIPAL ===== */
        .anexo-container {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .anexo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--primary-light), 
                var(--secondary), 
                var(--accent-2), 
                var(--accent-3), 
                transparent
            );
            animation: brilho 3s linear infinite;
        }

        @keyframes brilho {
            0% { transform: translateX(-30%); }
            100% { transform: translateX(30%); }
        }

        /* ===== CABEÇALHO ===== */
        .anexo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .anexo-header i {
            font-size: 28px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
        }

        .anexo-header h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--light);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* ===== TABS ===== */
        .anexo-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 130px;
            padding: 16px 12px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .tab-btn i {
            font-size: 18px;
        }

        .tab-btn[data-tab="texto"] {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .tab-btn[data-tab="chatgpt"] {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .tab-btn[data-tab="foto"] {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .tab-btn.active {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px currentColor;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .tab-btn[data-tab="texto"].active { box-shadow: 0 15px 25px -5px #3b82f6; }
        .tab-btn[data-tab="chatgpt"].active { box-shadow: 0 15px 25px -5px #8b5cf6; }
        .tab-btn[data-tab="foto"].active { box-shadow: 0 15px 25px -5px #ec4899; }

        /* ===== PAINÉIS ===== */
        .anexo-panel {
            display: none;
            animation: fadeIn 0.4s ease;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .anexo-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== TEXTAREA ===== */
        .anexo-textarea {
            width: 100%;
            min-height: 250px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            color: var(--light);
            font-size: 15px;
            line-height: 1.7;
            font-family: 'Segoe UI', monospace;
            resize: vertical;
            transition: var(--transition);
        }

        .anexo-textarea:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        }

        .anexo-textarea::placeholder {
            color: var(--gray);
            opacity: 0.6;
        }

        /* ===== BOTÃO IA + CHATGPT ===== */
        .btn-ia {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
            background-size: 200% 200%;
            animation: gradientMove 3s ease infinite;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .btn-chatgpt {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            transition: var(--transition);
        }

        .btn-chatgpt:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px #10b981;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-ia:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -5px rgba(245, 158, 11, 0.5);
        }

        /* ===== STREAMING CONTAINER ===== */
        .streaming-container {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ia-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .streaming-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--light);
            white-space: pre-wrap;
        }

        .streaming-cursor {
            display: inline-block;
            width: 3px;
            height: 20px;
            background: var(--accent-2);
            margin-left: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== UPLOAD FOTO ===== */
        .foto-botoes {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-foto {
            flex: 1;
            min-width: 160px;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: white;
            transition: var(--transition);
        }

        .btn-foto.camera {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
        }

        .btn-foto.galeria {
            background: linear-gradient(135deg, #8b5cf6, #5b21b6);
        }

        .btn-foto:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -5px currentColor;
        }

        .preview-foto {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .preview-foto img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* ===== CONTROLES CROPPER ===== */
        .cropper-controls {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .cropper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-cropper {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-cropper:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: var(--accent-2);
        }

        .btn-cropper.primary {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
        }

        .btn-cropper.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px #10b981;
        }

        /* ===== RODAPÉ ===== */
        .anexo-footer {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-footer {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: white;
            transition: var(--transition);
        }

        .btn-footer.salvar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .btn-footer.cancelar {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        .btn-footer:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -5px currentColor;
        }

        /* ===== MENSAGEM INFO ===== */
        .mensagem-info {
            background: rgba(139, 92, 246, 0.2);
            border-left: 4px solid var(--accent-2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: var(--light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== INPUT OCULTO ===== */
        .input-hidden {
            display: none;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .anexo-tabs { flex-direction: column; }
            .foto-botoes { flex-direction: column; }
            .anexo-footer { flex-direction: column; }
            .cropper-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="anexo-container">
        <!-- Cabeçalho -->
        <div class="anexo-header">
            <i class="fas fa-paperclip"></i>
            <h3>ADICIONAR ANEXO AO PLANO</h3>
        </div>

        <!-- Tabs - 3 tipos iguais ao primeiro sistema -->
        <div class="anexo-tabs">
            <button class="tab-btn active" data-tab="texto" onclick="mudarAba('texto')">
                <i class="fas fa-file-alt"></i>
                DIGITAR TEXTO
            </button>
            <button class="tab-btn" data-tab="chatgpt" onclick="mudarAba('chatgpt')">
                <i class="fas fa-robot"></i>
                CONTEÚDOS AUTOMÁTICOS
            </button>
            <button class="tab-btn" data-tab="foto" onclick="mudarAba('foto')">
                <i class="fas fa-camera"></i>
                FOTO DO LIVRO
            </button>
        </div>

        <!-- PAINEL TEXTO -->
        <div id="painelTexto" class="anexo-panel active">
            <textarea 
                id="textoManual"
                class="anexo-textarea" 
                placeholder="📝 Digite aqui o texto do anexo, resumo ou TPC..."></textarea>
        </div>

        <!-- PAINEL CHATGPT (mantendo a lógica IA + fallback) -->
        <div id="painelChatGPT" class="anexo-panel">
            <div class="mensagem-info">
                <i class="fas fa-magic"></i>
                A IA tentará gerar automaticamente. Se falhar, abrirá o ChatGPT.
            </div>
            
            <!-- Botão IA (Gemini) -->
            <button class="btn-ia" onclick="gerarConteudoIA()">
                <i class="fas fa-bolt"></i>
                GERAR CONTEÚDO COM IA
            </button>

            <!-- Fallback ChatGPT (manual) -->
            <button class="btn-chatgpt" onclick="abrirChatGPT()">
                <i class="fab fa-chatgpt"></i>
                ABRIR CHATGPT (FALLBACK)
            </button>

            <!-- Container de streaming -->
            <div id="streamingContainer" class="streaming-container" style="display:none;">
                <div class="ia-badge">
                    <i class="fas fa-robot"></i> Gerando com IA...
                </div>
                <div id="streamingTexto" class="streaming-text"></div>
                <span class="streaming-cursor"></span>
            </div>

            <textarea 
                id="textoIA"
                class="anexo-textarea" 
                placeholder="✨ O conteúdo gerado aparecerá aqui..."></textarea>
        </div>

        <!-- PAINEL FOTO -->
        <div id="painelFoto" class="anexo-panel">
            <div class="mensagem-info">
                <i class="fas fa-camera-retro"></i>
                Tire ou selecione uma foto do livro/material didático
            </div>

            <div class="foto-botoes">
                <button class="btn-foto camera" onclick="abrirCamera()">
                    <i class="fas fa-camera"></i>
                    ABRIR CÂMERA
                </button>
                <button class="btn-foto galeria" onclick="abrirGaleria()">
                    <i class="fas fa-images"></i>
                    SELECIONAR FOTO
                </button>
            </div>

            <input id="inputCamera" type="file" accept="image/*" capture="environment" class="input-hidden" onchange="carregarFoto(this)">
            <input id="inputGaleria" type="file" accept="image/*" class="input-hidden" onchange="carregarFoto(this)">

            <div id="previewFoto" class="preview-foto">
                <div style="color: var(--gray);">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 40px; margin-bottom: 10px;"></i>
                    <p>Nenhuma imagem selecionada</p>
                </div>
            </div>

            <div id="cropperControls" class="cropper-controls" style="display:none;">
                <div class="cropper-grid">
                    <button class="btn-cropper" onclick="rotacionarEsquerda()">
                        <i class="fas fa-undo-alt"></i> -90°
                    </button>
                    <button class="btn-cropper" onclick="rotacionarDireita()">
                        <i class="fas fa-redo-alt"></i> +90°
                    </button>
                    <button class="btn-cropper" onclick="zoomMais()">
                        <i class="fas fa-search-plus"></i> +
                    </button>
                    <button class="btn-cropper" onclick="zoomMenos()">
                        <i class="fas fa-search-minus"></i> -
                    </button>
                    <button class="btn-cropper" onclick="resetarCropper()">
                        <i class="fas fa-sync-alt"></i> RESET
                    </button>
                </div>
                <button class="btn-cropper primary" onclick="aplicarCorte()">
                    <i class="fas fa-check"></i>
                    APLICAR RECORTE
                </button>
            </div>
        </div>

        <!-- Rodapé -->
        <div class="anexo-footer">
            <button class="btn-footer salvar" onclick="salvarAnexo()">
                <i class="fas fa-save"></i>
                SALVAR ANEXO
            </button>
            <button class="btn-footer cancelar" onclick="fecharAnexo()">
                <i class="fas fa-times"></i>
                CANCELAR
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="anexo.js"></script>
</body>
</html>
