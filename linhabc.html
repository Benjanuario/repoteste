<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Beira-Chimoio - CFM</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6a1b9a;
      --primary-light: #9c4dcc;
      --secondary: #25d366;
      --light: #f8f9fa;
      --dark: #333;
      --border: #ddd;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f0ff 0%, #e8e1ff 100%);
      color: #222;
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    
    /* Container */
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    
    /* Card */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      margin-bottom: 30px;
    }
    
    .card h2 {
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.1);
    }
    
    textarea.form-control {
      min-height: 200px;
      resize: vertical;
    }
    
    .char-counter {
      text-align: right;
      margin-top: 5px;
      font-size: 0.85rem;
      color: #666;
    }
    
    .char-counter.warning {
      color: #f57c00;
    }
    
    .char-counter.danger {
      color: #c62828;
    }
    
    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(106, 27, 154, 0.25);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128C7E 100%);
      margin-top: 10px;
    }
    
    .btn-whatsapp:hover {
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
    }
    
    /* Updates List */
    .updates-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    
    .update-item {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s;
    }
    
    .update-item:hover {
      background: #f8f9fa;
    }
    
    .update-item:last-child {
      border-bottom: none;
    }
    
    .update-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .update-author {
      font-weight: 600;
      color: var(--primary);
    }
    
    .update-time {
      font-size: 0.85rem;
      color: #666;
    }
    
    .update-content {
      color: #333;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    
    /* Status Messages */
    .status-message {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      display: none;
    }
    
    .status-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 0 15px;
      }
      
      .card {
        padding: 20px;
      }
      
      .header h1 {
        font-size: 1.2rem;
      }
    }
    
    /* Back Button */
    .back-btn {
      position: absolute;
      left: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
    <h1><i class="fas fa-train"></i> Administração Beira-Chimoio</h1>
  </div>
  
  <!-- Container -->
  <div class="container">
    <!-- Send Update Card -->
    <div class="card">
      <h2><i class="fas fa-paper-plane"></i> Enviar Actualização</h2>
      
      <div class="form-group">
        <label class="form-label">Seu Nome (como aparecerá na mensagem)</label>
        <input type="text" class="form-control" id="adminName" 
               placeholder="Ex: Administração CFM, Chefe de Estação, etc.">
      </div>
      
      <div class="form-group">
        <label class="form-label">Mensagem da Actualização</label>
        <textarea class="form-control" id="updateMessage" 
                  placeholder="Escreva aqui a actualização completa..."></textarea>
        <div class="char-counter" id="charCounter">
          <span id="charCount">0</span> caracteres
        </div>
      </div>
      
      <button class="btn" id="sendBtn" onclick="sendUpdate()">
        <i class="fas fa-cloud-upload-alt"></i>
        Salvar no Sistema
      </button>
      
      <button class="btn btn-whatsapp" id="whatsappBtn" onclick="shareToWhatsApp()" disabled>
        <i class="fab fa-whatsapp"></i>
        Compartilhar no WhatsApp
      </button>
      
      <!-- Status Messages -->
      <div class="status-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <span>Actualização enviada com sucesso!</span>
      </div>
      
      <div class="status-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Erro ao enviar actualização</span>
      </div>
    </div>
    
    <!-- Recent Updates Card -->
    <div class="card">
      <h2><i class="fas fa-history"></i> Últimas Actualizações</h2>
      <div id="updatesList" class="updates-list">
        <div style="text-align: center; padding: 20px; color: #666;">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Carregando actualizações...</p>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <p>🚄 Sistema de Actualizações CFM - Linha Beira-Chimoio</p>
      <p><small>© 2024 CFM - Todos os direitos reservados</small></p>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÕES
    // ============================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw_WVDXTe6n9NBPTm4ZG-NvlBVt_B4rCFhSnHDsbEPF2IIEyKeGUyqwjNGUI9mWMkGtsQ/exec";
    const LINHA_ID = 'bc'; // Beira-Chimoio
    const LINHA_NOME = 'Beira - Chimoio';
    const LINHA_EMOJI = '🚄';
    
    let lastSavedMessage = '';
    
    // ============================================
    // FUNÇÕES DE UTILIDADE
    // ============================================
    function showMessage(type, text = '') {
      const successEl = document.getElementById('successMessage');
      const errorEl = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      
      // Hide both first
      successEl.style.display = 'none';
      errorEl.style.display = 'none';
      
      // Show appropriate message
      if (type === 'success') {
        successEl.style.display = 'flex';
        setTimeout(() => {
          successEl.style.display = 'none';
        }, 5000);
      } else if (type === 'error') {
        errorText.textContent = text;
        errorEl.style.display = 'flex';
      }
    }
    
    // ============================================
    // CHARACTER COUNTER
    // ============================================
    document.getElementById('updateMessage').addEventListener('input', function() {
      const length = this.value.length;
      const counter = document.getElementById('charCounter');
      const count = document.getElementById('charCount');
      
      count.textContent = length;
      counter.className = 'char-counter';
      
      if (length > 500) counter.classList.add('warning');
      if (length > 1000) counter.classList.add('danger');
      
      // Enable/disable WhatsApp button based on content
      const whatsappBtn = document.getElementById('whatsappBtn');
      whatsappBtn.disabled = length === 0;
    });
    
    // ============================================
    // ENVIAR ACTUALIZAÇÃO
    // ============================================
    async function sendUpdate() {
      const adminName = document.getElementById('adminName').value.trim();
      const message = document.getElementById('updateMessage').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      
      // Validation
      if (!adminName) {
        showMessage('error', 'Digite seu nome');
        return;
      }
      
      if (!message) {
        showMessage('error', 'Digite a mensagem da actualização');
        return;
      }
      
      // Disable button and show loading
      const originalText = sendBtn.innerHTML;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
      sendBtn.disabled = true;
      
      try {
        // Prepare form data
        const formData = new URLSearchParams();
        formData.append('action', 'admin_update');
        formData.append('linha', LINHA_ID);
        formData.append('adminName', adminName);
        formData.append('msg', message);
        
        // Send to Google Apps Script
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: formData.toString()
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Save message for WhatsApp sharing
          lastSavedMessage = message;
          
          // Enable WhatsApp button
          document.getElementById('whatsappBtn').disabled = false;
          
          // Show success message
          showMessage('success');
          
          // Clear form
          document.getElementById('updateMessage').value = '';
          document.getElementById('charCount').textContent = '0';
          document.getElementById('charCounter').className = 'char-counter';
          
          // Reload updates list
          loadRecentUpdates();
          
        } else {
          showMessage('error', result.error || 'Erro ao salvar');
        }
        
      } catch (error) {
        console.error('Erro:', error);
        showMessage('error', 'Erro de conexão com o servidor');
      } finally {
        // Restore button
        sendBtn.innerHTML = originalText;
        sendBtn.disabled = false;
      }
    }
    
    // ============================================
    // COMPARTILHAR NO WHATSAPP
    // ============================================
    function shareToWhatsApp() {
      const adminName = document.getElementById('adminName').value.trim() || 'Administração CFM';
      const message = lastSavedMessage || document.getElementById('updateMessage').value.trim();
      
      if (!message) {
        showMessage('error', 'Não há mensagem para compartilhar');
        return;
      }
      
      // Format WhatsApp message
      const whatsappMessage = encodeURIComponent(
        `*ACTUALIZAÇÃO OFICIAL - CFM ${LINHA_EMOJI}*\n` +
        `*Linha:* ${LINHA_NOME}\n` +
        `*De:* ${adminName}\n` +
        `*Data:* ${new Date().toLocaleString('pt-PT')}\n\n` +
        `${message}\n\n` +
        `_Partilhe com outros passageiros!_`
      );
      
      // Open WhatsApp
      window.open(`https://wa.me/?text=${whatsappMessage}`, '_blank');
    }
    
    // ============================================
    // CARREGAR ACTUALIZAÇÕES RECENTES
    // ============================================
    async function loadRecentUpdates() {
      const updatesList = document.getElementById('updatesList');
      
      try {
        const response = await fetch(`${GAS_URL}?action=updates&linha=${LINHA_ID}&t=${Date.now()}`);
        const data = await response.json();
        
        if (data.success && data.updates && data.updates.length > 0) {
          // Sort by timestamp (newest first)
          const updates = data.updates.sort((a, b) => 
            new Date(b.timestamp) - new Date(a.timestamp)
          );
          
          // Take only last 10
          const recentUpdates = updates.slice(0, 10);
          
          // Generate HTML
          updatesList.innerHTML = recentUpdates.map(update => {
            const time = new Date(update.timestamp).toLocaleString('pt-PT', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });
            
            return `
              <div class="update-item">
                <div class="update-header">
                  <span class="update-author">${update.adminName}</span>
                  <span class="update-time">${time}</span>
                </div>
                <div class="update-content">${update.textoOriginal}</div>
              </div>
            `;
          }).join('');
          
        } else {
          updatesList.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #666;">
              <i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 10px;"></i>
              <p>Nenhuma actualização ainda</p>
              <p><small>Seja o primeiro a enviar uma actualização!</small></p>
            </div>
          `;
        }
        
      } catch (error) {
        console.error('Erro ao carregar actualizações:', error);
        updatesList.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #c62828;">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p>Erro ao carregar actualizações</p>
            <p><small>${error.message}</small></p>
          </div>
        `;
      }
    }
    
    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      console.log('=== ADMIN BEIRA-CHIMOIO INICIADO ===');
      
      // Set default admin name if not set
      const adminName = localStorage.getItem('cfm_admin_name');
      if (adminName) {
        document.getElementById('adminName').value = adminName;
      }
      
      // Save admin name when typing
      document.getElementById('adminName').addEventListener('input', function() {
        localStorage.setItem('cfm_admin_name', this.value);
      });
      
      // Load recent updates
      loadRecentUpdates();
      
      // Auto-refresh every 30 seconds
      setInterval(loadRecentUpdates, 30000);
    });
  </script>
</body>
</html>
