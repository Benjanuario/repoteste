<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Admin CFM - Multi-linhas</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================
    VARIÁVEIS E RESET
    ============================================ */
    :root {
      --primary: #0d47a1;
      --primary-light: #1565c0;
      --primary-dark: #0d47a1;
      --secondary: #1976d2;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
      --dark: #212121;
      --light: #f5f5f5;
      --gray: #757575;
      --gray-light: #e0e0e0;
      --white: #ffffff;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ============================================
    LOGIN SCREEN
    ============================================ */
    .login-container {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 450px;
      padding: 40px;
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .subtitle {
      color: var(--gray);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--gray-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.2);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      background: var(--gray);
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .btn-whatsapp {
      background: #25D366;
      color: white;
    }

    .btn-whatsapp:hover {
      background: #128C7E;
    }

    .error {
      color: var(--danger);
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .success {
      color: var(--success);
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .loader {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .loader i {
      font-size: 2rem;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .switch-form {
      margin-top: 20px;
      color: var(--gray);
    }

    .switch-form a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* ============================================
    ADMIN PANEL
    ============================================ */
    .admin-panel {
      display: none;
      width: 100%;
      max-width: 1400px;
      min-height: 100vh;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .panel-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-info span {
      font-size: 0.9rem;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      background: var(--success);
      border-radius: 50%;
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .panel-content {
      display: flex;
      height: calc(100vh - 80px);
    }

    .sidebar {
      width: 250px;
      background: var(--light);
      padding: 20px;
      border-right: 1px solid var(--gray-light);
      overflow-y: auto;
    }

    .menu-item {
      padding: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 10px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item:hover {
      background: var(--gray-light);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gray-light);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-actions {
      display: flex;
      gap: 10px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid var(--gray-light);
    }

    th {
      background: var(--light);
      font-weight: 600;
      color: var(--dark);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .badge-primary {
      background: rgba(13, 71, 161, 0.1);
      color: var(--primary);
    }

    .badge-success {
      background: rgba(76, 175, 80, 0.1);
      color: var(--success);
    }

    .badge-warning {
      background: rgba(255, 152, 0, 0.1);
      color: var(--warning);
    }

    .badge-danger {
      background: rgba(244, 67, 54, 0.1);
      color: var(--danger);
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .actions-cell {
      display: flex;
      gap: 5px;
    }

    .action-btn {
      padding: 6px 10px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .action-btn.copy {
      background: var(--gray-light);
      color: var(--dark);
    }

    .action-btn.copy:hover {
      background: var(--gray);
    }

    .action-btn.delete {
      background: var(--danger);
      color: white;
    }

    .action-btn.delete:hover {
      background: #d32f2f;
    }

    /* ============================================
    MODAL
    ============================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px;
      background: var(--primary);
      color: white;
      border-radius: var(--radius) var(--radius) 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--gray-light);
    }

    /* ============================================
    TOAST
    ============================================ */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      transform: translateX(120%);
      transition: transform 0.3s ease-out;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.warning { background: var(--warning); }
    .toast.info { background: var(--primary); }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="login-container" id="loginScreen">
    <div class="logo">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h1>Bem-vindo ao Admin CFM</h1>
    <p class="subtitle">Sistema de Actualizações Multi-linhas</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginIdentifier">Email ou Telefone</label>
        <input type="text" id="loginIdentifier" placeholder="ex: 848960732 ou admin@cfm.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <div class="loader" id="loginLoader">
      <i class="fas fa-spinner"></i>
    </div>
    <div class="error" id="loginError"></div>
  </div>

  <!-- PAINEL ADMIN -->
  <div class="admin-panel" id="adminPanel">
    <div class="panel-header">
      <div class="panel-title">Painel Administrativo CFM</div>
      <div class="user-info">
        <div class="online-dot"></div>
        <span id="currentUserDisplay">Carregando...</span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Sair
      </button>
    </div>
    <div class="panel-content">
      <div class="sidebar">
        <div class="menu-item active" data-section="dashboard">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </div>
        <div class="menu-item" data-section="updates">
          <i class="fas fa-bullhorn"></i>
          <span>Actualizações</span>
        </div>
        <div class="menu-item" data-section="chat">
          <i class="fas fa-comments"></i>
          <span>Chat</span>
        </div>
        <div class="menu-item" data-section="admins">
          <i class="fas fa-user-shield"></i>
          <span>Administradores</span>
        </div>
        <div class="menu-item" data-section="lines">
          <i class="fas fa-train"></i>
          <span>Linhas</span>
        </div>
        <div class="menu-item" data-section="settings">
          <i class="fas fa-cog"></i>
          <span>Configurações</span>
        </div>
      </div>
      <div class="main-content" id="sectionsContainer">
        <!-- Conteúdo dinâmico será carregado aqui -->
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // 🔧 CONFIGURAÇÃO - SUBSTITUA PELA URL DO SEU WEB APP GAS
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxfJkMFz6z5d3essonsNUVOaCN1dDDlIozLixQ0y31wsqU3-lNxIABRwNzh1_MW58gv/exec'; // <--- COLOCA AQUI A URL CORRETA

    // Dados globais
    let currentUser = null;
    let currentToken = null;
    let currentSection = 'dashboard';
    let userPermittedLines = [];
    const LINHAS = {
      'bm': { nome: 'Beira - Moatize', emoji: '🚂' },
      'bmar': { nome: 'Beira - Marromeu', emoji: '🚆' },
      'bc': { nome: 'Beira - Chimoio', emoji: '🚄' }
    };

    // Função de API
    async function apiCall(action, data = {}, method = 'POST') {
      try {
        const params = new URLSearchParams();
        params.append('action', action);
        if (currentToken) {
          params.append('token', currentToken);
        }
        Object.keys(data).forEach(key => {
          params.append(key, data[key]);
        });

        const response = await fetch(GAS_URL, {
          method: method,
          body: params
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        throw error;
      }
    }

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!identifier || !password) {
        showToast('Erro', 'Preencha todos os campos', 'error');
        return;
      }

      const btn = document.getElementById('loginBtn');
      const loader = document.getElementById('loginLoader');
      const errorDiv = document.getElementById('loginError');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
      loader.style.display = 'block';
      errorDiv.textContent = '';

      try {
        const result = await apiCall('login', { identifier, password });

        if (result.success) {
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          currentToken = result.token;
          currentUser = result.user;
          userPermittedLines = (result.user.linhas_permitidas || '').split(',').filter(l => l);

          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          document.getElementById('currentUserDisplay').textContent = currentUser.fullName;

          loadSection('dashboard');
          startPolling();
        } else {
          errorDiv.textContent = result.error || 'Falha no login.';
        }
      } catch (error) {
        errorDiv.textContent = 'Erro de conexão com o servidor.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
        loader.style.display = 'none';
      }
    });

    // VALIDAR SESSÃO
    async function validateSession() {
      const token = localStorage.getItem('token');
      if (!token) return false;

      try {
        const result = await apiCall('validate_session', { token });
        if (result.success) {
          currentToken = token;
          currentUser = result.user;
          userPermittedLines = (result.user.linhas_permitidas || '').split(',').filter(l => l);
          return true;
        } else {
          throw new Error(result.error);
        }
      } catch (error) {
        localStorage.clear();
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        showToast('Erro', 'Sessão expirada. Faça login novamente.', 'error');
        return false;
      }
    }

    // CARREGAR SESSÃO
    async function loadSession() {
      if (await validateSession()) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('currentUserDisplay').textContent = currentUser.fullName;
        loadSection('dashboard');
        startPolling();
      }
    }

    // CARREGAR SEÇÃO
    function loadSection(section) {
      currentSection = section;
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      document.querySelector(`[data-section="${section}"]`).classList.add('active');

      switch (section) {
        case 'dashboard':
          loadDashboard();
          break;
        case 'updates':
          loadUpdatesSection();
          break;
        case 'chat':
          loadChatSection();
          break;
        case 'admins':
          loadAdminsSection();
          break;
        case 'lines':
          loadLinesSection();
          break;
        case 'settings':
          loadSettingsSection();
          break;
        default:
          document.getElementById('sectionsContainer').innerHTML = '<h2>Seção não encontrada</h2>';
      }
    }

    // DASHBOARD
    async function loadDashboard() {
      const container = document.getElementById('sectionsContainer');
      try {
        if (userPermittedLines.length === 0) {
          container.innerHTML = `<div class="section"><div style="text-align: center; padding: 40px;"><i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--warning); margin-bottom: 20px;"></i><h3>Sem permissões</h3><p>Você não tem acesso a nenhuma linha. Contacte o administrador do sistema.</p></div></div>`;
          return;
        }

        let html = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-tachometer-alt"></i> Dashboard</h2><div class="section-actions"><button class="btn btn-primary" id="quickSendUpdate"><i class="fas fa-plus"></i> Nova Actualização</button><button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Actualizar</button></div></div>`;

        html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">`;
        for (const linhaId of userPermittedLines) {
          const config = LINHAS[linhaId];
          if (config) {
            html += `<div style="padding: 20px; background: var(--light); border-radius: var(--radius-sm); border-left: 4px solid var(--primary);"><h4>${config.emoji} ${config.nome}</h4><p>Gerencie actualizações e chat para esta linha.</p><button class="btn btn-outline" onclick="loadSection('updates')"><i class="fas fa-arrow-right"></i> Acessar</button></div>`;
          }
        }
        html += `</div>`;

        html += `<div style="margin-top: 30px; padding: 20px; background: var(--primary-light); border-radius: var(--radius-sm);"><h4 style="color: white; margin-bottom: 10px;"><i class="fas fa-info-circle"></i> Sobre as Linhas</h4><p style="color: white; font-size: 0.9rem;">Você tem acesso a ${userPermittedLines.length} linha(s). Cada linha tem suas próprias abas no Google Sheets para actualizações e chat.</p></div></div>`;

        container.innerHTML = html;

        // Eventos
        document.getElementById('refreshBtn').addEventListener('click', () => {
          refreshCurrentSection();
          showToast('Actualizado', 'Dados actualizados com sucesso', 'success');
        });

        document.getElementById('quickSendUpdate').addEventListener('click', () => {
          openSendUpdateModal();
        });

      } catch (error) {
        container.innerHTML = `<div class="section"><div style="text-align: center; padding: 40px; color: var(--danger);"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar dashboard</h3><p>${error.message}</p></div></div>`;
      }
    }

    // ACTUALIZAÇÕES
    async function loadUpdatesSection() {
      const container = document.getElementById('sectionsContainer');
      try {
        let html = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-bullhorn"></i> Actualizações</h2><div class="section-actions"><button class="btn btn-primary" onclick="openSendUpdateModal()"><i class="fas fa-plus"></i> Nova Actualização</button><button class="btn btn-outline" onclick="loadSection('updates')"><i class="fas fa-sync-alt"></i> Actualizar</button></div></div>`;

        if (userPermittedLines.length === 0) {
          html += `<div style="text-align: center; padding: 40px;"><i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--warning); margin-bottom: 20px;"></i><h3>Sem permissões</h3><p>Você não tem acesso a nenhuma linha.</p></div>`;
          container.innerHTML = html;
          return;
        }

        html += `<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">`;
        userPermittedLines.forEach(linhaId => {
          const config = LINHAS[linhaId];
          html += `<button class="btn btn-outline" style="flex: 1; min-width: 120px;" onclick="loadUpdatesForLine('${linhaId}')">${config.emoji} ${config.nome}</button>`;
        });
        html += `</div>`;

        html += `<div class="table-container"><table><thead><tr><th>Linha</th><th>Actualização</th><th>Admin</th><th>Hora</th><th>Acções</th></tr></thead><tbody id="updatesTableBody"><tr><td colspan="5" style="text-align: center; color: var(--gray);"><i class="fas fa-spinner fa-spin"></i> Carregando actualizações...</td></tr></tbody></table></div>`;

        container.innerHTML = html;

        // Carregar as actualizações da primeira linha permitida
        if (userPermittedLines.length > 0) {
          loadUpdatesForLine(userPermittedLines[0]);
        }

      } catch (error) {
        container.innerHTML = `<div class="section"><div style="text-align: center; padding: 40px; color: var(--danger);"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar actualizações</h3><p>${error.message}</p></div></div>`;
      }
    }

    async function loadUpdatesForLine(linhaId) {
      try {
        const result = await apiCall('get_history', { linha: linhaId });
        const table = document.getElementById('updatesTableBody');

        if (result.success && result.updates) {
          if (result.updates.length === 0) {
            table.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--gray);"><i class="fas fa-info-circle"></i><p>Nenhuma actualização encontrada</p></td></tr>`;
            return;
          }

          table.innerHTML = result.updates.map(update => `
            <tr>
              <td><span class="badge badge-primary">${LINHAS[linhaId].emoji} ${LINHAS[linhaId].nome}</span></td>
              <td><div style="max-width: 300px;">${update.textoOriginal.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</div></td>
              <td>${update.adminName}</td>
              <td>${new Date(update.timestamp).toLocaleString()}</td>
              <td class="actions-cell">
                <button class="action-btn copy" onclick="copyToClipboard('${update.textoOriginal.replace(/'/g, "\\'")}')"><i class="fas fa-copy"></i></button>
                <button class="btn btn-whatsapp" style="padding: 5px 10px; font-size: 0.8rem;" onclick="shareOnWhatsApp('${update.textoOriginal.replace(/'/g, "\\'")}', '${LINHAS[linhaId].nome}')"><i class="fab fa-whatsapp"></i></button>
              </td>
            </tr>
          `).join('');
        } else {
          table.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger);"><i class="fas fa-exclamation-circle"></i>Erro ao carregar actualizações</td></tr>`;
        }
      } catch (error) {
        const table = document.getElementById('updatesTableBody');
        table.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger);"><i class="fas fa-exclamation-circle"></i>Erro ao carregar actualizações</td></tr>`;
      }
    }

    // CHAT
    async function loadChatSection() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-comments"></i> Chat dos Passageiros</h2><div class="section-actions"><button class="btn btn-outline" onclick="loadSection('chat')"><i class="fas fa-sync-alt"></i> Actualizar</button></div></div><div style="text-align: center; padding: 40px;"><i class="fas fa-comments" style="font-size: 3rem; color: var(--gray); margin-bottom: 20px;"></i><h3>Sistema de Chat em Desenvolvimento</h3><p>Esta funcionalidade será implementada em breve.</p></div></div>`;
    }

    // ADMINISTRADORES
    async function loadAdminsSection() {
      if (currentUser.role !== 'superadmin') {
        document.getElementById('sectionsContainer').innerHTML = `<div class="section"><div style="text-align: center; padding: 40px;"><i class="fas fa-user-shield" style="font-size: 3rem; color: var(--warning); margin-bottom: 20px;"></i><h3>Acesso Restrito</h3><p>Esta funcionalidade está disponível apenas para Super Administradores.</p></div></div>`;
        return;
      }

      const container = document.getElementById('sectionsContainer');
      try {
        let html = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-user-shield"></i> Gestão de Administradores</h2><div class="section-actions"><button class="btn btn-primary" onclick="openNewAdminModal()"><i class="fas fa-plus"></i> Novo Admin</button><button class="btn btn-outline" onclick="loadAdminsSection()"><i class="fas fa-sync-alt"></i> Actualizar</button></div></div>`;

        const result = await apiCall('get_users');
        if (result.success && result.users) {
          const admins = result.users.filter(u => u.role === 'admin' || u.role === 'superadmin');
          if (admins.length > 0) {
            html += `<div class="table-container"><table><thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Nível</th><th>Linhas</th><th>Acções</th></tr></thead><tbody>`;
            admins.forEach(admin => {
              html += `<tr><td>${admin.fullName}</td><td>${admin.email}</td><td>${admin.phone}</td><td>${admin.role}</td><td>${admin.linhas_permitidas || 'Todas'}</td><td class="actions-cell"><button class="action-btn" onclick="editAdmin('${admin.id}')"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="suspendAdmin('${admin.id}')"><i class="fas fa-user-slash"></i></button></td></tr>`;
            });
            html += `</tbody></table></div>`;
          } else {
            html += `<div style="text-align: center; padding: 40px;"><i class="fas fa-user-shield" style="font-size: 3rem; color: var(--gray); margin-bottom: 20px;"></i><h3>Nenhum administrador encontrado</h3></div>`;
          }
        } else {
          html += `<div style="text-align: center; padding: 40px; color: var(--danger);"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar administradores</h3><p>${result.error || 'Falha na comunicação'}</p></div>`;
        }

        html += `</div>`;
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="section"><div style="text-align: center; padding: 40px; color: var(--danger);"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar administradores</h3><p>${error.message}</p></div></div>`;
      }
    }

    // LINHAS
    async function loadLinesSection() {
      const container = document.getElementById('sectionsContainer');
      let html = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-train"></i> Linhas de Comboio</h2></div>`;

      html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">`;
      for (const [id, config] of Object.entries(LINHAS)) {
        html += `<div style="padding: 20px; background: var(--light); border-radius: var(--radius-sm); border-left: 4px solid var(--primary);"><h3>${config.emoji} ${config.nome}</h3><p>Gerencie actualizações e chat para esta linha.</p><button class="btn btn-outline" onclick="loadSection('updates')"><i class="fas fa-arrow-right"></i> Acessar</button></div>`;
      }
      html += `</div></div>`;

      container.innerHTML = html;
    }

    // CONFIGURAÇÕES
    async function loadSettingsSection() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `<div class="section"><div class="section-header"><h2 class="section-title"><i class="fas fa-cog"></i> Configurações</h2></div><div style="text-align: center; padding: 40px;"><i class="fas fa-cog" style="font-size: 3rem; color: var(--gray); margin-bottom: 20px;"></i><h3>Configurações em Desenvolvimento</h3><p>Esta funcionalidade será implementada em breve.</p></div></div>`;
    }

    // MENU
    document.querySelectorAll('.menu-item').forEach(item => {
      item.addEventListener('click', () => {
        const section = item.dataset.section;
        loadSection(section);
      });
    });

    // LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      showToast('Sucesso', 'Sessão encerrada.', 'success');
    });

    // TOAST
    function showToast(title, message, type) {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'times-circle' : type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-circle' : 'info-circle'}"></i> ${title}: ${message}`;
      toast.className = `toast ${type}`;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // MODAL
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showLoader() {
      document.getElementById('modalLoader').style.display = 'block';
    }

    function hideLoader() {
      document.getElementById('modalLoader').style.display = 'none';
    }

    // FUNÇÕES AUXILIARES
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copiado', 'Texto copiado para a área de transferência', 'success');
      }).catch(() => {
        showToast('Erro', 'Não foi possível copiar o texto', 'error');
      });
    }

    function shareOnWhatsApp(text, linha) {
      const encodedText = encodeURIComponent(`*CFM - ${linha}*\n\n${text}`);
      window.open(`https://wa.me/?text=${encodedText}`, '_blank');
    }

    function refreshCurrentSection() {
      loadSection(currentSection);
    }

    // MODAL: ENVIAR ACTUALIZAÇÃO
    function openSendUpdateModal(linhaId = null) {
      if (!linhaId && userPermittedLines.length > 0) {
        linhaId = userPermittedLines[0];
      }

      const modalHtml = `
        <div class="modal-overlay" id="sendUpdateModal">
          <div class="modal">
            <div class="modal-header">
              <h2 class="modal-title"><i class="fas fa-bullhorn"></i> Nova Actualização</h2>
              <button class="modal-close" onclick="closeModal('sendUpdateModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="updateLinha">Linha</label>
                <select id="updateLinha" class="form-control">
                  ${userPermittedLines.map(id => `<option value="${id}" ${id === linhaId ? 'selected' : ''}>${LINHAS[id].emoji} ${LINHAS[id].nome}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label for="updateMessage">Mensagem *</label>
                <textarea id="updateMessage" class="form-control" placeholder="Escreva a actualização aqui..." rows="4" required maxlength="500" oninput="updateCharCount()"></textarea>
                <small style="color: var(--gray);">Máximo 500 caracteres. <span id="charCount">0</span>/500</small>
              </div>
              <div class="form-group">
                <label for="updateAdminName">Nome do Admin *</label>
                <input type="text" id="updateAdminName" class="form-control" placeholder="Seu nome ou apelido" required maxlength="50" value="${currentUser.fullName}">
              </div>
              <div class="success" id="successDiv" style="display: none;"></div>
              <div class="error" id="errorDiv" style="display: none;"></div>
              <div class="loader" id="modalLoader" style="display: none;">
                <i class="fas fa-spinner"></i> Enviando actualização...
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('sendUpdateModal')">Cancelar</button>
              <button class="btn" onclick="sendUpdate()">Enviar Actualização</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      updateCharCount();
      openModal('sendUpdateModal');
    }

    function updateCharCount() {
      const textarea = document.getElementById('updateMessage');
      const count = document.getElementById('charCount');
      count.textContent = textarea.value.length;
    }

    async function sendUpdate() {
      const linha = document.getElementById('updateLinha').value;
      const message = document.getElementById('updateMessage').value.trim();
      const adminName = document.getElementById('updateAdminName').value.trim();

      if (!message || !adminName) {
        showToast('Erro', 'Preencha todos os campos obrigatórios.', 'error');
        return;
      }

      if (message.length > 500) {
        showToast('Erro', 'Mensagem excede 500 caracteres.', 'error');
        return;
      }

      const sanitizedMessage = message.replace(/<[^>]*>/g, '').replace(/[<>'"`]/g, '');
      const sanitizedAdminName = adminName.replace(/<[^>]*>/g, '').replace(/[<>'"`]/g, '');

      const successDiv = document.getElementById('successDiv');
      const errorDiv = document.getElementById('errorDiv');
      const btn = document.querySelector('#sendUpdateModal .modal-footer .btn');
      const loader = document.getElementById('modalLoader');

      btn.disabled = true;
      loader.style.display = 'block';
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      try {
        const result = await apiCall('admin_update', {
          linha: linha,
          msg: sanitizedMessage,
          adminName: sanitizedAdminName
        });

        if (result.success) {
          successDiv.innerHTML = `
            <div class="success-message">
              <div class="success-message-header">
                <i class="fas fa-check-circle"></i>
                <h3>Actualização enviada com sucesso!</h3>
              </div>
              <p><strong>Linha:</strong> ${LINHAS[linha].emoji} ${LINHAS[linha].nome}</p>
              <p><strong>Mensagem:</strong> ${sanitizedMessage}</p>
              <div class="success-actions">
                <button class="btn btn-whatsapp" onclick="shareOnWhatsApp('${sanitizedMessage.replace(/'/g, "\\'")}', '${LINHAS[linha].nome}')">
                  <i class="fab fa-whatsapp"></i> Partilhar via WhatsApp
                </button>
                <button class="btn btn-outline" onclick="closeModal('sendUpdateModal')">
                  <i class="fas fa-times"></i> Fechar
                </button>
              </div>
            </div>
          `;
          successDiv.style.display = 'block';

          // Resetar formulário mas manter valores
          document.getElementById('updateMessage').value = sanitizedMessage;
          document.getElementById('updateAdminName').value = sanitizedAdminName;
          document.getElementById('charCount').textContent = sanitizedMessage.length;

          // Mostrar notificação
          showToast('Sucesso', 'Actualização enviada com sucesso!', 'success');

          // Atualizar dashboard
          setTimeout(() => {
            refreshCurrentSection();
          }, 1000);
        } else {
          throw new Error(result.error || 'Falha ao enviar');
        }
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }

    // MODAL: NOVO ADMIN
    function openNewAdminModal() {
      if (currentUser.role !== 'superadmin') {
        showToast('Erro', 'Acesso negado.', 'error');
        return;
      }

      const modalHtml = `
        <div class="modal-overlay" id="newAdminModal">
          <div class="modal">
            <div class="modal-header">
              <h2 class="modal-title"><i class="fas fa-user-plus"></i> Criar Novo Administrador</h2>
              <button class="modal-close" onclick="closeModal('newAdminModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-row">
                <div class="form-group">
                  <label for="adminFullName">Nome Completo *</label>
                  <input type="text" id="adminFullName" class="form-control" placeholder="João da Silva" required maxlength="50" oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ\\s]/g, '')">
                  <small style="color: var(--gray);">Apenas letras e espaços (max 50)</small>
                </div>
                <div class="form-group">
                  <label for="adminNickname">Apelido (opcional)</label>
                  <input type="text" id="adminNickname" class="form-control" placeholder="joao_silva" maxlength="20" oninput="this.value = this.value.replace(/[^A-Za-z0-9_]/g, '')">
                  <small style="color: var(--gray);">Letras, números e sublinhado (max 20)</small>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="adminEmail">Email *</label>
                  <input type="email" id="adminEmail" class="form-control" placeholder="joao@empresa.com" required>
                </div>
                <div class="form-group">
                  <label for="adminPhone">Telefone (9 dígitos) *</label>
                  <input type="tel" id="adminPhone" class="form-control" placeholder="848960732" required pattern="[8][2-7][0-9]{7}" maxlength="9">
                  <small style="color: var(--gray);">Formato: 84xxxxxxx</small>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="adminPassword">Senha *</label>
                  <input type="password" id="adminPassword" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="form-group">
                  <label for="adminRole">Nível de Acesso</label>
                  <select id="adminRole" class="form-control">
                    <option value="admin">Administrador</option>
                    <option value="superadmin">Super Administrador</option>
                  </select>
                </div>
              </div>
              <div class="form-group" id="linhasPermitidasGroup" style="display: none;">
                <label for="adminLinhas">Linhas Permitidas</label>
                <select id="adminLinhas" class="form-control" multiple>
                  ${Object.entries(LINHAS).map(([id, config]) => `<option value="${id}">${config.emoji} ${config.nome}</option>`).join('')}
                </select>
                <small style="color: var(--gray);">Segure Ctrl/Cmd para selecionar múltiplas linhas</small>
              </div>
              <div class="success" id="newAdminSuccess" style="display: none;"></div>
              <div class="error" id="newAdminError" style="display: none;"></div>
              <div class="loader" id="modalLoaderNew" style="display: none;">
                <i class="fas fa-spinner"></i> Criando administrador...
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('newAdminModal')">Cancelar</button>
              <button class="btn" onclick="createNewAdmin()">Criar Administrador</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      document.getElementById('adminRole').addEventListener('change', function() {
        document.getElementById('linhasPermitidasGroup').style.display = this.value === 'admin' ? 'block' : 'none';
      });
      openModal('newAdminModal');
    }

    async function createNewAdmin() {
      const fullName = document.getElementById('adminFullName').value.trim();
      const nickname = document.getElementById('adminNickname').value.trim();
      const email = document.getElementById('adminEmail').value.trim();
      const phone = document.getElementById('adminPhone').value.trim();
      const password = document.getElementById('adminPassword').value;
      const role = document.getElementById('adminRole').value;
      const linhas = role === 'admin' ? Array.from(document.getElementById('adminLinhas').selectedOptions).map(opt => opt.value).join(',') : '';

      if (!fullName || !email || !phone || !password) {
        showToast('Erro', 'Preencha todos os campos obrigatórios.', 'error');
        return;
      }

      if (phone.length !== 9 || !/^[8][2-7]/.test(phone)) {
        showToast('Erro', 'Telefone inválido. Deve ter 9 dígitos e começar com 84-87.', 'error');
        return;
      }

      const successDiv = document.getElementById('newAdminSuccess');
      const errorDiv = document.getElementById('newAdminError');
      const btn = document.querySelector('#newAdminModal .modal-footer .btn');
      const loader = document.getElementById('modalLoaderNew');

      btn.disabled = true;
      loader.style.display = 'block';
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      try {
        const result = await apiCall('create_user', {
          fullName: fullName,
          nickname: nickname,
          email: email,
          phone: phone,
          password: password,
          role: role,
          linhas_permitidas: linhas
        });

        if (result.success) {
          successDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`;
          successDiv.style.display = 'block';
          showToast('Sucesso', 'Administrador criado com sucesso!', 'success');
          showToast('Informação', 'Email com instruções será enviado ao novo administrador', 'info');

          // Fechar modal e actualizar lista
          closeModal('newAdminModal');
          loadAdminsSection();
        } else {
          throw new Error(result.error || 'Falha ao criar administrador');
        }
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }

    // FUNÇÕES DE ADMIN
    function editAdmin(adminId) {
      showToast('Informação', 'Funcionalidade de edição em desenvolvimento', 'info');
    }

    async function suspendAdmin(adminId) {
      if (confirm('Tem certeza que deseja suspender este administrador?\nEle não poderá aceder ao sistema até ser reativado.')) {
        showLoader();
        try {
          // Nota: Você precisaria implementar esta função no GAS
          showToast('Informação', 'Funcionalidade de suspensão será implementada', 'info');
          loadAdminsSection();
        } catch (error) {
          showToast('Erro', 'Falha ao suspender administrador', 'error');
        } finally {
          hideLoader();
        }
      }
    }

    // POLLING
    function startPolling() {
      // Atualiza badges a cada 30 segundos
      setInterval(async () => {
        if (currentUser) {
          // Exemplo: atualizar badges
          // const stats = await getLineStats(linhaId);
          // ...
        }
      }, 30000);
    }

    // INICIAR
    window.onload = () => {
      loadSession();
    };
  </script>
</body>
