<header>Download do Bloco de Planificação</header>
<main>
  <h2>Insira o Código para Baixar o Bloco</h2>

  <div id="codigo-promocional"></div>

  <div class="input-container" id="input-codigo">
    <input type="text" id="codigo-acesso" placeholder="digita aqui" maxlength="8">
    <span id="feedback-codigo" style="color:#dc3545; font-size:13px; display:block; text-align:center; margin-top:5px;"></span>
    <button class="confirmar-btn" onclick="validarCodigo()">Confirmar</button>
  </div>

  <div class="progress-container" id="progress-container">
    <div id="progress-status">Preparando geração do bloco...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="mensagem" class="mensagem"></div>

<script>
const URL_APP = "https://script.google.com/macros/s/AKfycby-l_VBnTuG98erRyPk0NA_QZvOJQnuix4P2zp2gnQCwvx5QFG9L9WgydoIHeMpofILnA/exec";
const inputCodigo = document.getElementById('codigo-acesso');
const feedback = document.getElementById('feedback-codigo');
const progressContainer = document.getElementById('progress-container');
const progressFill = document.getElementById('progress-fill');
const progressStatus = document.getElementById('progress-status');

inputCodigo.addEventListener('input', () => {
  let valor = inputCodigo.value.toUpperCase();
  const novoValor = valor.replace(/[^A-Z0-9]/g, '');
  if(valor !== novoValor){
    feedback.innerText = "❌ Apenas caracteres alfanuméricos são permitidos!";
  } else {
    feedback.innerText = "";
  }
  inputCodigo.value = novoValor.slice(0, 8);
});

const codigosPromo = ['2514DC16', '7655GT27', '8K7814D3', 'TD171705', 'J66BGK27'];
document.getElementById('codigo-promocional').textContent = codigosPromo[Math.floor(Math.random() * codigosPromo.length)];

function updateProgress(percent, message) {
  progressFill.style.width = percent + '%';
  progressStatus.textContent = message;
}

async function validarCodigo(){
  const codigo = inputCodigo.value.trim().toUpperCase();
  const msg = document.getElementById('mensagem');
  
  if(codigo.length !== 8){
    msg.style.color = "#dc3545";
    msg.innerText = "❌ O código deve ter 8 caracteres.";
    return;
  }
  
  progressContainer.style.display = 'block';
  updateProgress(10, 'Verificando código...');
  msg.style.color = "#007BFF";
  msg.innerHTML = '🔍 Verificando o Código <span class="spinner"></span>';
  
  try {
    const response = await fetch(`${URL_APP}?codigo=${codigo}`, { 
      method:'GET', 
      mode:'cors' 
    });
    
    if(!response.ok) throw new Error('Serviço indisponível');
    
    const data = await response.json();
    
    if(data && data.valido){
      updateProgress(30, 'Código válido! Preparando bloco...');
      
      const planoDataJSON = sessionStorage.getItem("planoData");
      const planoConfigJSON = localStorage.getItem("planoConfig");
      
      if(!planoDataJSON || !planoConfigJSON){
        msg.style.color = "#dc3545";
        msg.innerHTML = "❌ Nenhum plano encontrado. Gere o plano antes de tentar desbloquear.";
        progressContainer.style.display = 'none';
        return;
      }
      
      const planoData = JSON.parse(planoDataJSON);
      const planoConfig = JSON.parse(planoConfigJSON);
      const numAulas = planoConfig.aulas || 1;
      
      updateProgress(50, `Gerando bloco com ${numAulas} aulas...`);
      
      await generateBlocoPDF(planoData, numAulas, data.restante);
      
      updateProgress(100, 'Bloco gerado com sucesso!');
      
    } else {
      msg.style.color = "#dc3545";
      msg.innerText = `❌ ${data && data.msg ? data.msg : 'Código inválido'}`;
      progressContainer.style.display = 'none';
    }
  } catch (error) {
    console.error('Erro:', error);
    msg.style.color = "#dc3545";
    msg.innerText = "❌ Erro ao validar código. Tente novamente.";
    progressContainer.style.display = 'none';
  }
}

// ====================================================
// GERAÇÃO DO PDF - COM PÁGINA DE DECLARAÇÃO
// ====================================================

async function generateBlocoPDF(planoData, numAulas, restante) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  
  // ====================================================
  // PÁGINA 1: CAPA (VERTICAL)
  // ====================================================
  updateProgress(60, 'Criando capa...');
  
  doc = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });
  
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  
  // Fundo branco
  doc.setFillColor(255, 255, 255);
  doc.rect(0, 0, pageWidth, pageHeight, 'F');
  
  // Títulos
  doc.setFont("times", "bold");
  doc.setFontSize(28);
  doc.setTextColor(0, 0, 0);
  doc.text('REPÚBLICA DE MOÇAMBIQUE', pageWidth / 2, 60, { align: 'center' });
  
  doc.setFontSize(22);
  doc.text('MINISTÉRIO DA EDUCAÇÃO', pageWidth / 2, 80, { align: 'center' });
  
  // Linha divisória
  doc.setDrawColor(0, 0, 0);
  doc.setLineWidth(1);
  doc.line(30, 100, pageWidth - 30, 100);
  
  // Título principal
  doc.setFontSize(32);
  doc.text('BLOCO DE PLANIFICAÇÃO', pageWidth / 2, 130, { align: 'center' });
  
  // Informações
  doc.setFontSize(18);
  doc.setFont("times", "bold");
  
  let y = 160;
  const lineHeight = 12;
  
  // Escola
  doc.text('ESCOLA:', pageWidth / 2, y, { align: 'center' });
  if (planoData.escola && planoData.escola.trim()) {
    doc.setFont("times", "normal");
    doc.text(planoData.escola, pageWidth / 2, y + 6, { align: 'center' });
    doc.setFont("times", "bold");
  }
  y += lineHeight + 10;
  
  // Professor
  doc.text('PROFESSOR:', pageWidth / 2, y, { align: 'center' });
  if (planoData.professor && planoData.professor.trim()) {
    doc.setFont("times", "normal");
    doc.text(planoData.professor, pageWidth / 2, y + 6, { align: 'center' });
    doc.setFont("times", "bold");
  }
  y += lineHeight + 10;
  
  // Disciplina
  doc.text('DISCIPLINA:', pageWidth / 2, y, { align: 'center' });
  if (planoData.disciplina && planoData.disciplina.trim()) {
    doc.setFont("times", "normal");
    doc.text(planoData.disciplina, pageWidth / 2, y + 6, { align: 'center' });
    doc.setFont("times", "bold");
  }
  y += lineHeight + 10;
  
  // Classe
  doc.text('CLASSE:', pageWidth / 2, y, { align: 'center' });
  if (planoData.classe && planoData.classe.trim()) {
    doc.setFont("times", "normal");
    doc.text(planoData.classe, pageWidth / 2, y + 6, { align: 'center' });
  }
  
  // Rodapé
  doc.setFontSize(12);
  doc.setFont("times", "normal");
  doc.setTextColor(100, 100, 100);
  doc.text(`Bloco com ${numAulas} aulas - ${(numAulas * 2) + 2} páginas`, pageWidth / 2, pageHeight - 40, { align: 'center' });
  doc.text(`Data de geração: ${new Date().toLocaleDateString('pt-MZ')}`, pageWidth / 2, pageHeight - 30, { align: 'center' });
  
  // ====================================================
  // PÁGINA 2: DECLARAÇÃO PEDAGÓGICA
  // ====================================================
  updateProgress(65, 'Criando declaração pedagógica...');
  doc.addPage([297, 210], 'portrait');
  createDeclaracaoPage(doc, planoData);
  
  // ====================================================
  // GERAR PÁGINAS DE AULA (ESTRUTURA ORIGINAL CORRETA)
  // ====================================================
  
  for (let aulaNum = 1; aulaNum <= numAulas; aulaNum++) {
    const progress = 65 + ((aulaNum / numAulas) * 30);
    updateProgress(progress, `Gerando aula ${aulaNum} de ${numAulas}...`);
    
    // PÁGINA 1 DA AULA: Preliminares, Objetivos e 2 primeiras funções
    doc.addPage([297, 210], 'landscape');
    createPagina1Aula(doc, planoData, aulaNum);
    
    // PÁGINA 2 DA AULA: 2 últimas funções e Anexo
    doc.addPage([297, 210], 'landscape');
    createPagina2Aula(doc, aulaNum);
    
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  
  // ====================================================
  // FINALIZAR
  // ====================================================
  updateProgress(98, 'Finalizando documento...');
  
  const disciplina = planoData.disciplina || "Plano";
  const classe = planoData.classe || "";
  const professorNome = planoData.professor.replace(/\s+/g, '_').substring(0, 20);
  const nomeArquivo = `Bloco_Planificacao_${disciplina}_${classe}_${professorNome}.pdf`;
  
  const historico = JSON.parse(localStorage.getItem("historicoPlanos")) || [];
  historico.push({
    escola: planoData.escola,
    professor: planoData.professor,
    disciplina: planoData.disciplina,
    classe: planoData.classe,
    turma: planoData.turma,
    periodo: planoData.periodo,
    aulas: numAulas,
    paginas: (numAulas * 2) + 2, // Atualizado para incluir a declaração
    data: new Date().toISOString().split('T')[0]
  });
  localStorage.setItem("historicoPlanos", JSON.stringify(historico));
  
  const pdfBlob = doc.output('blob');
  window.__ultimoPDFBlob = pdfBlob;
  window.__ultimoPDFNome = nomeArquivo;
  
  setTimeout(() => {
    try {
      baixarPDF(pdfBlob, nomeArquivo);
    } catch (e) {
      console.warn("Auto-download bloqueado pelo navegador.");
    }
  }, 300);
  
  const msg = document.getElementById('mensagem');
  msg.innerHTML = `
    <div style="color: #28a745; margin-bottom: 15px;">
      ✅ <strong>Bloco gerado com sucesso!</strong><br>
      ${numAulas} aulas • ${(numAulas * 2) + 2} páginas<br>
      PDFs restantes: ${restante}
    </div>
    <button onclick="baixarPDFManual()" 
            style="padding:12px 24px; background:#007BFF; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;"
            onmouseover="this.style.background='#0056b3';"
            onmouseout="this.style.background='#007BFF';">
      📥 Baixar Bloco Completo
    </button>
    <p style="margin-top: 10px; font-size: 14px; color: #666;">
      Se o download não iniciar automaticamente, clique no botão acima.
    </p>
  `;
  
  progressContainer.style.display = 'none';
}

// ====================================================
// PÁGINA DE DECLARAÇÃO PEDAGÓGICA
// ====================================================
function createDeclaracaoPage(doc, planoData) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margem = 20;
  
  // Título
  doc.setFont("times", "bold");
  doc.setFontSize(24);
  doc.setTextColor(0, 0, 0);
  doc.text('DECLARAÇÃO PEDAGÓGICA', pageWidth / 2, 40, { align: 'center' });
  
  // Texto introdutório
  doc.setFont("times", "normal");
  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  
  const textoIntro = [
    "O presente documento constitui um Bloco de Planificação Pedagógica, elaborado",
    "no âmbito do processo de ensino e aprendizagem, com finalidade exclusivamente",
    "educativa."
  ];
  
  let yPos = 60;
  textoIntro.forEach(linha => {
    doc.text(linha, pageWidth / 2, yPos, { align: 'center' });
    yPos += 8;
  });
  
  yPos += 10;
  
  // Quadro de informações
  doc.setDrawColor(0, 0, 0);
  doc.setLineWidth(0.5);
  doc.rect(margem, yPos, pageWidth - (2 * margem), 60);
  
  // Informações do professor
  const infoY = yPos + 15;
  let infoYOffset = 0;
  
  function addInfo(label, value) {
    if (value && value.trim()) {
      doc.setFont("times", "bold");
      doc.text(label + ':', margem + 10, infoY + infoYOffset);
      doc.setFont("times", "normal");
      doc.text(value, margem + 60, infoY + infoYOffset);
      infoYOffset += 10;
    }
  }
  
  addInfo('Professor(a)', planoData.professor);
  addInfo('Escola', planoData.escola);
  addInfo('Classe', planoData.classe);
  addInfo('Disciplina', planoData.disciplina);
  
  // Ano letivo (automático)
  const currentYear = new Date().getFullYear();
  const nextYear = currentYear + 1;
  const anoLetivo = `${currentYear}/${nextYear}`;
  addInfo('Ano Letivo', anoLetivo);
  
  yPos += 70;
  
  // Texto da declaração
  const textoDeclaracao = [
    "Este Bloco de Planificação pertence ao(a) Professor(a) acima identificado(a).",
    "O conteúdo aqui apresentado destina-se ao uso pessoal, profissional e pedagógico",
    "do(a) docente, servindo como instrumento de apoio à planificação, organização,",
    "acompanhamento e execução das atividades letivas.",
    "",
    "Este documento é considerado INTRANSMISSÍVEL, não devendo ser copiado,",
    "partilhado, reproduzido ou utilizado por terceiros sem a autorização expressa",
    "do seu titular, respeitando-se os princípios éticos, pedagógicos e profissionais",
    "que regem a atividade docente.",
    "",
    "A utilização deste Bloco de Planificação tem como objetivo contribuir para a",
    "melhoria da qualidade do ensino, assegurar o cumprimento dos objetivos",
    "curriculares e fortalecer práticas pedagógicas responsáveis, conscientes e",
    "eficazes."
  ];
  
  textoDeclaracao.forEach(linha => {
    if (linha === '') {
      yPos += 5; // Espaço entre parágrafos
    } else {
      doc.text(linha, margem, yPos);
      yPos += 7;
    }
  });
  
  yPos += 15;
  
  // Área de assinatura
  doc.setFont("times", "bold");
  doc.setFontSize(14);
  doc.text('ASSINATURA DO DOCENTE', pageWidth / 2, yPos, { align: 'center' });
  
  // Linha para assinatura
  yPos += 10;
  doc.setDrawColor(0, 0, 0);
  doc.setLineWidth(0.8);
  doc.line(pageWidth / 2 - 50, yPos, pageWidth / 2 + 50, yPos);
  
  // Nome do professor
  yPos += 8;
  doc.setFont("times", "bold");
  doc.setFontSize(12);
  doc.text(planoData.professor, pageWidth / 2, yPos, { align: 'center' });
  
  // Data
  yPos += 15;
  doc.setFont("times", "italic");
  doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text(`Documento gerado em: ${new Date().toLocaleDateString('pt-MZ')}`, pageWidth / 2, yPos, { align: 'center' });
}

// FUNÇÕES DE DOWNLOAD
// ====================================================
function baixarPDF(blob, nome) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

window.__ultimoPDFBlob = null;
window.__ultimoPDFNome = null;

function baixarPDFManual() {
  if (window.__ultimoPDFBlob && window.__ultimoPDFNome) {
    baixarPDF(window.__ultimoPDFBlob, window.__ultimoPDFNome);
  } else {
    alert("❌ Nenhum PDF disponível para download.");
  }
}
