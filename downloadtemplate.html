<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerando PDF - Sistema de Planos de Aula</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d4d16 0%, #1a5f23 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
            color: white;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .loading-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .details {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: white;
            color: #1a5f23;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            margin-top: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 2px solid #dc3545;
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .back-link {
            color: white;
            text-decoration: none;
            margin-top: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .logo { font-size: 3rem; }
            .loading-container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-file-pdf"></i>
        </div>
        
        <h1>Gerando o seu Template</h1>
        <p class="subtitle">Estamos a preparar o seu formulário para preenchimento manual.</p>
        
        <div class="loading-container">
            <div class="spinner"></div>
            
            <div class="status" id="status">Iniciando geração do template...</div>
            <div class="details" id="details">Carregando configurações...</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="details" id="progress-text">0% concluído</div>
        </div>
        
        <button class="btn" id="download-btn" disabled>
            <i class="fas fa-download"></i> Baixar Template
        </button>
        
        <div class="error" id="error-message">
            <h3 style="margin-bottom: 1rem; color: white;"><i class="fas fa-exclamation-triangle"></i> Erro ao gerar template</h3>
            <p id="error-text" style="color: white;">Ocorreu um erro ao gerar o documento. Por favor, tente novamente.</p>
            <button class="btn" onclick="window.location.href='index.html'" style="margin-top: 1rem; background: #dc3545; color: white;">
                <i class="fas fa-arrow-left"></i> Voltar ao Início
            </button>
        </div>
        
        <a href="preview.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar à Pré-visualização
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        // Configuração
        let config = null;
        let pdf = null;
        
        // Elementos DOM
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const downloadBtn = document.getElementById('download-btn');
        const errorEl = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // Funções de progresso
        function updateProgress(percent, status, details) {
            progressBar.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '% concluído';
            statusEl.textContent = status;
            detailsEl.textContent = details;
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorEl.classList.add('show');
        }
        
        // Função para carregar imagem da capa
        async function loadEmblemImage() {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.warn('Emblema não encontrado, usando placeholder');
                    resolve(null);
                };
                img.src = 'emblema.png';
            });
        }
        
        // ============================================
        // CONFIGURAÇÕES DE MEDIDAS
        // ============================================
        
        // Margens de segurança (em pontos)
        const MARGEM_CIMA = 19.845;      // 0.7 cm
        const MARGEM_BAIXO = 22.68;      // 0.8 cm
        const MARGEM_ESQUERDA = 19.845;  // 0.7 cm
        const MARGEM_DIREITA = 19.845;   // 0.7 cm
        
        // Dimensões da página A4 horizontal (em pontos)
        const PAGINA_LARGURA = 841.89;
        const PAGINA_ALTURA = 595.28;
        
        // Área útil (dentro das margens)
        const AREA_LARGURA = PAGINA_LARGURA - MARGEM_ESQUERDA - MARGEM_DIREITA;   // 802.2 pontos
        const AREA_ALTURA = PAGINA_ALTURA - MARGEM_CIMA - MARGEM_BAIXO;          // 552.755 pontos
        
        // Alturas específicas das linhas (em pontos)
        const ALTURA_CABECALHO = 56.7;   // 2 cm
        const ALTURA_FUNCAO1 = 170.1;    // 6 cm
        const ALTURA_FUNCAO2 = 198.45;   // 7 cm
        const ALTURA_FUNCAO3 = 141.75;   // 5 cm
        const ALTURA_FUNCAO4 = 170.1;    // 6 cm
        
        // Larguras das colunas (em pontos)
        const LARGURA_COLUNAS = {
            TEMPO: 60,
            FUNCOES: 120,
            CONTEUDOS: 140,
            ATIV_PROFESSOR: 140,
            ATIV_ALUNOS: 140,
            METODOS: 100,
            MEIOS: 100
        };
        
        // Calcular largura total da tabela
        const LARGURA_TOTAL_TABELA = Object.values(LARGURA_COLUNAS).reduce((a, b) => a + b, 0); // 800 pontos
        const ALTURA_TOTAL_TABELA = ALTURA_CABECALHO + ALTURA_FUNCAO1 + ALTURA_FUNCAO2; // Primeira página
        
        // Posição X da tabela (centralizada horizontalmente)
        const TABELA_X = MARGEM_ESQUERDA + ((AREA_LARGURA - LARGURA_TOTAL_TABELA) / 2);
        
        // Função para desenhar grade completa da tabela
        function desenharGradeTabela(x, y, larguras, alturas, mostrarCabeçalho = true) {
            const totalAltura = alturas.reduce((a, b) => a + b, 0);
            const totalLargura = larguras.reduce((a, b) => a + b, 0);
            
            // Configurar estilo da linha
            pdf.setDrawColor(0, 0, 0); // Preto
            pdf.setLineWidth(0.5);     // Linha fina
            
            // Desenhar borda externa da tabela
            pdf.rect(x, y, totalLargura, totalAltura);
            
            // Desenhar linhas horizontais
            let currentY = y;
            for (let i = 0; i < alturas.length; i++) {
                currentY += alturas[i];
                if (i < alturas.length - 1) {
                    pdf.line(x, currentY, x + totalLargura, currentY);
                }
            }
            
            // Desenhar linhas verticais
            let currentX = x;
            const larguraArray = Object.values(larguras);
            for (let i = 0; i < larguraArray.length; i++) {
                currentX += larguraArray[i];
                if (i < larguraArray.length - 1) {
                    pdf.line(currentX, y, currentX, y + totalAltura);
                }
            }
            
            return { x, y, largura: totalLargura, altura: totalAltura };
        }
        
        // Função para escrever texto na tabela
        function escreverNaTabela(texto, linha, coluna, xInicio, yInicio, alturas, larguras) {
            const fontSizes = {
                cabecalho: 12,
                funcoes: 12,
                conteudo: 12
            };
            
            // Calcular posição X
            let posX = xInicio;
            for (let i = 0; i < coluna; i++) {
                posX += Object.values(larguras)[i];
            }
            
            // Calcular posição Y
            let posY = yInicio;
            for (let i = 0; i < linha; i++) {
                posY += alturas[i];
            }
            
            // Configurar fonte
            pdf.setFont("times", "normal");
            pdf.setFontSize(fontSizes.cabecalho);
            pdf.setTextColor(0, 0, 0);
            
            // Centralizar nas células específicas
            const larguraCelula = Object.values(larguras)[coluna];
            const alturaCelula = alturas[linha];
            
            if (coluna === 0 || coluna === 5 || coluna === 6) { // TEMPO, MÉTODOS, MEIOS
                pdf.text(texto, posX + (larguraCelula / 2), posY + (alturaCelula / 2), { align: "center" });
            } else if (coluna === 1) { // FUNÇÕES DIDÁCTICAS
                pdf.setFont("times", "bold");
                pdf.text(texto, posX + 10, posY + 20);
            } else { // Outras colunas
                pdf.text(texto, posX + 10, posY + 15);
            }
        }
        
        // Função para criar capa do bloco (vertical)
        async function createCapa(progress) {
            updateProgress(progress, 'Criando capa...', 'Preparando capa oficial com emblema');
            
            const emblem = await loadEmblemImage();
            
            // Criar nova página vertical para capa
            pdf = new jspdf.jsPDF({
                orientation: 'portrait',
                unit: 'pt',
                format: 'a4'
            });
            
            // Margens para capa
            const capaMargem = 56.7; // 2cm
            const capaLarguraUtil = 595.28 - (capaMargem * 2);
            
            // Fundo branco
            pdf.setFillColor(255, 255, 255);
            pdf.rect(0, 0, 595.28, 841.89, 'F');
            
            // Emblema no topo (se disponível)
            if (emblem) {
                const emblemWidth = 80;
                const emblemHeight = 80;
                const emblemX = (595.28 - emblemWidth) / 2;
                const emblemY = capaMargem + 20;
                
                try {
                    pdf.addImage(emblem, 'PNG', emblemX, emblemY, emblemWidth, emblemHeight);
                } catch (e) {
                    console.warn('Erro ao adicionar emblema:', e);
                }
            }
            
            // Títulos - Times New Roman
            pdf.setFont("times", "bold");
            pdf.setFontSize(28);
            pdf.setTextColor(0, 0, 0);
            pdf.text('REPÚBLICA DE MOÇAMBIQUE', 595.28 / 2, 200, { align: 'center' });
            
            pdf.setFontSize(22);
            pdf.text('MINISTÉRIO DA EDUCAÇÃO', 595.28 / 2, 240, { align: 'center' });
            
            // Linha divisória
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(2);
            pdf.line(100, 280, 495.28, 280);
            
            // Título principal
            pdf.setFontSize(32);
            pdf.text('BLOCO DE PLANIFICAÇÃO', 595.28 / 2, 340, { align: 'center' });
            
            // Informações - Grade para preenchimento
            pdf.setFontSize(18);
            
            let y = 400;
            const lineHeight = 35;
            
            // Escola
            pdf.text('ESCOLA:', 595.28 / 2, y, { align: 'center' });
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            pdf.line(150, y + 5, 445.28, y + 5);
            y += lineHeight;
            
            // Professor
            pdf.text('PROFESSOR:', 595.28 / 2, y, { align: 'center' });
            pdf.line(150, y + 5, 445.28, y + 5);
            y += lineHeight;
            
            // Disciplina
            pdf.text('DISCIPLINA:', 595.28 / 2, y, { align: 'center' });
            pdf.line(150, y + 5, 445.28, y + 5);
            y += lineHeight;
            
            // Classe
            pdf.text('CLASSE:', 595.28 / 2, y, { align: 'center' });
            pdf.line(150, y + 5, 445.28, y + 5);
            
            // Rodapé
            pdf.setFontSize(12);
            pdf.setFont("times", "normal");
            pdf.setTextColor(100, 100, 100);
            pdf.text('Template para preenchimento manual', 595.28 / 2, 780, { align: 'center' });
            pdf.text(`Data de geração: ${new Date().toLocaleDateString('pt-MZ')}`, 595.28 / 2, 800, { align: 'center' });
        }
        
        // Função para criar página com Funções 1 e 2 (com cabeçalho da tabela)
        function createPaginaFuncoes12(aulaNum, progress, paginaNum) {
            updateProgress(progress, `Criando página ${paginaNum}...`, `Preparando template da aula ${aulaNum}`);
            
            // Se não for a primeira página (não for capa), adicionar nova página
            if (paginaNum > 1) {
                pdf.addPage([841.89, 595.28], 'landscape');
            }
            
            // Configurar fonte para toda a página
            pdf.setFont("times", "normal");
            pdf.setFontSize(12);
            pdf.setTextColor(0, 0, 0);
            
            // ============================================
            // CABEÇALHO DO PLANO
            // ============================================
            
            const tituloY = MARGEM_CIMA + 30;
            pdf.setFont("times", "bold");
            pdf.setFontSize(14);
            pdf.text('PLANO DE AULA', PAGINA_LARGURA / 2, tituloY, { align: "center" });
            
            // Linha abaixo do título
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1);
            const linhaComprimento = 150;
            pdf.line((PAGINA_LARGURA - linhaComprimento) / 2, tituloY + 5, 
                     (PAGINA_LARGURA + linhaComprimento) / 2, tituloY + 5);
            
            // ============================================
            // PRELIMINARES - Dados em 2 colunas
            // ============================================
            
            let yAtual = tituloY + 30;
            const colunaLargura = (AREA_LARGURA - 60) / 2;
            const coluna1X = MARGEM_ESQUERDA;
            const coluna2X = coluna1X + colunaLargura + 60;
            
            // Coluna 1: Dados do Professor
            pdf.setFont("times", "bold");
            pdf.text('DADOS DO PROFESSOR', coluna1X, yAtual);
            yAtual += 15;
            
            pdf.setFont("times", "normal");
            const dadosEsquerda = [
                `Professor: ${config.dados.professor || ''}`,
                `Escola: ${config.dados.escola || ''}`,
                `Turma: ${config.dados.turma || ''}`,
                `Disciplina: ${config.dados.disciplina || ''}`,
                `Unid. Temática:`,
                `Tema:`
            ];
            
            dadosEsquerda.forEach((linha, index) => {
                pdf.text(linha, coluna1X, yAtual + (index * 15));
            });
            
            // Coluna 2: Dados da Aula
            yAtual = tituloY + 30;
            pdf.setFont("times", "bold");
            pdf.text('DADOS DA AULA', coluna2X, yAtual);
            yAtual += 15;
            
            pdf.setFont("times", "normal");
            const dadosDireita = [
                `Classe: ${config.dados.classe || ''}`,
                `Lição nº:`,
                `Duração: ${config.dados.duracao || ''}`,
                `Período: ${config.dados.periodo || ''}`,
                `Tipo de Aula: ${config.dados.tipo_aula || ''}`,
                `Data: ${config.dados.data || ''}`
            ];
            
            dadosDireita.forEach((linha, index) => {
                pdf.text(linha, coluna2X, yAtual + (index * 15));
            });
            
            // ============================================
            // OBJETIVOS ESPECÍFICOS
            // ============================================
            
            const objetivosY = tituloY + 130;
            pdf.setFont("times", "bold");
            pdf.text('Objectivos específicos:', MARGEM_ESQUERDA, objetivosY);
            
            // Desenhar grade para 3 objetivos
            const objetivoAltura = 20;
            const objetivoLargura = AREA_LARGURA;
            const objetivosGradeY = objetivosY + 10;
            
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            
            // Desenhar 3 retângulos para objetivos
            for (let i = 0; i < 3; i++) {
                pdf.rect(MARGEM_ESQUERDA, objetivosGradeY + (i * objetivoAltura), objetivoLargura, objetivoAltura);
                pdf.text(`${i + 1}.`, MARGEM_ESQUERDA + 10, objetivosGradeY + (i * objetivoAltura) + 14);
            }
            
            // ============================================
            // TABELA PRINCIPAL - Funções 1 e 2
            // ============================================
            
            const tabelaY = objetivosGradeY + (3 * objetivoAltura) + 20;
            
            // Alturas para esta página (cabeçalho + função 1 + função 2)
            const alturasPagina1 = [ALTURA_CABECALHO, ALTURA_FUNCAO1, ALTURA_FUNCAO2];
            
            // Desenhar grade completa da tabela
            const tabela = desenharGradeTabela(TABELA_X, tabelaY, LARGURA_COLUNAS, alturasPagina1, true);
            
            // Preencher cabeçalho da tabela
            pdf.setFont("times", "bold");
            pdf.setFontSize(12);
            
            const cabecalhos = ['TEMPO', 'FUNÇÕES DIDÁCTICAS', 'CONTEÚDOS', 
                                'ACTIVIDADES DO PROFESSOR', 'ACTIVIDADES DOS ALUNOS', 
                                'MÉTODOS DE ENSINO', 'MEIOS DE ENSINO'];
            
            Object.keys(LARGURA_COLUNAS).forEach((coluna, index) => {
                const colunaX = TABELA_X;
                let acumulado = 0;
                for (let i = 0; i < index; i++) {
                    acumulado += Object.values(LARGURA_COLUNAS)[i];
                }
                const centroX = colunaX + acumulado + (Object.values(LARGURA_COLUNAS)[index] / 2);
                pdf.text(cabecalhos[index], centroX, tabelaY + (ALTURA_CABECALHO / 2), { align: "center" });
            });
            
            // Preencher Função 1: Introdução e Motivação
            const linha1Y = tabelaY + ALTURA_CABECALHO;
            escreverNaTabela("", 1, 0, TABELA_X, tabelaY, alturasPagina1, LARGURA_COLUNAS); // Tempo vazio
            escreverNaTabela("Introdução e Motivação", 1, 1, TABELA_X, tabelaY, alturasPagina1, LARGURA_COLUNAS);
            // Demais colunas ficam vazias (apenas grade visível)
            
            // Preencher Função 2: Mediação e Assimilação
            const linha2Y = linha1Y + ALTURA_FUNCAO1;
            escreverNaTabela("", 2, 0, TABELA_X, tabelaY, alturasPagina1, LARGURA_COLUNAS); // Tempo vazio
            escreverNaTabela("Mediação e Assimilação", 2, 1, TABELA_X, tabelaY, alturasPagina1, LARGURA_COLUNAS);
            // Demais colunas ficam vazias (apenas grade visível)
            
            // Número da página
            pdf.setFont("times", "normal");
            pdf.setFontSize(10);
            pdf.setTextColor(150, 150, 150);
            pdf.text(`Aula ${aulaNum} - Página ${paginaNum}`, PAGINA_LARGURA - MARGEM_DIREITA, PAGINA_ALTURA - MARGEM_BAIXO + 15, { align: "right" });
        }
        
        // Função para criar página com Funções 3 e 4 + Anexo
        function createPaginaFuncoes34Anexo(aulaNum, progress, paginaNum) {
            updateProgress(progress, `Criando página ${paginaNum}...`, `Completando template da aula ${aulaNum}`);
            
            // Adicionar nova página horizontal
            pdf.addPage([841.89, 595.28], 'landscape');
            
            // Configurar fonte para toda a página
            pdf.setFont("times", "normal");
            pdf.setFontSize(12);
            pdf.setTextColor(0, 0, 0);
            
            // ============================================
            // TABELA PRINCIPAL - Funções 3 e 4
            // ============================================
            
            const tabelaY = MARGEM_CIMA;
            
            // Alturas para esta página (função 3 + função 4)
            const alturasPagina2 = [ALTURA_FUNCAO3, ALTURA_FUNCAO4];
            
            // Desenhar grade completa da tabela (SEM CABEÇALHO)
            const tabela = desenharGradeTabela(TABELA_X, tabelaY, LARGURA_COLUNAS, alturasPagina2, false);
            
            // Preencher Função 3: Domínio e Consolidação
            escreverNaTabela("", 0, 0, TABELA_X, tabelaY, alturasPagina2, LARGURA_COLUNAS); // Tempo vazio
            escreverNaTabela("Domínio e Consolidação", 0, 1, TABELA_X, tabelaY, alturasPagina2, LARGURA_COLUNAS);
            // Demais colunas ficam vazias (apenas grade visível)
            
            // Preencher Função 4: Controlo e Avaliação
            escreverNaTabela("", 1, 0, TABELA_X, tabelaY, alturasPagina2, LARGURA_COLUNAS); // Tempo vazio
            escreverNaTabela("Controlo e Avaliação", 1, 1, TABELA_X, tabelaY, alturasPagina2, LARGURA_COLUNAS);
            // Demais colunas ficam vazias (apenas grade visível)
            
            // ============================================
            // ANEXO / QUADRO MORAL
            // ============================================
            
            const anexoY = tabelaY + ALTURA_FUNCAO3 + ALTURA_FUNCAO4 + 30;
            
            // Linha divisória acima do anexo
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1);
            pdf.line(TABELA_X, anexoY - 10, TABELA_X + LARGURA_TOTAL_TABELA, anexoY - 10);
            
            // Título do anexo
            pdf.setFont("times", "bold");
            pdf.setFontSize(14);
            pdf.text('ANEXO / QUADRO MORAL', PAGINA_LARGURA / 2, anexoY, { align: "center" });
            
            // Caixa do anexo (espaço livre)
            const anexoAltura = PAGINA_ALTURA - anexoY - MARGEM_BAIXO - 30;
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            pdf.rect(TABELA_X, anexoY + 15, LARGURA_TOTAL_TABELA, anexoAltura);
            
            // Número da página
            pdf.setFont("times", "normal");
            pdf.setFontSize(10);
            pdf.setTextColor(150, 150, 150);
            pdf.text(`Aula ${aulaNum} - Página ${paginaNum}`, PAGINA_LARGURA - MARGEM_DIREITA, PAGINA_ALTURA - MARGEM_BAIXO + 15, { align: "right" });
        }
        
        // Função para gerar PDF flexível (1 aula)
        async function generateFlexivelPDF() {
            updateProgress(10, 'Iniciando geração...', 'Preparando Template Flexível');
            
            // Criar PDF horizontal
            pdf = new jspdf.jsPDF({
                orientation: 'landscape',
                unit: 'pt',
                format: 'a4'
            });
            
            // Página 1: Funções 1 e 2
            await new Promise(resolve => setTimeout(resolve, 300));
            createPaginaFuncoes12(1, 50, 1);
            
            // Página 2: Funções 3 e 4 + Anexo
            await new Promise(resolve => setTimeout(resolve, 300));
            createPaginaFuncoes34Anexo(1, 90, 2);
            
            updateProgress(100, 'Template gerado com sucesso!', 'Documento pronto para impressão e preenchimento manual');
        }
        
        // Função para gerar PDF do bloco (múltiplas aulas)
        async function generateBlocoPDF() {
            updateProgress(5, 'Iniciando geração...', 'Preparando Bloco de Planificação');
            
            // Criar Capa (página 1 - vertical)
            await createCapa(15);
            
            // Calcular progresso por aula
            const totalAulas = config.aulas || 1;
            const progressPerAula = (85 - 15) / totalAulas;
            
            // Gerar páginas para cada aula
            for (let i = 1; i <= totalAulas; i++) {
                const baseProgress = 15 + ((i - 1) * progressPerAula);
                
                // Página da aula: Funções 1 e 2
                const pagina1 = (i * 2) - 1; // Páginas 2, 4, 6...
                const progress1 = baseProgress + (progressPerAula * 0.4);
                await new Promise(resolve => setTimeout(resolve, 200));
                createPaginaFuncoes12(i, progress1, pagina1);
                
                // Página da aula: Funções 3 e 4 + Anexo
                const pagina2 = i * 2; // Páginas 3, 5, 7...
                const progress2 = baseProgress + (progressPerAula * 0.8);
                await new Promise(resolve => setTimeout(resolve, 200));
                createPaginaFuncoes34Anexo(i, progress2, pagina2);
            }
            
            updateProgress(100, 'Bloco gerado com sucesso!', `Documento com ${(totalAulas * 2) + 1} páginas pronto para impressão`);
        }
        
        // Função principal de geração
        async function generatePDF() {
            try {
                // Obter configuração do localStorage
                const configData = localStorage.getItem('planoConfig');
                if (!configData) {
                    throw new Error('Configuração não encontrada. Por favor, volte ao início.');
                }
                
                config = JSON.parse(configData);
                
                // Validar dados obrigatórios
                if (!config.dados.professor || !config.dados.escola) {
                    throw new Error('Dados obrigatórios não preenchidos. Volte ao formulário.');
                }
                
                // Gerar PDF baseado no tipo
                if (config.tipo === 'flexivel') {
                    await generateFlexivelPDF();
                } else {
                    await generateBlocoPDF();
                }
                
                // Habilitar botão de download
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Baixar Template';
                downloadBtn.onclick = () => {
                    const tipoNome = config.tipo === 'flexivel' ? 'Template_Flexivel' : 'Bloco_Planificacao';
                    const professorNome = config.dados.professor.replace(/\s+/g, '_');
                    const filename = `${tipoNome}_${professorNome}_${new Date().toISOString().split('T')[0]}.pdf`;
                    pdf.save(filename);
                };
                
            } catch (error) {
                console.error('Erro ao gerar template:', error);
                showError(error.message);
            }
        }
        
        // Iniciar geração quando a página carregar
        document.addEventListener('DOMContentLoaded', generatePDF);
    </script>
</body>
</html>
