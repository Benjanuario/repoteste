<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerando PDF - Sistema de Planos de Aula</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d4d16 0%, #1a5f23 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
            color: white;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .loading-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .details {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: white;
            color: #1a5f23;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            margin-top: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 2px solid #dc3545;
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .back-link {
            color: white;
            text-decoration: none;
            margin-top: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .logo { font-size: 3rem; }
            .loading-container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-file-pdf"></i>
        </div>
        
        <h1>Gerando o seu Template</h1>
        <p class="subtitle">Estamos a preparar o seu formulário para preenchimento manual.</p>
        
        <div class="loading-container">
            <div class="spinner"></div>
            
            <div class="status" id="status">Iniciando geração do template...</div>
            <div class="details" id="details">Carregando configurações...</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="details" id="progress-text">0% concluído</div>
        </div>
        
        <button class="btn" id="download-btn" disabled>
            <i class="fas fa-download"></i> Baixar Template
        </button>
        
        <div class="error" id="error-message">
            <h3 style="margin-bottom: 1rem; color: white;"><i class="fas fa-exclamation-triangle"></i> Erro ao gerar template</h3>
            <p id="error-text" style="color: white;">Ocorreu um erro ao gerar o documento. Por favor, tente novamente.</p>
            <button class="btn" onclick="window.location.href='index.html'" style="margin-top: 1rem; background: #dc3545; color: white;">
                <i class="fas fa-arrow-left"></i> Voltar ao Início
            </button>
        </div>
        
        <a href="preview.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar à Pré-visualização
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        // Configuração
        let config = null;
        let pdf = null;
        
        // Elementos DOM
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const downloadBtn = document.getElementById('download-btn');
        const errorEl = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // Funções de progresso
        function updateProgress(percent, status, details) {
            progressBar.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '% concluído';
            statusEl.textContent = status;
            detailsEl.textContent = details;
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorEl.classList.add('show');
        }
        
        // Função para carregar imagem da capa
        async function loadEmblemImage() {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.warn('Emblema não encontrado, usando placeholder');
                    resolve(null);
                };
                img.src = 'emblema.png';
            });
        }
        
        // Função para criar capa do bloco
        async function createCapa(progress) {
            updateProgress(progress, 'Criando capa...', 'Preparando capa oficial com emblema');
            
            const emblem = await loadEmblemImage();
            
            // Configurar página vertical
            pdf.addPage();
            pdf.setPage(1);
            
            // Fundo branco
            pdf.setFillColor(255, 255, 255);
            pdf.rect(0, 0, 595.28, 841.89, 'F');
            
            // Emblema no topo (se disponível)
            if (emblem) {
                const emblemWidth = 100;
                const emblemHeight = 100;
                const emblemX = (595.28 - emblemWidth) / 2;
                const emblemY = 60;
                
                try {
                    pdf.addImage(emblem, 'PNG', emblemX, emblemY, emblemWidth, emblemHeight);
                } catch (e) {
                    console.warn('Erro ao adicionar emblema:', e);
                }
            }
            
            // Títulos
            pdf.setFontSize(32);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35);
            pdf.text('REPÚBLICA DE MOÇAMBIQUE', 297.64, 180, { align: 'center' });
            
            pdf.setFontSize(24);
            pdf.text('MINISTÉRIO DA EDUCAÇÃO', 297.64, 210, { align: 'center' });
            
            // Linha divisória
            pdf.setDrawColor(26, 95, 35);
            pdf.setLineWidth(2);
            pdf.line(100, 240, 495.28, 240);
            
            // Título principal
            pdf.setFontSize(36);
            pdf.setTextColor(211, 47, 47);
            pdf.text('BLOCO DE PLANIFICAÇÃO', 297.64, 290, { align: 'center' });
            
            // Informações
            pdf.setFontSize(20);
            pdf.setTextColor(0, 0, 0);
            pdf.setFont('helvetica', 'bold');
            
            let y = 350;
            const lineHeight = 28;
            
            if (config.dados.escola) {
                pdf.text(`ESCOLA: ${config.dados.escola.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.professor) {
                pdf.text(`PROFESSOR: ${config.dados.professor.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.disciplina) {
                pdf.text(`DISCIPLINA: ${config.dados.disciplina.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.classe) {
                pdf.text(`CLASSE: ${config.dados.classe.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            // Rodapé
            pdf.setFontSize(12);
            pdf.setTextColor(100, 100, 100);
            pdf.setFont('helvetica', 'normal');
            pdf.text('Template para preenchimento manual', 297.64, 780, { align: 'center' });
            pdf.text(`Data de geração: ${new Date().toLocaleDateString('pt-MZ')}`, 297.64, 795, { align: 'center' });
        }
        
        // ALTURAS ESPECÍFICAS (em pontos - 1cm = 28.35 pontos)
        const ALTURAS = {
            CABECALHO: 56.7,    // 2 cm
            FUNCAO1: 170.1,     // 6 cm
            FUNCAO2: 198.45,    // 7 cm
            FUNCAO3: 141.75,    // 5 cm
            FUNCAO4: 170.1      // 6 cm
        };
        
        // LARGURAS DAS COLUNAS (em pontos)
        const LARGURAS = {
            TEMPO: 40,           // TEMPO
            FUNCOES: 80,         // FUNÇÕES DIDÁCTICAS
            CONTEUDOS: 100,      // CONTEÚDOS
            ATIV_PROF: 100,      // ACTIVIDADES DO PROFESSOR
            ATIV_ALUNOS: 100,    // ACTIVIDADES DOS ALUNOS
            METODOS: 70,         // MÉTODOS DE ENSINO
            MEIOS: 70            // MEIOS DE ENSINO
        };
        
        // Calcular largura total
        const LARGURA_TOTAL = Object.values(LARGURAS).reduce((a, b) => a + b, 0);
        
        // Função para criar primeira página do plano (com cabeçalho e funções 1-2)
        function createPlanoPage1(aulaNum, progress, pageNum) {
            updateProgress(progress, `Criando página ${pageNum}...`, `Preparando template da aula ${aulaNum}`);
            
            // Adicionar nova página horizontal
            pdf.addPage([841.89, 595.28], 'landscape');
            
            // Margens de 7cm (198.4 pontos)
            const marginLeft = 198.4;
            const marginRight = 198.4;
            const marginTop = 56.7; // 2cm
            const marginBottom = 56.7; // 2cm
            
            const pageWidth = 841.89;
            const pageHeight = 595.28;
            
            // --- TÍTULO ---
            pdf.setFontSize(16);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35);
            const centerX = marginLeft + ((pageWidth - marginLeft - marginRight) / 2);
            pdf.text('PLANO DE AULA', centerX, marginTop, { align: 'center' });
            
            // Linha abaixo do título
            pdf.setDrawColor(26, 95, 35);
            pdf.setLineWidth(1);
            pdf.line(centerX - 60, marginTop + 5, centerX + 60, marginTop + 5);
            
            // --- PRELIMINARES EM 2 COLUNAS ---
            let y = marginTop + 25;
            const colWidth = (pageWidth - marginLeft - marginRight) / 2;
            const colGap = 30;
            
            // Coluna 1: Esquerda
            pdf.setFontSize(12);
            pdf.setFont('helvetica', 'bold');
            pdf.text('DADOS DO PROFESSOR', marginLeft, y);
            pdf.setFont('helvetica', 'normal');
            
            let currentY = y + 10;
            
            // Professor
            if (config.dados.professor) {
                pdf.text(`Professor: ${config.dados.professor}`, marginLeft, currentY);
            } else {
                pdf.text('Professor: __________________________', marginLeft, currentY);
            }
            currentY += 15;
            
            // Escola
            if (config.dados.escola) {
                pdf.text(`Escola: ${config.dados.escola}`, marginLeft, currentY);
            } else {
                pdf.text('Escola: __________________________', marginLeft, currentY);
            }
            currentY += 15;
            
            // Outros campos
            pdf.text('Turma: ______', marginLeft, currentY);
            currentY += 15;
            
            if (config.dados.disciplina) {
                pdf.text(`Disciplina: ${config.dados.disciplina}`, marginLeft, currentY);
            } else {
                pdf.text('Disciplina: __________________________', marginLeft, currentY);
            }
            
            // Coluna 2: Direita
            let yRight = y + 10;
            
            if (config.dados.classe) {
                pdf.text(`Classe: ${config.dados.classe}`, marginLeft + colWidth + colGap, yRight);
            } else {
                pdf.text('Classe: ______', marginLeft + colWidth + colGap, yRight);
            }
            yRight += 15;
            
            pdf.text('Lição nº: ______', marginLeft + colWidth + colGap, yRight);
            yRight += 15;
            
            if (config.dados.duracao) {
                pdf.text(`Duração: ${config.dados.duracao}`, marginLeft + colWidth + colGap, yRight);
            } else {
                pdf.text('Duração: _________________________', marginLeft + colWidth + colGap, yRight);
            }
            yRight += 15;
            
            if (config.dados.periodo) {
                pdf.text(`Período: ${config.dados.periodo}`, marginLeft + colWidth + colGap, yRight);
            } else {
                pdf.text('Período: ______', marginLeft + colWidth + colGap, yRight);
            }
            yRight += 15;
            
            if (config.dados.tipo_aula) {
                pdf.text(`Tipo de Aula: ${config.dados.tipo_aula}`, marginLeft + colWidth + colGap, yRight);
            } else {
                pdf.text('Tipo de Aula: ____________________', marginLeft + colWidth + colGap, yRight);
            }
            yRight += 15;
            
            if (config.dados.data) {
                pdf.text(`Data: ${config.dados.data}`, marginLeft + colWidth + colGap, yRight);
            } else {
                pdf.text('Data: ____________________________', marginLeft + colWidth + colGap, yRight);
            }
            
            // --- OBJETIVOS ESPECÍFICOS ---
            const objetivosY = Math.max(currentY, yRight) + 20;
            pdf.setFontSize(12);
            pdf.setFont('helvetica', 'bold');
            pdf.text('Objectivos específicos:', marginLeft, objetivosY);
            
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            let objY = objetivosY + 10;
            
            // 3 linhas para objetivos
            for (let i = 1; i <= 3; i++) {
                pdf.text(`${i}. __________________________________________________________`, marginLeft + 10, objY);
                objY += 15;
            }
            
            // --- POSIÇÃO DA TABELA ---
            const tableStartY = objY + 20;
            const tableStartX = marginLeft;
            
            // --- CABEÇALHO DA TABELA (2 cm = 56.7 pontos) ---
            pdf.setFillColor(200, 200, 200); // Cinza claro
            pdf.rect(tableStartX, tableStartY, LARGURA_TOTAL, ALTURAS.CABECALHO, 'F');
            
            // Texto do cabeçalho
            pdf.setFontSize(10);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(0, 0, 0);
            
            let headerX = tableStartX;
            const headers = ['TEMPO', 'FUNÇÕES DIDÁCTICAS', 'CONTEÚDOS', 'ACTIVIDADES DO PROFESSOR', 'ACTIVIDADES DOS ALUNOS', 'MÉTODOS DE ENSINO', 'MEIOS DE ENSINO'];
            
            for (let i = 0; i < headers.length; i++) {
                const colWidth = Object.values(LARGURAS)[i];
                pdf.text(headers[i], headerX + (colWidth / 2), tableStartY + (ALTURAS.CABECALHO / 2), { align: 'center' });
                headerX += colWidth;
            }
            
            // --- FUNÇÃO 1: INTRODUÇÃO E MOTIVAÇÃO (6 cm = 170.1 pontos) ---
            const funcao1Y = tableStartY + ALTURAS.CABECALHO;
            
            // Borda da célula
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1.5);
            pdf.rect(tableStartX, funcao1Y, LARGURA_TOTAL, ALTURAS.FUNCAO1);
            
            // Conteúdo da Função 1
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(0, 0, 0);
            
            // TEMPO
            let cellX = tableStartX;
            pdf.text('_____', cellX + (LARGURAS.TEMPO / 2), funcao1Y + (ALTURAS.FUNCAO1 / 2) - 20, { align: 'center' });
            
            // FUNÇÕES DIDÁCTICAS (PRÉ-PREENCHIDO)
            cellX += LARGURAS.TEMPO;
            pdf.setFont('helvetica', 'bold');
            pdf.text('Introdução e Motivação', cellX + 5, funcao1Y + 15);
            pdf.setFont('helvetica', 'normal');
            
            // CONTEÚDOS (VAZIO)
            cellX += LARGURAS.FUNCOES;
            pdf.setFont('helvetica', 'italic');
            pdf.setTextColor(150, 150, 150);
            pdf.text('• Saudação\n• Marcação de presença\n• Correção do TPC / Recapitulação\n• Apresentação do tema', 
                     cellX + 5, funcao1Y + 15);
            
            // ATIVIDADES PROFESSOR (VAZIO)
            cellX += LARGURAS.CONTEUDOS;
            pdf.text('• Saúda os alunos\n• Faz a marcação de presenças\n• Corrige o TPC\n• Introduz o tema', 
                     cellX + 5, funcao1Y + 15);
            
            // ATIVIDADES ALUNOS (VAZIO)
            cellX += LARGURAS.ATIV_PROF;
            pdf.text('• Saúdam o professor\n• Confirmam a presença\n• Participam na correção\n• Anotam o tema', 
                     cellX + 5, funcao1Y + 15);
            
            // MÉTODOS (VAZIO)
            cellX += LARGURAS.ATIV_ALUNOS;
            pdf.text('___________', cellX + 5, funcao1Y + (ALTURAS.FUNCAO1 / 2));
            
            // MEIOS (VAZIO)
            cellX += LARGURAS.METODOS;
            pdf.text('___________', cellX + 5, funcao1Y + (ALTURAS.FUNCAO1 / 2));
            
            // --- FUNÇÃO 2: MEDIAÇÃO E ASSIMILAÇÃO (7 cm = 198.45 pontos) ---
            const funcao2Y = funcao1Y + ALTURAS.FUNCAO1;
            
            // Borda da célula
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1.5);
            pdf.rect(tableStartX, funcao2Y, LARGURA_TOTAL, ALTURAS.FUNCAO2);
            
            // Conteúdo da Função 2
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(0, 0, 0);
            
            // TEMPO
            cellX = tableStartX;
            pdf.text('_____', cellX + (LARGURAS.TEMPO / 2), funcao2Y + (ALTURAS.FUNCAO2 / 2) - 20, { align: 'center' });
            
            // FUNÇÕES DIDÁCTICAS (PRÉ-PREENCHIDO)
            cellX += LARGURAS.TEMPO;
            pdf.setFont('helvetica', 'bold');
            pdf.text('Mediação e Assimilação', cellX + 5, funcao2Y + 15);
            pdf.setFont('helvetica', 'normal');
            
            // CONTEÚDOS (VAZIO)
            cellX += LARGURAS.FUNCOES;
            pdf.setFont('helvetica', 'italic');
            pdf.setTextColor(150, 150, 150);
            pdf.text('• Exploração de pressupostos\n• Explicação do tema\n• Esclarecimento de dúvidas\n• Desenvolvimento do conteúdo', 
                     cellX + 5, funcao2Y + 15);
            
            // ATIVIDADES PROFESSOR (VAZIO)
            cellX += LARGURAS.CONTEUDOS;
            pdf.text('• Explora ideias dos alunos\n• Explica o conteúdo\n• Sana dúvidas\n• Passa apontamentos', 
                     cellX + 5, funcao2Y + 15);
            
            // ATIVIDADES ALUNOS (VAZIO)
            cellX += LARGURAS.ATIV_PROF;
            pdf.text('• Expõem as suas ideias\n• Prestam atenção\n• Esclarecem dúvidas\n• Transcrevem apontamentos', 
                     cellX + 5, funcao2Y + 15);
            
            // MÉTODOS (VAZIO)
            cellX += LARGURAS.ATIV_ALUNOS;
            pdf.text('___________', cellX + 5, funcao2Y + (ALTURAS.FUNCAO2 / 2));
            
            // MEIOS (VAZIO)
            cellX += LARGURAS.METODOS;
            pdf.text('___________', cellX + 5, funcao2Y + (ALTURAS.FUNCAO2 / 2));
            
            // Número da página
            pdf.setFontSize(9);
            pdf.setTextColor(150, 150, 150);
            pdf.setFont('helvetica', 'normal');
            pdf.text(`Aula ${aulaNum} - Página ${pageNum}`, pageWidth - marginRight, pageHeight - marginBottom + 10, { align: 'right' });
        }
        
        // Função para criar segunda página do plano (com funções 3-4 + anexo)
        function createPlanoPage2(aulaNum, progress, pageNum) {
            updateProgress(progress, `Criando página ${pageNum}...`, `Completando template da aula ${aulaNum}`);
            
            // Adicionar nova página horizontal
            pdf.addPage([841.89, 595.28], 'landscape');
            
            // Margens de 7cm (198.4 pontos)
            const marginLeft = 198.4;
            const marginRight = 198.4;
            const marginTop = 56.7; // 2cm
            const marginBottom = 56.7; // 2cm
            
            const pageWidth = 841.89;
            const pageHeight = 595.28;
            
            // Posição da tabela (começa mais acima para caber anexo)
            const tableStartY = marginTop;
            const tableStartX = marginLeft;
            
            // --- FUNÇÃO 3: DOMÍNIO E CONSOLIDAÇÃO (5 cm = 141.75 pontos) ---
            
            // Borda da célula
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1.5);
            pdf.rect(tableStartX, tableStartY, LARGURA_TOTAL, ALTURAS.FUNCAO3);
            
            // Conteúdo da Função 3
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(0, 0, 0);
            
            // TEMPO
            let cellX = tableStartX;
            pdf.text('_____', cellX + (LARGURAS.TEMPO / 2), tableStartY + (ALTURAS.FUNCAO3 / 2) - 15, { align: 'center' });
            
            // FUNÇÕES DIDÁCTICAS (PRÉ-PREENCHIDO)
            cellX += LARGURAS.TEMPO;
            pdf.setFont('helvetica', 'bold');
            pdf.text('Domínio e Consolidação', cellX + 5, tableStartY + 15);
            pdf.setFont('helvetica', 'normal');
            
            // CONTEÚDOS (VAZIO)
            cellX += LARGURAS.FUNCOES;
            pdf.setFont('helvetica', 'italic');
            pdf.setTextColor(150, 150, 150);
            pdf.text('• Exercícios de aplicação\n• Verificação de resolução\n• Consolidação de conceitos\n• Prática guiada', 
                     cellX + 5, tableStartY + 15);
            
            // ATIVIDADES PROFESSOR (VAZIO)
            cellX += LARGURAS.CONTEUDOS;
            pdf.text('• Passa exercícios\n• Orienta a resolução\n• Verifica o trabalho\n• Fornece feedback', 
                     cellX + 5, tableStartY + 15);
            
            // ATIVIDADES ALUNOS (VAZIO)
            cellX += LARGURAS.ATIV_PROF;
            pdf.text('• Transcrevem exercícios\n• Resolvem individualmente\n• Apresentam resultados\n• Corrigem erros', 
                     cellX + 5, tableStartY + 15);
            
            // MÉTODOS (VAZIO)
            cellX += LARGURAS.ATIV_ALUNOS;
            pdf.text('___________', cellX + 5, tableStartY + (ALTURAS.FUNCAO3 / 2));
            
            // MEIOS (VAZIO)
            cellX += LARGURAS.METODOS;
            pdf.text('___________', cellX + 5, tableStartY + (ALTURAS.FUNCAO3 / 2));
            
            // --- FUNÇÃO 4: CONTROLO E AVALIAÇÃO (6 cm = 170.1 pontos) ---
            const funcao4Y = tableStartY + ALTURAS.FUNCAO3;
            
            // Borda da célula
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1.5);
            pdf.rect(tableStartX, funcao4Y, LARGURA_TOTAL, ALTURAS.FUNCAO4);
            
            // Conteúdo da Função 4
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(0, 0, 0);
            
            // TEMPO
            cellX = tableStartX;
            pdf.text('_____', cellX + (LARGURAS.TEMPO / 2), funcao4Y + (ALTURAS.FUNCAO4 / 2) - 20, { align: 'center' });
            
            // FUNÇÕES DIDÁCTICAS (PRÉ-PREENCHIDO)
            cellX += LARGURAS.TEMPO;
            pdf.setFont('helvetica', 'bold');
            pdf.text('Controlo e Avaliação', cellX + 5, funcao4Y + 15);
            pdf.setFont('helvetica', 'normal');
            
            // CONTEÚDOS (VAZIO)
            cellX += LARGURAS.FUNCOES;
            pdf.setFont('helvetica', 'italic');
            pdf.setTextColor(150, 150, 150);
            pdf.text('• Correção de exercícios\n• Resumo da aula\n• Marcação do TPC\n• Avaliação formativa', 
                     cellX + 5, funcao4Y + 15);
            
            // ATIVIDADES PROFESSOR (VAZIO)
            cellX += LARGURAS.CONTEUDOS;
            pdf.text('• Corrige exercícios\n• Resume pontos principais\n• Marca o TPC\n• Avalia participação', 
                     cellX + 5, funcao4Y + 15);
            
            // ATIVIDADES ALUNOS (VAZIO)
            cellX += LARGURAS.ATIV_PROF;
            pdf.text('• Apresentam exercícios\n• Anotam o resumo\n• Registam o TPC\n• Participam na avaliação', 
                     cellX + 5, funcao4Y + 15);
            
            // MÉTODOS (VAZIO)
            cellX += LARGURAS.ATIV_ALUNOS;
            pdf.text('___________', cellX + 5, funcao4Y + (ALTURAS.FUNCAO4 / 2));
            
            // MEIOS (VAZIO)
            cellX += LARGURAS.METODOS;
            pdf.text('___________', cellX + 5, funcao4Y + (ALTURAS.FUNCAO4 / 2));
            
            // --- ANEXO / QUADRO MORAL ---
            const anexoStartY = funcao4Y + ALTURAS.FUNCAO4 + 20;
            
            // Linha divisória
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            pdf.line(tableStartX, anexoStartY, tableStartX + LARGURA_TOTAL, anexoStartY);
            
            // Título do anexo
            pdf.setFontSize(14);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35);
            pdf.text('ANEXO / QUADRO MORAL', tableStartX + (LARGURA_TOTAL / 2), anexoStartY + 15, { align: 'center' });
            
            // Espaço livre SEM LINHAS
            const anexoHeight = pageHeight - anexoStartY - marginBottom - 30;
            
            // Apenas um retângulo vazio (borda muito clara)
            pdf.setDrawColor(220, 220, 220);
            pdf.setLineWidth(0.5);
            pdf.rect(tableStartX, anexoStartY + 25, LARGURA_TOTAL, anexoHeight);
            
            // Texto de instrução (opcional)
            pdf.setFontSize(10);
            pdf.setFont('helvetica', 'italic');
            pdf.setTextColor(180, 180, 180);
            pdf.text('Espaço livre para apontamentos, observações e anotações adicionais', 
                     tableStartX + (LARGURA_TOTAL / 2), anexoStartY + anexoHeight + 15, { align: 'center' });
            
            // Número da página
            pdf.setFontSize(9);
            pdf.setTextColor(150, 150, 150);
            pdf.setFont('helvetica', 'normal');
            pdf.text(`Aula ${aulaNum} - Página ${pageNum}`, pageWidth - marginRight, pageHeight - marginBottom + 10, { align: 'right' });
        }
        
        // Função para gerar PDF flexível
        async function generateFlexivelPDF() {
            updateProgress(10, 'Iniciando geração...', 'Preparando Template Flexível');
            
            // Criar PDF horizontal
            pdf = new jspdf.jsPDF({
                orientation: 'landscape',
                unit: 'pt',
                format: 'a4'
            });
            
            // Página 1: Plano (funções 1 e 2 com cabeçalho)
            await new Promise(resolve => setTimeout(resolve, 300));
            createPlanoPage1(1, 50, 1);
            
            // Página 2: Plano (funções 3 e 4 sem cabeçalho + anexo)
            await new Promise(resolve => setTimeout(resolve, 300));
            createPlanoPage2(1, 90, 2);
            
            updateProgress(100, 'Template gerado com sucesso!', 'Documento pronto para impressão e preenchimento manual');
        }
        
        // Função para gerar PDF do bloco
        async function generateBlocoPDF() {
            updateProgress(5, 'Iniciando geração...', 'Preparando Bloco de Planificação');
            
            // Criar PDF vertical para capa
            pdf = new jspdf.jsPDF({
                orientation: 'portrait',
                unit: 'pt',
                format: 'a4'
            });
            
            // Página 1: Capa (Vertical) - apenas para bloco
            await new Promise(resolve => setTimeout(resolve, 500));
            await createCapa(15);
            
            // Calcular progresso por aula
            const totalAulas = config.aulas || 1;
            const progressPerAula = (85 - 15) / totalAulas;
            
            // Páginas das aulas
            for (let i = 1; i <= totalAulas; i++) {
                const baseProgress = 15 + ((i - 1) * progressPerAula);
                
                // Página 1 da aula (funções 1 e 2 com cabeçalho)
                const planoPage1 = (i * 2);
                const planoProgress1 = baseProgress + (progressPerAula * 0.4);
                await new Promise(resolve => setTimeout(resolve, 200));
                createPlanoPage1(i, planoProgress1, planoPage1);
                
                // Página 2 da aula (funções 3 e 4 sem cabeçalho + anexo)
                const planoPage2 = (i * 2) + 1;
                const planoProgress2 = baseProgress + (progressPerAula * 0.8);
                await new Promise(resolve => setTimeout(resolve, 200));
                createPlanoPage2(i, planoProgress2, planoPage2);
            }
            
            updateProgress(100, 'Bloco gerado com sucesso!', `Documento com ${(totalAulas * 2) + 1} páginas pronto para impressão`);
        }
        
        // Função principal
        async function generatePDF() {
            try {
                // Obter configuração do localStorage
                const configData = localStorage.getItem('planoConfig');
                if (!configData) {
                    throw new Error('Configuração não encontrada. Por favor, volte ao início.');
                }
                
                config = JSON.parse(configData);
                
                // Gerar PDF baseado no tipo
                if (config.tipo === 'flexivel') {
                    await generateFlexivelPDF();
                } else {
                    await generateBlocoPDF();
                }
                
                // Habilitar botão de download
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Baixar Template';
                downloadBtn.onclick = () => {
                    const tipoNome = config.tipo === 'flexivel' ? 'Template_Flexivel' : 'Bloco_Planificacao';
                    const professorNome = config.dados.professor ? config.dados.professor.replace(/\s+/g, '_') : 'Template';
                    const filename = `${tipoNome}_${professorNome}_${Date.now()}.pdf`;
                    pdf.save(filename);
                };
                
            } catch (error) {
                console.error('Erro ao gerar template:', error);
                showError(error.message);
            }
        }
        
        // Iniciar geração
        document.addEventListener('DOMContentLoaded', generatePDF);
    </script>
</body>
