<body>
<header>Download do Plano de Aula</header>
<main>
  <h2>Insira o Código Abaixo para Baixar o Plano</h2>

  <!-- Código promocional grande e visível -->
  <div id="codigo-promocional"></div>

  <div class="input-container" id="input-codigo">
    <input type="text" id="codigo-acesso" placeholder="digita aqui" maxlength="8">
    <span id="feedback-codigo" style="color:#dc3545; font-size:13px; display:block; text-align:center; margin-top:5px;"></span>
    <button class="confirmar-btn" onclick="validarCodigo()">Confirmar</button>
  </div>

  <div id="mensagem" class="mensagem"></div>

<script>
const URL_APP = "https://script.google.com/macros/s/AKfycby-l_VBnTuG98erRyPk0NA_QZvOJQnuix4P2zp2gnQCwvx5QFG9L9WgydoIHeMpofILnA/exec";
const inputCodigo = document.getElementById('codigo-acesso');
const feedback = document.getElementById('feedback-codigo');

inputCodigo.addEventListener('input', () => {
  let valor = inputCodigo.value.toUpperCase();
  const novoValor = valor.replace(/[^A-Z0-9]/g, '');
  if(valor !== novoValor){
    feedback.innerText = "❌ Apenas caracteres alfanuméricos são permitidos!";
  } else {
    feedback.innerText = "";
  }
  inputCodigo.value = novoValor.slice(0, 8);
});

// Exibir código promocional aleatório (visível)
const codigosPromo = ['2514DC16', '7655GT27', '8K7814D3', 'TD171705', 'J66BGK27'];
document.getElementById('codigo-promocional').textContent = codigosPromo[Math.floor(Math.random() * codigosPromo.length)];

function validarCodigo(){
  const codigo = inputCodigo.value.trim().toUpperCase();
  const msg = document.getElementById('mensagem');
  if(codigo.length !== 8){
    msg.style.color = "#dc3545";
    msg.innerText = "❌ O código deve ter 8 caracteres.";
    return;
  }
  msg.style.color = "#007BFF";
  msg.innerHTML = '🔍 Verificando o Código <span class="spinner"></span>';
  fetch(`${URL_APP}?codigo=${codigo}`, { method:'GET', mode:'cors' })
    .then(res => {
      if(!res.ok) throw new Error('Serviço indisponível');
      return res.json();
    })
    .then(data => {
      if(data && data.valido){
        const planoDataJSON = sessionStorage.getItem("planoData");
        if(!planoDataJSON){
            alert("❌ Nenhum plano encontrado. Gere o plano antes de tentar desbloquear.");
            return;
        }
        const planoData = JSON.parse(planoDataJSON);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a4'
        });
        
        // Fonte padrão
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        
        // --- TÍTULO DO PLANO ---
        doc.setFontSize(16);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(26, 95, 35); // Verde escuro
        doc.text("PLANO DE AULA", 148, 15, { align: "center" });
        
        // Linha abaixo do título
        doc.setDrawColor(26, 95, 35);
        doc.setLineWidth(1);
        doc.line(50, 18, 246, 18);
        
        // Reset para texto normal
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "normal");
        
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = planoData.html;
        
        // Dados da Esquerda (Coluna 1)
        let yLeft = 30;
        const addLineLeft = (label, value) => {
          if (value) {
            doc.text(`${label}:`, 10, yLeft);
            doc.text(value, 40, yLeft);
            yLeft += 7;
          }
        };
        
        const dadosEsquerda = tempDiv.querySelector('#dadosEsquerda');
        if (dadosEsquerda) {
          const esquerdaText = dadosEsquerda.innerText;
          const lines = esquerdaText.split('\n');
          lines.forEach(line => {
            if (line.includes(':')) {
              const [label, value] = line.split(':', 2);
              addLineLeft(label.trim(), value.trim());
            }
          });
        }
        
        // Dados da Direita (Coluna 3)
        let yRight = 30;
        const addLineRight = (label, value) => {
          if (value) {
            doc.text(`${label}:`, 160, yRight);
            doc.text(value, 190, yRight);
            yRight += 7;
          }
        };
        
        const dadosDireita = tempDiv.querySelector('#dadosDireita');
        if (dadosDireita) {
          const direitaText = dadosDireita.innerText;
          const lines = direitaText.split('\n');
          lines.forEach(line => {
            if (line.includes(':')) {
              const [label, value] = line.split(':', 2);
              addLineRight(label.trim(), value.trim());
            }
          });
        }
        
        // Dados do Centro (Coluna 2)
        let yCenter = 30;
        const addLineCenter = (label, value) => {
          if (value) {
            doc.text(`${label}:`, 85, yCenter);
            doc.text(value, 115, yCenter);
            yCenter += 7;
          }
        };
        
        const dadosCentro = tempDiv.querySelector('#dadosCentro');
        if (dadosCentro) {
          const centroText = dadosCentro.innerText;
          const lines = centroText.split('\n');
          lines.forEach(line => {
            if (line.includes(':')) {
              const [label, value] = line.split(':', 2);
              addLineCenter(label.trim(), value.trim());
            }
          });
        }
        
        // Objetivos
        const listaObjetivos = tempDiv.querySelector('#listaObjetivos');
        let lastY = Math.max(yLeft, yRight, yCenter);
        if (listaObjetivos) {
          doc.setFont("helvetica", "bold");
          doc.text("Objectivos específicos:", 10, lastY + 10);
          doc.setFont("helvetica", "normal");
          
          let yObj = lastY + 18;
          const objetivos = listaObjetivos.querySelectorAll('li');
          objetivos.forEach(obj => {
            const texto = obj.innerText.trim();
            if(texto){
              doc.text(`• ${texto}`, 15, yObj);
              yObj += 7;
            }
          });
          lastY = yObj;
        }
        
        // --- TABELA COM DIMENSÕES DO SISTEMA MOÇAMBIQUE ---
        // Dados das 4 funções didáticas
        const funcoesDidaticas = [
            'Introdução e Motivação',
            'Mediação e Assimilação',
            'Domínio e Consolidação',
            'Controlo e Avaliação'
        ];
        
        // Criar tabela com 4 linhas e 7 colunas
        const tableData = funcoesDidaticas.map(funcao => [
            '',                    // TEMPO (vazio para preenchimento manual)
            funcao,                // FUNÇÕES DIDÁCTICAS (pré-preenchida)
            '',                    // CONTEÚDOS (vazio)
            '',                    // ACTIVIDADES DO PROFESSOR (vazio)
            '',                    // ACTIVIDADES DOS ALUNOS (vazio)
            '',                    // MÉTODOS DE ENSINO (vazio)
            ''                     // MEIOS DE ENSINO (vazio)
        ]);

        // Criar tabela com jsPDF AutoTable
        doc.autoTable({
            startY: lastY + 15,
            head: [[
                'TEMPO', 
                'FUNÇÕES DIDÁCTICAS', 
                'CONTEÚDOS', 
                'ACTIVIDADES DO PROFESSOR', 
                'ACTIVIDADES DOS ALUNOS', 
                'MÉTODOS DE ENSINO', 
                'MEIOS DE ENSINO'
            ]],
            body: tableData,
            theme: 'grid',
            styles: {
                font: 'helvetica',
                fontSize: 10,
                textColor: [0, 0, 0],
                lineColor: [0, 0, 0],
                lineWidth: 1.5,  // Linhas mais grossas (1.5pt)
                cellPadding: 4,
                valign: 'top',
                overflow: 'linebreak',
                cellWidth: 'wrap'
            },
            headStyles: {
                fillColor: [108, 117, 125],  // Cinza (#6c757d)
                textColor: [255, 255, 255],
                fontStyle: 'bold',
                halign: 'center',
                fontSize: 10,
                textTransform: 'uppercase'  // Texto maiúsculo
            },
            columnStyles: {
                0: { cellWidth: 20, halign: 'center' },   // TEMPO
                1: { cellWidth: 45, fontStyle: 'bold' },  // FUNÇÕES DIDÁCTICAS
                2: { cellWidth: 53 },                     // CONTEÚDOS
                3: { cellWidth: 45 },                     // ACTIV. PROFESSOR
                4: { cellWidth: 45 },                     // ACTIV. ALUNOS
                5: { cellWidth: 33 },                     // MÉTODOS
                6: { cellWidth: 33 }                      // MEIOS
            },
            margin: { 
                top: 10, 
                bottom: 10, 
                left: 10,
                right: 10
            },
            tableWidth: 'auto',
            showHead: 'firstPage',
            didParseCell: function(data) {
                // Garantir bordas pretas em todas as células
                data.cell.styles.lineWidth = 1.5;
                data.cell.styles.lineColor = [0, 0, 0];
                
                // Se for célula vazia, adicionar placeholder
                if (data.column.index >= 0 && data.cell.raw === '' && 
                    ![0, 1].includes(data.column.index)) {
                    // Adicionar underline para campos vazios
                    data.cell.text = ['__________________________'];
                }
                
                // Alinhamento específico
                if (data.column.index === 0) { // TEMPO
                    data.cell.styles.halign = 'center';
                    data.cell.styles.valign = 'middle';
                }
            }
        });
        
        // === ANEXO SIMPLIFICADO (PÁGINA LIMPA) ===
        // Criar nova página para o anexo
        doc.addPage('portrait');
        
        // Configurações
        const margin = 20; // Margem de 20mm
        const pageWidth = doc.internal.pageSize.getWidth();
        
        // Título do anexo (cabeçalho)
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.setTextColor(26, 95, 35); // Verde escuro
        
        // Texto em maiúsculas
        const titulo = "ANEXO / QUADRO MORAL";
        doc.text(titulo, pageWidth / 2, 30, { align: "center" });
        
        // Linha preta abaixo do cabeçalho
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(1);
        doc.line(margin, 35, pageWidth - margin, 35);
        
        // O resto da página fica em branco para preenchimento manual
        // Pode adicionar aqui linhas horizontais se quiser
        
        // Opcional: Adicionar algumas linhas horizontais para escrita
        doc.setDrawColor(200, 200, 200); // Cinza claro
        doc.setLineWidth(0.5);
        let lineY = 50;
        for (let i = 0; i < 30; i++) {
            doc.line(margin, lineY, pageWidth - margin, lineY);
            lineY += 10;
        }
        
        // Salvar PDF com nome personalizado
        const disciplina = planoData.disciplina || "";
        const classe = planoData.classe || "";
        const dataPlano = planoData.data || "";
        const pdfBlob = doc.output('blob');
        const nomeArquivo = `Plano_de_Aula_${disciplina}_${classe}_${dataPlano}.pdf`;

        // --- Salvar no Histórico ---
        const historico = JSON.parse(localStorage.getItem("historicoPlanos")) || [];
        historico.push({
          escola: planoData.escola,
          professor: planoData.professor,
          disciplina: planoData.disciplina,
          unidade: planoData.unidade,
          tema: planoData.tema,
          tipo: planoData.tipo,
          classe: planoData.classe,
          data: planoData.data
        });
        localStorage.setItem("historicoPlanos", JSON.stringify(historico));

        // Mensagem de sucesso
        // Armazena para fallback
        window.__ultimoPDFBlob = pdfBlob;
        window.__ultimoPDFNome = nomeArquivo;

        // Tenta download automático
        setTimeout(() => {
          try {
            baixarPDF(pdfBlob, nomeArquivo);
          } catch (e) {
            console.warn("Auto-download bloqueado pelo navegador.");
          }
        }, 300);

        // Mostra mensagem + botão de fallback
        msg.innerHTML = `
          ✅ Código válido! PDFs restantes: ${data.restante}<br>
          Se o download não iniciou, clique abaixo:<br><br>
          <button onclick="baixarPDFManual()" 
                  style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;"
                  onmouseover="this.style.background='#218838';"
                  onmouseout="this.style.background='#28a745';">
            📥 Baixar o Plano Agora
          </button>
        `;
      } else {
        msg.style.color = "#dc3545";
        msg.innerText = `❌ ${data && data.msg ? data.msg : 'Código inválido'}`;
      }
    })
    .catch(err => {
      msg.style.color = "#dc3545";
      msg.innerText = "❌ Erro ao validar código. Tente novamente.";
      console.error(err);
    });
}

// === Funções de Download com Fallback ===
function baixarPDF(blob, nome) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Variáveis globais para o fallback
window.__ultimoPDFBlob = null;
window.__ultimoPDFNome = null;

function baixarPDFManual() {
  if (window.__ultimoPDFBlob && window.__ultimoPDFNome) {
    baixarPDF(window.__ultimoPDFBlob, window.__ultimoPDFNome);
  } else {
    alert("❌ Nenhum PDF disponível para download.");
  }
}
</script>
