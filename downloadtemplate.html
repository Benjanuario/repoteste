<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerando PDF - Sistema de Planos de Aula</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d4d16 0%, #1a5f23 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
            color: white;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .loading-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .details {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: white;
            color: #1a5f23;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            margin-top: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 2px solid #dc3545;
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .back-link {
            color: white;
            text-decoration: none;
            margin-top: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .logo { font-size: 3rem; }
            .loading-container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-file-pdf"></i>
        </div>
        
        <h1>Gerando o seu PDF</h1>
        <p class="subtitle">Estamos a preparar o seu documento com todas as especificações solicitadas.</p>
        
        <div class="loading-container">
            <div class="spinner"></div>
            
            <div class="status" id="status">Iniciando geração do PDF...</div>
            <div class="details" id="details">Carregando configurações...</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="details" id="progress-text">0% concluído</div>
        </div>
        
        <button class="btn" id="download-btn" disabled>
            <i class="fas fa-download"></i> Baixar PDF
        </button>
        
        <div class="error" id="error-message">
            <h3 style="margin-bottom: 1rem; color: white;"><i class="fas fa-exclamation-triangle"></i> Erro ao gerar PDF</h3>
            <p id="error-text" style="color: white;">Ocorreu um erro ao gerar o documento. Por favor, tente novamente.</p>
            <button class="btn" onclick="window.location.href='index.html'" style="margin-top: 1rem; background: #dc3545; color: white;">
                <i class="fas fa-arrow-left"></i> Voltar ao Início
            </button>
        </div>
        
        <a href="preview.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar à Pré-visualização
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        // Configuração
        let config = null;
        let pdf = null;
        
        // Elementos DOM
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const downloadBtn = document.getElementById('download-btn');
        const errorEl = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // Funções de progresso
        function updateProgress(percent, status, details) {
            progressBar.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '% concluído';
            statusEl.textContent = status;
            detailsEl.textContent = details;
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorEl.classList.add('show');
        }
        
        // Função para carregar imagem da capa
        async function loadEmblemImage() {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.warn('Emblema não encontrado, usando placeholder');
                    resolve(null);
                };
                img.src = 'emblema.png';
            });
        }
        
        // Função para criar capa do bloco
        async function createCapa(progress) {
            updateProgress(progress, 'Criando capa...', 'Preparando capa oficial com emblema');
            
            const emblem = await loadEmblemImage();
            
            // Configurar página vertical
            pdf.addPage();
            pdf.setPage(1);
            
            // Fundo branco
            pdf.setFillColor(255, 255, 255);
            pdf.rect(0, 0, 595.28, 841.89, 'F');
            
            // Emblema no topo (se disponível)
            if (emblem) {
                const emblemWidth = 100;
                const emblemHeight = 100;
                const emblemX = (595.28 - emblemWidth) / 2;
                const emblemY = 60;
                
                try {
                    pdf.addImage(emblem, 'PNG', emblemX, emblemY, emblemWidth, emblemHeight);
                } catch (e) {
                    console.warn('Erro ao adicionar emblema:', e);
                }
            }
            
            // Títulos
            pdf.setFontSize(32);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35); // Verde escuro
            pdf.text('REPÚBLICA DE MOÇAMBIQUE', 297.64, 180, { align: 'center' });
            
            pdf.setFontSize(24);
            pdf.text('MINISTÉRIO DA EDUCAÇÃO', 297.64, 210, { align: 'center' });
            
            // Linha divisória
            pdf.setDrawColor(26, 95, 35);
            pdf.setLineWidth(2);
            pdf.line(100, 240, 495.28, 240);
            
            // Título principal
            pdf.setFontSize(36);
            pdf.setTextColor(211, 47, 47); // Vermelho
            pdf.text('BLOCO DE PLANIFICAÇÃO', 297.64, 290, { align: 'center' });
            
            // Informações
            pdf.setFontSize(20);
            pdf.setTextColor(0, 0, 0);
            pdf.setFont('helvetica', 'bold');
            
            let y = 350;
            const lineHeight = 28;
            
            if (config.dados.escola) {
                pdf.text(`ESCOLA: ${config.dados.escola.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.professor) {
                pdf.text(`PROFESSOR: ${config.dados.professor.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.disciplina) {
                pdf.text(`DISCIPLINA: ${config.dados.disciplina.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.classe) {
                pdf.text(`CLASSE: ${config.dados.classe.toUpperCase()}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            if (config.dados.ano) {
                pdf.text(`ANO LECTIVO: ${config.dados.ano}`, 297.64, y, { align: 'center' });
                y += lineHeight;
            }
            
            // Rodapé
            pdf.setFontSize(12);
            pdf.setTextColor(100, 100, 100);
            pdf.setFont('helvetica', 'normal');
            pdf.text('Documento gerado automaticamente pelo Sistema de Planos de Aula', 297.64, 780, { align: 'center' });
            pdf.text(`Data de geração: ${new Date().toLocaleDateString('pt-MZ')}`, 297.64, 795, { align: 'center' });
        }
        
        // Função para criar página horizontal de plano COM NOVA TABELA
        function createPlanoPage(pageNum, aulaNum, progress) {
            updateProgress(progress, `Criando página ${pageNum}...`, `Preparando plano da aula ${aulaNum}`);
            
            // Adicionar nova página horizontal
            pdf.addPage([841.89, 595.28], 'landscape');
            
            // Margens: 0,7cm = 19.84 pontos (1cm = 28.35 pontos)
            const margin = 19.84;
            const width = 841.89 - (margin * 2);
            const height = 595.28 - (margin * 2);
            
            // Cabeçalho
            pdf.setFontSize(28);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35);
            pdf.text('PLANO DE AULA', margin + (width / 2), margin + 20, { align: 'center' });
            
            // Linha abaixo do título
            pdf.setDrawColor(26, 95, 35);
            pdf.setLineWidth(1.5);
            pdf.line(margin + (width / 2) - 100, margin + 30, margin + (width / 2) + 100, margin + 30);
            
            // Preliminares em 3 colunas
            const colWidth = width / 3;
            const colGap = 20;
            let y = margin + 60;
            
            // Coluna 1: Esquerda
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(0, 0, 0);
            
            if (config.dados.professor) {
                pdf.text(`Professor: ${config.dados.professor}`, margin, y);
            } else {
                pdf.text('Professor: __________________________', margin, y);
            }
            y += 18;
            
            if (config.dados.escola) {
                pdf.text(`Escola: ${config.dados.escola}`, margin, y);
            } else {
                pdf.text('Escola: __________________________', margin, y);
            }
            y += 18;
            
            if (config.dados.turma) {
                pdf.text(`Turma: ${config.dados.turma}`, margin, y);
            } else {
                pdf.text('Turma: ______', margin, y);
            }
            
            // Coluna 2: Centro
            y = margin + 60;
            const centerX = margin + colWidth + colGap;
            
            pdf.text('Disciplina: __________________________', centerX, y);
            y += 18;
            pdf.text('Unidade Temática: ___________________', centerX, y);
            y += 18;
            pdf.text('Tema: _______________________________', centerX, y);
            y += 18;
            
            if (config.dados.tipo_aula) {
                pdf.text(`Tipo de Aula: ${config.dados.tipo_aula}`, centerX, y);
            } else {
                pdf.text('Tipo de Aula: ____________________', centerX, y);
            }
            y += 18;
            
            if (config.dados.data) {
                pdf.text(`Data: ${config.dados.data}`, centerX, y);
            } else {
                pdf.text('Data: ____________________________', centerX, y);
            }
            
            // Coluna 3: Direita
            y = margin + 60;
            const rightX = margin + (colWidth * 2) + (colGap * 2);
            
            if (config.dados.classe) {
                pdf.text(`Classe: ${config.dados.classe}`, rightX, y);
            } else {
                pdf.text('Classe: ______', rightX, y);
            }
            y += 18;
            
            pdf.text('Lição nº: ______', rightX, y);
            y += 18;
            
            if (config.dados.duracao) {
                pdf.text(`Duração: ${config.dados.duracao}`, rightX, y);
            } else {
                pdf.text('Duração: _________________________', rightX, y);
            }
            y += 18;
            
            if (config.dados.periodo) {
                pdf.text(`Período: ${config.dados.periodo}`, rightX, y);
            } else {
                pdf.text('Período: ______', rightX, y);
            }
            
            // Objetivos Específicos
            y += 30;
            pdf.setFontSize(12);
            pdf.setFont('helvetica', 'bold');
            pdf.text('Objectivos específicos:', margin, y);
            
            pdf.setFontSize(11);
            pdf.setFont('helvetica', 'normal');
            y += 15;
            
            // Primeiro objetivo na mesma linha
            pdf.text('• _________________________________________________________', margin, y);
            y += 15;
            
            // Segundo e terceiro objetivos em novas linhas
            pdf.text('• _________________________________________________________', margin, y);
            y += 15;
            pdf.text('• _________________________________________________________', margin, y);
            
            // Tabela do plano COM DIMENSÕES DO SISTEMA MOÇAMBIQUE
            const tableTop = y + 25;
            
            // Configurar cabeçalho da tabela
            const headers = [
                ['TEMPO', 'FUNÇÕES DIDÁCTICAS', 'CONTEÚDOS', 'ACTIV. PROFESSOR', 'ACTIV. ALUNOS', 'MÉTODOS', 'MEIOS']
            ];
            
            const functions = [
                { funcao: 'Introdução e Motivação' },
                { funcao: 'Mediação e Assimilação' },
                { funcao: 'Domínio e Consolidação' },
                { funcao: 'Controlo e Avaliação' }
            ];
            
            // Preparar dados da tabela
            const tableData = functions.map(f => [
                '', // TEMPO vazio
                f.funcao,
                '',
                '',
                '',
                '',
                ''
            ]);
            
            // Criar tabela com jsPDF AutoTable - DIMENSÕES AJUSTADAS
            pdf.autoTable({
                startY: tableTop,
                head: headers,
                body: tableData,
                margin: { left: margin, right: margin },
                tableWidth: width,
                styles: {
                    fontSize: 9,
                    cellPadding: 3,
                    overflow: 'linebreak',
                    halign: 'left',
                    valign: 'top',
                    lineColor: [0, 0, 0],
                    lineWidth: 0.5
                },
                headStyles: {
                    fillColor: [108, 117, 125], // Cinza
                    textColor: [255, 255, 255],
                    fontStyle: 'bold',
                    halign: 'center',
                    fontSize: 9,
                    textTransform: 'uppercase'
                },
                columnStyles: {
                    0: { cellWidth: 40, halign: 'center' }, // TEMPO (ajustado)
                    1: { cellWidth: 90, fontStyle: 'bold' }, // FUNÇÕES (ajustado)
                    2: { cellWidth: 110 }, // CONTEÚDOS (ajustado)
                    3: { cellWidth: 90 }, // ACTIV. PROFESSOR (ajustado)
                    4: { cellWidth: 90 }, // ACTIV. ALUNOS (ajustado)
                    5: { cellWidth: 70 }, // MÉTODOS (ajustado)
                    6: { cellWidth: 70 } // MEIOS (ajustado)
                },
                theme: 'grid',
                didParseCell: function(data) {
                    // Adicionar bordas pretas em todas as células
                    data.cell.styles.lineWidth = 0.5;
                    data.cell.styles.lineColor = [0, 0, 0];
                    
                    // Se for célula vazia, adicionar placeholder
                    if (data.column.index >= 2 && data.cell.raw === '') {
                        data.cell.text = ['__________________________'];
                    }
                }
            });
            
            // Número da página
            pdf.setFontSize(9);
            pdf.setTextColor(150, 150, 150);
            pdf.text(`Aula ${aulaNum} - Página ${pageNum}`, 841.89 - margin, 595.28 - margin, { align: 'right' });
        }
        
        // Função para criar página vertical de anexo SIMPLIFICADA
        function createAnexoPage(pageNum, aulaNum, progress) {
            updateProgress(progress, `Criando página ${pageNum}...`, `Preparando anexo da aula ${aulaNum}`);
            
            // Adicionar nova página vertical
            pdf.addPage();
            
            // Margens
            const margin = 19.84; // 0,7cm
            const width = 595.28 - (margin * 2);
            
            // Título em maiúsculas
            pdf.setFontSize(20);
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(26, 95, 35);
            pdf.text('ANEXO / QUADRO MORAL', margin + (width / 2), 50, { align: 'center' });
            
            // Linha preta abaixo do cabeçalho
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(1);
            pdf.line(margin, 58, width + margin, 58);
            
            // Página fica em branco para preenchimento
            // Número da página
            pdf.setFontSize(9);
            pdf.setTextColor(150, 150, 150);
            pdf.text(`Anexo Aula ${aulaNum} - Página ${pageNum}`, 595.28 - margin, 841.89 - margin, { align: 'right' });
        }
        
        // Função para gerar PDF flexível
        async function generateFlexivelPDF() {
            updateProgress(10, 'Iniciando geração...', 'Preparando Plano Flexível');
            
            // Criar PDF inicial
            pdf = new jspdf.jsPDF({
                orientation: 'landscape',
                unit: 'pt',
                format: 'a4'
            });
            
            // Página 1: Plano (Horizontal) COM NOVA TABELA
            await new Promise(resolve => setTimeout(resolve, 300));
            createPlanoPage(1, 1, 50);
            
            // Página 2: Anexo (Vertical) SIMPLIFICADO
            await new Promise(resolve => setTimeout(resolve, 300));
            createAnexoPage(2, 1, 90);
            
            updateProgress(100, 'PDF gerado com sucesso!', 'Documento pronto para download');
        }
        
        // Função para gerar PDF do bloco
        async function generateBlocoPDF() {
            updateProgress(5, 'Iniciando geração...', 'Preparando Bloco de Planificação');
            
            // Criar PDF
            pdf = new jspdf.jsPDF({
                orientation: 'portrait',
                unit: 'pt',
                format: 'a4'
            });
            
            // Página 1: Capa (Vertical)
            await new Promise(resolve => setTimeout(resolve, 500));
            await createCapa(15);
            
            // Calcular progresso por página
            const totalPages = (config.aulas * 2) + 1;
            const pagesAfterCapa = totalPages - 1;
            const progressPerPage = (85 - 15) / pagesAfterCapa;
            
            // Páginas das aulas
            for (let i = 1; i <= config.aulas; i++) {
                const baseProgress = 15 + ((i - 1) * 2 * progressPerPage);
                
                // Página do plano (Horizontal) COM NOVA TABELA
                const planoPageNum = (i * 2);
                const planoProgress = baseProgress + progressPerPage;
                await new Promise(resolve => setTimeout(resolve, 200));
                createPlanoPage(planoPageNum, i, planoProgress);
                
                // Página do anexo (Vertical) SIMPLIFICADO
                const anexoPageNum = (i * 2) + 1;
                const anexoProgress = baseProgress + (2 * progressPerPage);
                await new Promise(resolve => setTimeout(resolve, 200));
                createAnexoPage(anexoPageNum, i, anexoProgress);
            }
            
            updateProgress(100, 'PDF gerado com sucesso!', `Documento com ${totalPages} páginas pronto`);
        }
        
        // Função principal
        async function generatePDF() {
            try {
                // Obter configuração
                const configData = localStorage.getItem('planoConfig');
                if (!configData) {
                    throw new Error('Configuração não encontrada. Por favor, volte ao início.');
                }
                
                config = JSON.parse(configData);
                
                // Gerar PDF baseado no tipo
                if (config.tipo === 'flexivel') {
                    await generateFlexivelPDF();
                } else {
                    await generateBlocoPDF();
                }
                
                // Habilitar botão de download
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Baixar PDF';
                downloadBtn.onclick = () => {
                    const filename = `${config.tipo === 'flexivel' ? 'Plano_Flexivel' : 'Bloco_Planificacao'}_${config.dados.professor.replace(/\s+/g, '_')}_${Date.now()}.pdf`;
                    pdf.save(filename);
                };
                
            } catch (error) {
                console.error('Erro ao gerar PDF:', error);
                showError(error.message);
            }
        }
        
        // Iniciar geração
        document.addEventListener('DOMContentLoaded', generatePDF);
    </script>
</body>
</html>
