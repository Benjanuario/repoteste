(function() {
  // =============================================
  // CONTROLE INTELIGENTE (mostra conteúdo após reload)
  // =============================================
  
  var botao = document.getElementById('botaoRecarregar');
  var conteudo = document.getElementById('conteudoPrincipal');

  // Se a URL tem ?recarregado=1, veio de um reload nosso
  if (window.location.search.indexOf('recarregado=1') !== -1) {
    // Mostra conteúdo e remove o parâmetro da URL
    if (botao) botao.style.display = 'none';
    if (conteudo) conteudo.style.display = 'block';
    
    // Limpa a URL
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  // Se não tem o parâmetro, verifica se é primeira vez
  else if (!sessionStorage.getItem('entrada_anterior')) {
    // Primeira vez: marca e mostra conteúdo
    sessionStorage.setItem('entrada_anterior', 'true');
    if (botao) botao.style.display = 'none';
    if (conteudo) conteudo.style.display = 'block';
  } else {
    // Segunda vez ou mais: mostra botão
    if (botao) botao.style.display = 'block';
    if (conteudo) conteudo.style.display = 'none';
  }
})();

<main>
  <h2>Insira o Código Abaixo para Baixar o Plano</h2>

  <!-- Código promocional grande e visível -->
  <div id="codigo-promocional"></div>

  <div class="input-container" id="input-codigo">
    <input type="text" id="codigo-acesso" placeholder="digita aqui" maxlength="8">
    <span id="feedback-codigo" style="color:#dc3545; font-size:13px; display:block; text-align:center; margin-top:5px;"></span>
    <button class="confirmar-btn" onclick="validarCodigo()">Confirmar</button>
  </div>

  <div id="mensagem" class="mensagem"></div>

<script>
// =============================================
// CONFIGURAÇÕES
// =============================================
const URL_APP = "https://script.google.com/macros/s/AKfycby-l_VBnTuG98erRyPk0NA_QZvOJQnuix4P2zp2gnQCwvx5QFG9L9WgydoIHeMpofILnA/exec";
const inputCodigo = document.getElementById('codigo-acesso');
const feedback = document.getElementById('feedback-codigo');

inputCodigo.addEventListener('input', () => {
  let valor = inputCodigo.value.toUpperCase();
  const novoValor = valor.replace(/[^A-Z0-9]/g, '');
  if(valor !== novoValor){
    feedback.innerText = "❌ Apenas caracteres alfanuméricos são permitidos!";
  } else {
    feedback.innerText = "";
  }
  inputCodigo.value = novoValor.slice(0, 8);
});

// Exibir código promocional aleatório (visível)
const codigosPromo = ['2514DC16', '7655GT27', '8K7814D3', 'TD171705', 'J66BGK27'];
document.getElementById('codigo-promocional').textContent = codigosPromo[Math.floor(Math.random() * codigosPromo.length)];

// =============================================
// FUNÇÕES DE DOWNLOAD
// =============================================
function baixarPDF(blob, nome) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Variáveis globais para fallback
window.__ultimoPDFBlob = null;
window.__ultimoPDFNome = null;

function baixarPDFManual() {
  if (window.__ultimoPDFBlob && window.__ultimoPDFNome) {
    baixarPDF(window.__ultimoPDFBlob, window.__ultimoPDFNome);
  } else {
    alert("❌ Nenhum PDF disponível para download.");
  }
}

// =============================================
// FUNÇÃO PRINCIPAL DE VALIDAÇÃO E GERAÇÃO DO PDF
// =============================================
function validarCodigo(){
  const codigo = inputCodigo.value.trim().toUpperCase();
  const msg = document.getElementById('mensagem');
  
  if(codigo.length !== 8){
    msg.style.color = "#dc3545";
    msg.innerText = "❌ O código deve ter 8 caracteres.";
    return;
  }
  
  msg.style.color = "#007BFF";
  msg.innerHTML = '🔍 Verificando o Código <span class="spinner"></span>';
  
  fetch(`${URL_APP}?codigo=${codigo}`, { method:'GET', mode:'cors' })
    .then(res => {
      if(!res.ok) throw new Error('Serviço indisponível');
      return res.json();
    })
    .then(data => {
      if(data && data.valido){
        const planoDataJSON = sessionStorage.getItem("planoData");
        if(!planoDataJSON){
            alert("❌ Nenhum plano encontrado. Gere o plano antes de tentar desbloquear.");
            return;
        }
        const planoData = JSON.parse(planoDataJSON);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a4'
        });
        
        // =============================================
        // CABEÇALHO DO PDF (SEM "DADOS PRELIMINARES")
        // =============================================
        doc.setFont("times", "normal");
        doc.setFontSize(12);
        
        // Título principal
        doc.setFont("times", "bold");
        doc.setFontSize(16);
        doc.text("PLANO DE AULA", 148, 10, { align: "center" });
        doc.setFont("times", "normal");
        doc.setFontSize(12);
        
        // Linha separadora
        doc.setDrawColor(10, 95, 42);
        doc.setLineWidth(0.5);
        doc.line(10, 13, 287, 13);
        
        // =============================================
        // DADOS DO PLANO (SEM TÍTULO "DADOS PRELIMINARES")
        // =============================================
        let yPos = 20; // Começa mais próximo da linha separadora
        const colEsquerda = 10;
        const colDireita = 150;
        const labelOffset = 30; // Aumentado para evitar sobreposição (era 25)
        
        // Função auxiliar para adicionar linha de dados
        function addDado(label, value, y, col) {
            if (value && value !== '—' && value !== '' && value !== null && value !== undefined) {
                doc.setFont("times", "bold");
                doc.text(`${label}:`, col, y);
                doc.setFont("times", "normal");
                
                // Quebrar texto longo se necessário
                const valorStr = String(value);
                if (valorStr.length > 30) {
                    const linhas = doc.splitTextToSize(valorStr, 100);
                    doc.text(linhas[0], col + labelOffset, y);
                    for (let i = 1; i < linhas.length; i++) {
                        doc.text(linhas[i], col + labelOffset, y + (i * 5));
                    }
                } else {
                    doc.text(valorStr, col + labelOffset, y);
                }
                return true;
            }
            return false;
        }
        
        // Dados da esquerda (começa em yPos)
        addDado("Escola", planoData.escola, yPos, colEsquerda);
        yPos += 6;
        addDado("Professor", planoData.professor, yPos, colEsquerda);
        yPos += 6;
        addDado("Disciplina", planoData.disciplina, yPos, colEsquerda);
        yPos += 6;
        addDado("Unidade Temática", planoData.unidade, yPos, colEsquerda);
        yPos += 6;
        addDado("Tema", planoData.tema, yPos, colEsquerda);
        yPos += 6;
        addDado("Tipo de Aula", planoData.tipo, yPos, colEsquerda);
        yPos += 6; // Espaço antes de Tema Transversal
        
        // Reset y para direita
        let yPosDireita = 20;
        
        // Dados da direita
        addDado("Classe", planoData.classe, yPosDireita, colDireita);
        yPosDireita += 6;
        addDado("Turma", planoData.turma, yPosDireita, colDireita);
        yPosDireita += 6;
        addDado("Lição nº", planoData.licao || '—', yPosDireita, colDireita);
        yPosDireita += 6;
        addDado("Duração", `${planoData.duracao} minutos`, yPosDireita, colDireita);
        yPosDireita += 6;
        addDado("Período", planoData.periodo, yPosDireita, colDireita);
        yPosDireita += 6;
        
        // Data formatada
        let dataFormatada = '—';
        if (planoData.data) {
            try {
                const data = new Date(planoData.data);
                dataFormatada = data.toLocaleDateString('pt-PT');
            } catch (e) {
                dataFormatada = planoData.data;
            }
        }
        addDado("Data", dataFormatada, yPosDireita, colDireita);
        yPosDireita += 6;
        
        // =============================================
        // TEMAS TRANSVERSAIS (esquerda) e MATERIAIS (direita)
        // =============================================
        const temTemas = planoData.temas && planoData.temas.length > 0;
        const temMateriais = planoData.materiais && planoData.materiais.length > 0;
        
        if (temTemas || temMateriais) {
            // Posição atual após Tipo de Aula
            let yTemas = yPos - 6; // Volta para a linha onde estava após Tipo de Aula
            let yMateriais = yPosDireita - 6; // Volta para a linha onde estava após Data
            
            // Determinar a linha mais alta para alinhar
            const yMax = Math.max(yTemas, yMateriais);
            yTemas = yMax;
            yMateriais = yMax;
            
            // Tema Transversal (esquerda)
            if (temTemas) {
                doc.setFont("times", "bold");
                doc.text("Tema Transversal:", colEsquerda, yTemas);
                doc.setFont("times", "normal");
                
                let temaY = yTemas;
                planoData.temas.forEach((tema, idx) => {
                    doc.text(`• ${tema}`, colEsquerda + labelOffset, temaY);
                    temaY += 5;
                });
                yTemas = temaY;
            }
            
            // Materiais (direita)
            if (temMateriais) {
                doc.setFont("times", "bold");
                doc.text("Materiais:", colDireita, yMateriais);
                doc.setFont("times", "normal");
                
                let materialY = yMateriais;
                planoData.materiais.forEach((material, idx) => {
                    doc.text(`• ${material}`, colDireita + labelOffset, materialY);
                    materialY += 5;
                });
                yMateriais = materialY;
            }
            
            // Atualizar yPos para depois dos temas/materiais
            yPos = Math.max(yTemas, yMateriais) + 4;
        } else {
            yPos = Math.max(yPos, yPosDireita) + 4;
        }
        
        // =============================================
        // OBJECTIVOS (com espaçamento igual ao original)
        // =============================================
        if (planoData.objetivos) {
            yPos += 2; // Espaçamento igual ao original
            
            doc.setFont("times", "bold");
            doc.setFontSize(12);
            doc.text("Objectivos Específicos:", 10, yPos);
            doc.setFont("times", "normal");
            
            yPos += 6;
            
            const objetivos = planoData.objetivos.split('\n').filter(l => l.trim());
            objetivos.forEach(obj => {
                if (obj.trim()) {
                    const linhas = doc.splitTextToSize(obj.trim(), 270);
                    linhas.forEach(linha => {
                        doc.text(linha, 15, yPos);
                        yPos += 5;
                    });
                }
            });
            yPos += 4;
        }
        
        // =============================================
        // TABELA DO PLANO (cabeçalho só na primeira página)
        // =============================================
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = planoData.tabela || '';
        
        const tabelaRows = tempDiv.querySelectorAll('tbody tr');
        const tableData = [];
        
        tabelaRows.forEach(row => {
            const cells = row.querySelectorAll('td');
            const rowData = [];
            cells.forEach(cell => {
                let text = cell.innerHTML
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<[^>]*>/g, '')
                    .trim();
                rowData.push(text);
            });
            tableData.push(rowData);
        });
        
        if (tableData.length > 0) {
            doc.autoTable({
                startY: yPos,
                head: [['TEMPO', 'FUNÇÕES DIDÁCTICAS', 'CONTEÚDOS', 'ACTIVIDADES DO PROFESSOR', 'ACTIVIDADES DOS ALUNOS', 'MÉTODOS DE ENSINO', 'MEIOS DE ENSINO']],
                body: tableData,
                theme: 'grid',
                styles: {
                    font: 'times',
                    fontSize: 9,
                    textColor: [0,0,0],
                    lineColor: [0,0,0],
                    lineWidth: 0.1,
                    cellPadding: 2,
                    valign: 'top',
                    overflow: 'linebreak'
                },
                headStyles: {
                    fillColor: [128, 128, 128], // Cinza como original
                    textColor: [255,255,255],
                    font: 'times',
                    fontSize: 9,
                    fontStyle: 'bold',
                    halign: 'center'
                },
                columnStyles: {
                    0: { cellWidth: 18 },
                    1: { cellWidth: 35 },
                    2: { cellWidth: 'auto' },
                    3: { cellWidth: 'auto' },
                    4: { cellWidth: 'auto' },
                    5: { cellWidth: 30 },
                    6: { cellWidth: 30 }
                },
                margin: { left: 7, right: 7 },
                showHead: 'firstPage' // Cabeçalho só na primeira página
            });
            
            yPos = doc.lastAutoTable.finalY + 8;
        }
        
        // =============================================
        // ANEXO (exatamente como no original)
        // =============================================
        const pageHeight = doc.internal.pageSize.getHeight();
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 7;
        const boxWidth = pageWidth - (2 * margin);
        const boxHeight = 60; // Altura fixa da caixa de anexo
        
        // Verificar se precisa de nova página
        if (yPos + boxHeight + 10 > pageHeight) {
            doc.addPage();
            yPos = 20;
        }
        
        // Desenhar caixa do anexo (sempre visível)
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.2);
        doc.rect(margin, yPos, boxWidth, boxHeight);
        
        // Título
        doc.setFont("times", "bold");
        doc.setFontSize(10);
        doc.text("ANEXO / QUADRO MURAL", margin + (boxWidth/2), yPos + 6, { align: "center" });
        doc.setFont("times", "normal");
        doc.setFontSize(9);
        
        // Verificar se há anexo salvo
        const temAnexo = planoData.anexoTipo && 
                         ((planoData.anexoTipo === 'imagem' && planoData.anexoImagem) || 
                          (planoData.anexoTipo === 'texto' && planoData.anexoTexto));
        
        if (temAnexo) {
            if (planoData.anexoTipo === 'imagem' && planoData.anexoImagem) {
                // Inserir imagem
                try {
                    doc.addImage(
                        planoData.anexoImagem, 
                        'JPEG', 
                        margin + 5, 
                        yPos + 10, 
                        boxWidth - 10, 
                        boxHeight - 15,
                        undefined,
                        'FAST'
                    );
                } catch (err) {
                    doc.text("Erro ao carregar imagem do anexo.", margin + 5, yPos + 20);
                }
            } else if (planoData.anexoTipo === 'texto' && planoData.anexoTexto) {
                // Texto do anexo - usar splitTextToSize para quebrar corretamente
                const linhas = doc.splitTextToSize(planoData.anexoTexto, boxWidth - 10);
                let textoY = yPos + 12;
                
                linhas.forEach((linha, idx) => {
                    if (textoY <= yPos + boxHeight - 8) {
                        doc.text(linha, margin + 5, textoY);
                        textoY += 5;
                    } else {
                        // Se o texto exceder a caixa, adicionar nova página
                        doc.addPage();
                        yPos = 20;
                        textoY = yPos + 12;
                        
                        // Redesenhar caixa na nova página
                        doc.setDrawColor(0, 0, 0);
                        doc.setLineWidth(0.2);
                        doc.rect(margin, yPos, boxWidth, boxHeight);
                        
                        doc.setFont("times", "bold");
                        doc.setFontSize(10);
                        doc.text("ANEXO / QUADRO MURAL (continuação)", margin + (boxWidth/2), yPos + 6, { align: "center" });
                        doc.setFont("times", "normal");
                        doc.setFontSize(9);
                        
                        // Continuar escrevendo
                        doc.text(linha, margin + 5, textoY);
                        textoY += 5;
                    }
                });
            }
        } else {
            // Caixa vazia para escrever manualmente
            doc.setFont("times", "italic");
            doc.setFontSize(9);
            doc.setTextColor(150, 150, 150);
            doc.text("(Espaço reservado para anexos)", margin + (boxWidth/2), yPos + (boxHeight/2), { align: "center" });
            doc.setTextColor(0, 0, 0);
        }
        
        // =============================================
        // DOWNLOAD DO PDF
        // =============================================
        const pdfBlob = doc.output('blob');
        const nomeArquivo = `Plano_de_Aula_${planoData.disciplina || ''}_${planoData.classe || ''}_${planoData.data || ''}.pdf`.replace(/\s+/g, '_').replace(/[^\w\-\.]/g, '');
        
        window.__ultimoPDFBlob = pdfBlob;
        window.__ultimoPDFNome = nomeArquivo;
        
        // Download IMEDIATO
        try {
            baixarPDF(pdfBlob, nomeArquivo);
        } catch (e) {
            console.warn("Erro no download:", e);
        }
        
        // Mostrar badge do tipo de geração
        const tipoGeracao = planoData.tipoGeracao || 'basico';
        const badgeClass = tipoGeracao === 'inteligente' ? 'badge-inteligente' : 'badge-basico';
        const badgeText = tipoGeracao === 'inteligente' ? '✨ Plano Gerado com IA' : '📋 Plano Gerado (Modo Básico)';
        
        msg.innerHTML = `
            ✅ Código válido! PDFs restantes: ${data.restante}<br>
            <span class="geracao-badge ${badgeClass}"><i class="fas ${tipoGeracao === 'inteligente' ? 'fa-brain' : 'fa-file-alt'}"></i> ${badgeText}</span><br><br>
            Se o download não iniciou, clique abaixo:<br><br>
            <button onclick="baixarPDFManual()" class="download-btn">
                <i class="fas fa-file-pdf"></i> 📥 BAIXAR PLANO AGORA
            </button>
        `;
        
        // Registrar sucesso
        registrarDownloadSucesso(planoData, codigo, data.restante);
        
      } else {
        msg.style.color = "#dc3545";
        msg.innerText = `❌ ${data && data.msg ? data.msg : 'Código inválido'}`;
      }
    })
    .catch(err => {
      msg.style.color = "#dc3545";
      msg.innerText = "❌ Erro ao validar código. Tente novamente.";
      console.error(err);
    });
}

// =============================================
// RASTREAMENTO DE DOWNLOAD
// =============================================
function registrarDownloadSucesso(planoData, codigo, restante) {
  try {
    // Atualizar histórico
    const historico = JSON.parse(localStorage.getItem("historicoPlanos")) || [];
    historico.push({
      escola: planoData.escola,
      professor: planoData.professor,
      disciplina: planoData.disciplina,
      unidade: planoData.unidade,
      tema: planoData.tema,
      tipo: planoData.tipo,
      classe: planoData.classe,
      data: planoData.data,
      tipoGeracao: planoData.tipoGeracao || 'basico',
      timestamp: new Date().toISOString()
    });
    localStorage.setItem("historicoPlanos", JSON.stringify(historico));
    
    // Atualizar contador no localStorage
    const usuarioAtual = JSON.parse(localStorage.getItem("usuario") || "{}");
    if (!usuarioAtual.downloads) usuarioAtual.downloads = {};
    if (!usuarioAtual.downloads.planoAula) usuarioAtual.downloads.planoAula = 0;
    usuarioAtual.downloads.planoAula++;
    localStorage.setItem("usuario", JSON.stringify(usuarioAtual));
    
    console.log("✅ Download registrado com sucesso!");
  } catch (e) {
    console.warn("Erro ao registrar download:", e);
  }
}

// =============================================
// SISTEMA DE RASTREAMENTO
// =============================================
(function() {
  'use strict';
  
  const TRACKING_URL = "https://script.google.com/macros/s/AKfycbzKLDACXusk8jO4VwA5CHjOyJqidQ-KS6SrS8aq7Ocdqki_JPfjXIy22EnL8-4bFAlzDg/exec";
  
  function obterDadosUsuario() {
    try {
      const usuarioData = localStorage.getItem("usuario");
      if (!usuarioData) return null;
      
      const usuario = JSON.parse(usuarioData);
      const nomeFormatado = usuario.nome 
        ? usuario.nome.trim().replace(/\s+/g, '_').substring(0, 30)
        : "NOME";
      
      const telefoneCompleto = usuario.telefone 
        ? usuario.telefone.replace(/\D/g, '')
        : "SEMTELEFONE";
      
      const usuario_id = `${nomeFormatado}_${telefoneCompleto}`;
      
      return {
        nome: usuario.nome || "N/D",
        telefone: usuario.telefone || "N/D",
        usuario_id: usuario_id,
        data_cadastro: usuario.dataRegistro || new Date().toISOString()
      };
    } catch (error) {
      return null;
    }
  }
  
  // Rastrear visita
  window.addEventListener('load', function() {
    setTimeout(() => {
      const usuario = obterDadosUsuario();
      if (usuario) {
        const dadosVisita = new URLSearchParams();
        dadosVisita.append("action", "registrar_log");
        dadosVisita.append("usuario_id", usuario.usuario_id);
        dadosVisita.append("nome", usuario.nome);
        dadosVisita.append("telefone", usuario.telefone);
        dadosVisita.append("acao", "VISITA_PAGINA_PLANO_AULA");
        dadosVisita.append("pagina", "gratisunluck.html");
        dadosVisita.append("detalhes", JSON.stringify({
          tipo: "PLANO_AULA",
          status: "AGUARDANDO_CODIGO"
        }));
        
        fetch(TRACKING_URL, {
          method: "POST",
          body: dadosVisita,
          mode: "no-cors"
        }).catch(() => {});
      }
    }, 1000);
  });
  
  // Interceptar botão de confirmar
  const botaoOriginal = document.querySelector('.confirmar-btn');
  if (botaoOriginal) {
    const originalOnClick = botaoOriginal.onclick;
    
    botaoOriginal.onclick = function(e) {
      if (originalOnClick) originalOnClick.call(this, e);
      
      const codigo = document.getElementById('codigo-acesso')?.value.trim().toUpperCase() || "";
      const usuario = obterDadosUsuario();
      
      if (usuario && codigo.length === 8) {
        const dadosTentativa = new URLSearchParams();
        dadosTentativa.append("action", "registrar_log");
        dadosTentativa.append("usuario_id", usuario.usuario_id);
        dadosTentativa.append("nome", usuario.nome);
        dadosTentativa.append("telefone", usuario.telefone);
        dadosTentativa.append("acao", "TENTATIVA_CODIGO_PLANO_AULA");
        dadosTentativa.append("pagina", "gratisunluck.html");
        dadosTentativa.append("detalhes", JSON.stringify({
          codigo: codigo,
          tipo: "PLANO_AULA",
          valor: 5
        }));
        
        fetch(TRACKING_URL, {
          method: "POST",
          body: dadosTentativa,
          mode: "no-cors"
        }).catch(() => {});
      }
      
      return false;
    };
  }
})();
</script>
