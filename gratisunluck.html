<script>
(function() {
  // =============================================
  // CONTROLE INTELIGENTE (mostra conteúdo após reload)
  // =============================================
  
  var botao = document.getElementById('botaoRecarregar');
  var conteudo = document.getElementById('conteudoPrincipal');

  // Se a URL tem ?recarregado=1, veio de um reload nosso
  if (window.location.search.indexOf('recarregado=1') !== -1) {
    // Mostra conteúdo e remove o parâmetro da URL
    if (botao) botao.style.display = 'none';
    if (conteudo) conteudo.style.display = 'block';
    
    // Limpa a URL
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  // Se não tem o parâmetro, verifica se é primeira vez
  else if (!sessionStorage.getItem('entrada_anterior')) {
    // Primeira vez: marca e mostra conteúdo
    sessionStorage.setItem('entrada_anterior', 'true');
    if (botao) botao.style.display = 'none';
    if (conteudo) conteudo.style.display = 'block';
  } else {
    // Segunda vez ou mais: mostra botão
    if (botao) botao.style.display = 'block';
    if (conteudo) conteudo.style.display = 'none';
  }
})();

  <h2>Insira o Código Abaixo para Baixar o Plano</h2>

  <!-- Código promocional grande e visível -->
  <div id="codigo-promocional"></div>

  <div class="input-container" id="input-codigo">
    <input type="text" id="codigo-acesso" placeholder="digita aqui" maxlength="8">
    <span id="feedback-codigo" style="color:#dc3545; font-size:13px; display:block; text-align:center; margin-top:5px;"></span>
    <button class="confirmar-btn" onclick="validarCodigo()">Confirmar</button>
  </div>

  <div id="mensagem" class="mensagem"></div>

<script>
const URL_APP = "https://script.google.com/macros/s/AKfycby-l_VBnTuG98erRyPk0NA_QZvOJQnuix4P2zp2gnQCwvx5QFG9L9WgydoIHeMpofILnA/exec";
const inputCodigo = document.getElementById('codigo-acesso');
const feedback = document.getElementById('feedback-codigo');

inputCodigo.addEventListener('input', () => {
  let valor = inputCodigo.value.toUpperCase();
  const novoValor = valor.replace(/[^A-Z0-9]/g, '');
  if(valor !== novoValor){
    feedback.innerText = "❌ Apenas caracteres alfanuméricos são permitidos!";
  } else {
    feedback.innerText = "";
  }
  inputCodigo.value = novoValor.slice(0, 8);
});

// Exibir código promocional aleatório (visível)
const codigosPromo = ['2514DC16', '7655GT27', '8K7814D3', 'TD171705', 'J66BGK27'];
document.getElementById('codigo-promocional').textContent = codigosPromo[Math.floor(Math.random() * codigosPromo.length)];

function validarCodigo(){
  const codigo = inputCodigo.value.trim().toUpperCase();
  const msg = document.getElementById('mensagem');
  if(codigo.length !== 8){
    msg.style.color = "#dc3545";
    msg.innerText = "❌ O código deve ter 8 caracteres.";
    return;
  }
  msg.style.color = "#007BFF";
  msg.innerHTML = '🔍 Verificando o Código <span class="spinner"></span>';
  fetch(`${URL_APP}?codigo=${codigo}`, { method:'GET', mode:'cors' })
    .then(res => {
      if(!res.ok) throw new Error('Serviço indisponível');
      return res.json();
    })
    .then(data => {
      if(data && data.valido){
        const planoDataJSON = sessionStorage.getItem("planoData");
        if(!planoDataJSON){
            alert("❌ Nenhum plano encontrado. Gere o plano antes de tentar desbloquear.");
            return;
        }
        const planoData = JSON.parse(planoDataJSON);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a4'
        });
        // Fonte padrão
        doc.setFont("times", "normal");
        doc.setFontSize(12);
        // --- TÍTULO DO PLANO ---
        doc.text("PLANO DE AULA", 148, 12, { align: "center" });
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = planoData.html;
        // Dados da Esquerda
        let yLeft = 25;
        const addLineLeft = (label, value) => {
          if (value) {
            doc.text(`${label}:`, 10, yLeft);
            doc.text(value, 55, yLeft);
            yLeft += 6;
          }
        };
        const dadosEsquerda = tempDiv.querySelector('#dadosEsquerda');
        if (dadosEsquerda) {
          const esquerdaText = dadosEsquerda.innerText;
          const lines = esquerdaText.split('\n');
          lines.forEach(line => {
            if (line.includes(':')) {
              const [label, value] = line.split(':', 2);
              addLineLeft(label.trim(), value.trim());
            }
          });
        }
        // Dados da Direita
        let yRight = 25;
        const addLineRight = (label, value) => {
          if (value) {
            doc.text(`${label}:`, 160, yRight);
            doc.text(value, 200, yRight);
            yRight += 6;
          }
        };
        const dadosDireita = tempDiv.querySelector('#dadosDireita');
        if (dadosDireita) {
          const direitaText = dadosDireita.innerText;
          const lines = direitaText.split('\n');
          lines.forEach(line => {
            if (line.includes(':')) {
              const [label, value] = line.split(':', 2);
              addLineRight(label.trim(), value.trim());
            }
          });
        }
        // Objetivos
        const listaObjetivos = tempDiv.querySelector('#listaObjetivos');
        let lastY = Math.max(yLeft, yRight);
        if (listaObjetivos) {
          doc.text("Objetivos Específicos:", 10, lastY + 5);
          let yObj = lastY + 12;
          const objetivos = listaObjetivos.querySelectorAll('li');
          objetivos.forEach(obj => {
            const texto = obj.innerText.trim();
            if(texto){
              doc.text(texto, 15, yObj);
              yObj += 6;
            }
          });
          lastY = yObj;
        }
        // --- TABELA ÚNICA (com quebra automática) ---
        const tabela = tempDiv.querySelector('#tabelaPlano');
        if (tabela) {
          const rows = tabela.querySelectorAll('tbody tr');
          const tableData = Array.from(rows).map(row => {
            const cells = row.querySelectorAll('td');
            return Array.from(cells).map(cell => {
              // mantém quebras de linha
              let text = cell.innerHTML
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<[^>]*>/g, '');
              return text.trim();
            });
          });
          doc.autoTable({
            startY: lastY + 3,
            head: [['TEMPO', 'FUNÇÕES DIDÁCTICAS', 'CONTEÚDOS', 'ACTIVIDADES DO PROFESSOR', 'ACTIVIDADES DOS ALUNOS', 'MÉTODOS DE ENSINO', 'MEIOS DE ENSINO']],
            body: tableData,
            theme: 'grid',
            styles: {
              font: 'times',
              fontSize: 12,
              textColor: [0,0,0],
              lineColor: [0,0,0],
              lineWidth: 0.2,
              cellPadding: 3,
              valign: 'top',
              overflow: 'linebreak'
            },
            headStyles: {
              fillColor: [200,200,200],
              textColor: [0,0,0],
              font: 'times',
              fontSize: 12,
              fontStyle: 'bold'
            },
            columnStyles: {
              0: { cellWidth: 18 },
              1: { cellWidth: 35 },
              2: { cellWidth: 'auto' },
              3: { cellWidth: 'auto' },
              4: { cellWidth: 'auto' },
              5: { cellWidth: 30 },
              6: { cellWidth: 30 }
            },
            margin: { top: 15, bottom: 10, left: 7, right: 7 },
            tableWidth: 'auto',
            showHead: 'firstPage',
            didDrawCell: function (data) {
              if (data.section === 'body' && [0,1,5].includes(data.column.index)) {
                data.cell.styles.valign = 'top';
              }
            }
          });
        }

// === ANEXO COM CAIXA (robusto: só desenha se houver, trata imagens/texto e quebra de página) ===
// === ANEXO COM CAIXA SEMPRE VISÍVEL (MESMO VAZIO) ===
(function renderAnexo() {
  // configurações visuais (margem de 7 mm = 0,7 cm)
  const margemX = 7;
  const pageWidth = doc.internal.pageSize.getWidth();
  const largura = pageWidth - 2 * margemX; // largura total útil
  const pageHeight = doc.internal.pageSize.getHeight();
  const bottomMargin = 10;
  const lineHeight = 6; // altura da linha em mm
  const fontSize = 12;
  const paddingTop = 15; // espaço do topo da caixa até o início do texto
  const paddingBottom = 5;

  // Determinar a posição inicial Y (após a tabela)
  let posY = 20;
  if (doc.lastAutoTable && doc.lastAutoTable.finalY) {
    posY = doc.lastAutoTable.finalY + 8;
  } else if (doc.previousAutoTable && doc.previousAutoTable.finalY) {
    posY = doc.previousAutoTable.finalY + 8;
  } else if (typeof doc.getY === 'function') {
    try { posY = doc.getY() + 8; } catch (e) { posY = 20; }
  }

  // Verificar se existe anexo salvo
  let anexType = null;
  let anexImg = null;
  let anexTxt = null;

  if (planoData) {
    anexType = planoData.anexoTipo || (planoData.anexoSalvo && planoData.anexoSalvo.tipo) || null;
    anexImg = planoData.anexoImagem || (planoData.anexoSalvo && planoData.anexoSalvo.tipo === 'imagem' && planoData.anexoSalvo.data) || null;
    anexTxt = (planoData.anexoTexto && String(planoData.anexoTexto).trim() !== '') ? planoData.anexoTexto : (planoData.anexoSalvo && planoData.anexoSalvo.tipo === 'texto' ? planoData.anexoSalvo.data : null);
  }

  const temAnexo = (anexType && (anexImg || anexTxt));

  // Função auxiliar para desenhar uma caixa com título e conteúdo
  function desenharCaixa(y, linhas, titulo, alturaFixa = null) {
    let alturaCaixa;
    if (alturaFixa !== null) {
      alturaCaixa = alturaFixa;
    } else {
      alturaCaixa = paddingTop + linhas.length * lineHeight + paddingBottom;
    }
    // Ajustar para não ultrapassar a página
    alturaCaixa = Math.min(alturaCaixa, pageHeight - y - bottomMargin);

    // Desenha retângulo
    doc.setDrawColor(0,0,0);
    doc.rect(margemX, y, largura, alturaCaixa);
    doc.setFont("Times", "bold");
    doc.setFontSize(fontSize);
    doc.text(titulo, margemX + largura / 2, y + 8, { align: "center" });

    // Desenha conteúdo (se houver linhas)
    if (linhas && linhas.length > 0) {
      doc.setFont("Times", "normal");
      doc.setFontSize(fontSize);
      doc.text(linhas, margemX + 5, y + paddingTop);
    }
    // Se não houver linhas, não desenha nada (caixa vazia)
  }

  if (temAnexo) {
    // CASO 1: Existe anexo salvo (imagem ou texto)
    if (anexType === "imagem" && anexImg) {
      // Imagem: altura fixa (pode ajustar)
      let alturaBox = 100;
      if (posY + alturaBox + bottomMargin > pageHeight) {
        doc.addPage();
        posY = 15;
      }
      // Desenha caixa com título "ANEXO / QUADRO MURAL"
      desenharCaixa(posY, [], "ANEXO / QUADRO MURAL", alturaBox);
      let fmt = 'PNG';
      try {
        const m = anexImg.match(/^data:image\/([a-zA-Z0-9+]+);base64,/);
        if (m && m[1]) fmt = m[1].toUpperCase();
      } catch (e) { /* usa PNG por defeito */ }
      const imgX = margemX + 5;
      const imgY = posY + 12;
      const imgW = largura - 10;
      const imgH = alturaBox - 18;
      try {
        doc.addImage(anexImg, fmt, imgX, imgY, imgW, imgH);
      } catch (err) {
        console.error('Erro ao inserir imagem do anexo:', err);
        doc.setFont("Times", "normal");
        doc.setFontSize(fontSize);
        doc.text("Erro ao inserir imagem do anexo.", margemX + 5, posY + 18);
      }
    } else if (anexType === "texto" && anexTxt) {
      // Texto longo: dividir em páginas
      const todasLinhas = doc.splitTextToSize(anexTxt, largura - 10);
      let linhaAtual = 0;
      let primeiraPagina = true;

      while (linhaAtual < todasLinhas.length) {
        const alturaDisponivel = pageHeight - posY - bottomMargin;
        const linhasCabemMax = Math.floor((alturaDisponivel - paddingTop - paddingBottom) / lineHeight);
        if (linhasCabemMax <= 0) {
          doc.addPage();
          posY = 15;
          continue;
        }
        const linhasRestantes = todasLinhas.length - linhaAtual;
        const linhasParaDesenhar = Math.min(linhasRestantes, linhasCabemMax);
        const linhasPagina = todasLinhas.slice(linhaAtual, linhaAtual + linhasParaDesenhar);
        const tituloPagina = primeiraPagina ? "ANEXO / QUADRO MURAL" : "ANEXO / QUADRO MURAL (continuação)";
        desenharCaixa(posY, linhasPagina, tituloPagina);
        linhaAtual += linhasParaDesenhar;
        primeiraPagina = false;
        if (linhaAtual < todasLinhas.length) {
          doc.addPage();
          posY = 15;
        }
      }
    }
  } else {
    // CASO 2: NÃO HÁ ANEXO SALVO → desenha uma caixa vazia (com altura fixa)
    const alturaVazia = 80; // altura em mm (ajuste conforme preferir)
    if (posY + alturaVazia + bottomMargin > pageHeight) {
      doc.addPage();
      posY = 15;
    }
    desenharCaixa(posY, [], "ANEXO / QUADRO MURAL", alturaVazia);
  }

`;
      } else {

// === Funções de Download com Fallback ===
function baixarPDF(blob, nome) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Variáveis globais para o fallback
window.__ultimoPDFBlob = null;
window.__ultimoPDFNome = null;

function baixarPDFManual() {
  if (window.__ultimoPDFBlob && window.__ultimoPDFNome) {
    baixarPDF(window.__ultimoPDFBlob, window.__ultimoPDFNome);
  } else {
    alert("❌ Nenhum PDF disponível para download.");
  }
}

<!-- =========== SISTEMA DE RASTREAMENTO PLANO DE AULA =========== -->
<script>
(function() {
  'use strict';
  
  const TRACKING_URL = "https://script.google.com/macros/s/AKfycbzKLDACXusk8jO4VwA5CHjOyJqidQ-KS6SrS8aq7Ocdqki_JPfjXIy22EnL8-4bFAlzDg/exec";
  
  // 1. OBTER DADOS DO USUÁRIO (MESMA FUNÇÃO DO INDEX.HTML)
 function obterDadosUsuario() {
  try {
    const usuarioData = localStorage.getItem("usuario");
    if (!usuarioData) return null;
    
    const usuario = JSON.parse(usuarioData);
    
    // Formatar nome (remover espaços extras, substituir espaços por _, limitar a 30 caracteres)
    const nomeFormatado = usuario.nome 
      ? usuario.nome.trim().replace(/\s+/g, '_').substring(0, 30)
      : "NOME";
    
    // Pegar telefone completo sem caracteres não numéricos
    const telefoneCompleto = usuario.telefone 
      ? usuario.telefone.replace(/\D/g, '')
      : "SEMTELEFONE";
    
    // Criar ID: Nome_TelefoneCompleto
    const usuario_id = `${nomeFormatado}_${telefoneCompleto}`;
    
    return {
      nome: usuario.nome || "N/D",
      telefone: usuario.telefone || "N/D",
      usuario_id: usuario_id,
      data_cadastro: usuario.dataRegistro || new Date().toISOString()
    };
  } catch (error) {
    return null;
  }
}
  
  // 2. RASTREAR VISITA À PÁGINA
  window.addEventListener('load', function() {
    setTimeout(() => {
      const usuario = obterDadosUsuario();
      
      if (usuario) {
        const dadosVisita = new URLSearchParams();
        dadosVisita.append("action", "registrar_log");
        dadosVisita.append("usuario_id", usuario.usuario_id);
        dadosVisita.append("nome", usuario.nome);
        dadosVisita.append("telefone", usuario.telefone);
        dadosVisita.append("acao", "VISITA_PAGINA_PLANO_AULA");
        dadosVisita.append("pagina", "gratisunluck.html");
        dadosVisita.append("detalhes", JSON.stringify({
          tipo: "PLANO_AULA",
          status: "AGUARDANDO_CODIGO"
        }));
        
        fetch(TRACKING_URL, {
          method: "POST",
          body: dadosVisita,
          mode: "no-cors"
        }).catch(() => {});
      }
    }, 1000);
  });
  
  // 3. INTERCEPTAR O BOTÃO DE CONFIRMAR
  const botaoOriginal = document.querySelector('.confirmar-btn');
  if (botaoOriginal) {
    const originalOnClick = botaoOriginal.onclick;
    
    botaoOriginal.onclick = function(e) {
      // Executar a validação original
      if (originalOnClick) originalOnClick.call(this, e);
      
      // RASTREAR TENTATIVA DE CÓDIGO
      const codigo = document.getElementById('codigo-acesso')?.value.trim().toUpperCase() || "";
      const usuario = obterDadosUsuario();
      
      if (usuario && codigo.length === 8) {
        const dadosTentativa = new URLSearchParams();
        dadosTentativa.append("action", "registrar_log");
        dadosTentativa.append("usuario_id", usuario.usuario_id);
        dadosTentativa.append("nome", usuario.nome);
        dadosTentativa.append("telefone", usuario.telefone);
        dadosTentativa.append("acao", "TENTATIVA_CODIGO_PLANO_AULA");
        dadosTentativa.append("pagina", "gratisunluck.html");
        dadosTentativa.append("detalhes", JSON.stringify({
          codigo: codigo,
          tipo: "PLANO_AULA",
          valor: 5 // 5 Meticais
        }));
        
        fetch(TRACKING_URL, {
          method: "POST",
          body: dadosTentativa,
          mode: "no-cors"
        }).catch(() => {});
      }
      
      return false;
    };
  }
  
  // 4. RASTREAR DOWNLOAD BEM-SUCEDIDO
  function monitorarSucessoDownload() {
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.target.id === 'mensagem' && 
            (mutation.target.innerHTML.includes('✅ Código válido') || 
             mutation.target.innerHTML.includes('✅ Valid code!'))) {
          
          const usuario = obterDadosUsuario();
          const codigo = document.getElementById('codigo-acesso')?.value.trim().toUpperCase() || "";
          
          if (usuario) {
            // 📊 REGISTRAR DOWNLOAD COMPLETO
            const dadosDownload = new URLSearchParams();
            dadosDownload.append("action", "registrar_download");
            dadosDownload.append("usuario_id", usuario.usuario_id);
            dadosDownload.append("nome", usuario.nome);
            dadosDownload.append("telefone", usuario.telefone);
            dadosDownload.append("tipo_documento", "PLANO_AULA");
            dadosDownload.append("valor_pago", "5");
            dadosDownload.append("metodo_pagamento", "CODIGO_PROMOCIONAL");
            dadosDownload.append("status_pagamento", "PAGO");
            dadosDownload.append("codigo_transacao", codigo);
            
            // Obter dados do plano
            try {
              const planoDataJSON = sessionStorage.getItem("planoData");
              if (planoDataJSON) {
                const planoData = JSON.parse(planoDataJSON);
                dadosDownload.append("disciplina", planoData.disciplina || "N/D");
                dadosDownload.append("classe", planoData.classe || "N/D");
                dadosDownload.append("trimestre", planoData.trimestre || "N/D");
                dadosDownload.append("numero_aulas", "1");
              }
            } catch (e) {}
            
            fetch(TRACKING_URL, {
              method: "POST",
              body: dadosDownload,
              mode: "no-cors"
            }).catch(() => {});
            
            // 🔄 Atualizar contador no localStorage
            try {
              const usuarioAtual = JSON.parse(localStorage.getItem("usuario") || "{}");
              if (!usuarioAtual.downloads) usuarioAtual.downloads = {};
              if (!usuarioAtual.downloads.planoAula) usuarioAtual.downloads.planoAula = 0;
              usuarioAtual.downloads.planoAula++;
              localStorage.setItem("usuario", JSON.stringify(usuarioAtual));
            } catch (e) {}
          }
          
          observer.disconnect();
        }
      });
    });
    
    const mensagemDiv = document.getElementById('mensagem');
    if (mensagemDiv) {
      observer.observe(mensagemDiv, { childList: true, subtree: true });
    }
  }
  
  window.addEventListener('load', monitorarSucessoDownload);
  
  console.log("✅ Sistema de rastreamento plano de aula carregado!");
})();
</script>
