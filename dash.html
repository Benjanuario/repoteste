<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Administração</title>
<style>
body { font-family: Arial; background:#f5f5f5; margin:0; padding:0;}
.container { max-width:600px; margin:50px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.2);}
h2, h3 { text-align:center; }
input, select { width:100%; padding:10px; margin:5px 0; border-radius:5px; border:1px solid #ccc; }
button { width:100%; padding:10px; margin:10px 0; border:none; border-radius:5px; background:#007BFF; color:#fff; cursor:pointer; }
button:hover { background:#0056b3; }
.success { color:green; }
.error { color:red; }
#dashboard { display:none; }
#usersList li { margin-bottom:5px; }
.logoutBtn { background:#dc3545; }
</style>
</head>
<body>

<div class="container" id="loginContainer">
  <h2>Login</h2>
  <input type="text" id="user" placeholder="Email ou Número">
  <input type="password" id="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <p class="error" id="loginMsg"></p>
</div>

<div class="container" id="dashboard">
  <h2>Painel de Controle</h2>
  <p id="welcome"></p>
  <button class="logoutBtn" onclick="logout()">Sair</button>

  <div id="adminPanel">
    <h3>Cadastrar Novo Usuário</h3>
    <input id="nome" placeholder="Nome">
    <input id="numero" placeholder="Número">
    <input id="email" placeholder="Email">
    <input id="estadoCivil" placeholder="Estado Civil">
    <input id="naturalidade" placeholder="Naturalidade">
    <input id="senha" placeholder="Senha Temporária">
    <select id="papel">
      <option value="admin">Admin</option>
    </select>
    <button onclick="cadastrar()">Cadastrar</button>
    <p id="msg"></p>
  </div>

  <div id="listUsers" style="display:none;">
    <h3>Usuários Cadastrados (Apenas Superadmin)</h3>
    <ul id="usersList"></ul>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQHqvih8w0nYML7xRK32qp_jgYjzxLV_NJkyHWeawuywCMdk542MRB5f-8Rva6hWEm/exec'; // substitua pela sua URL do GAS

async function login(){
  const user = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value.trim();
  const msg = document.getElementById('loginMsg');
  msg.textContent = "";

  if(!user || !password){ msg.textContent="Preencha todos os campos!"; return; }

  try{
    const response = await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:"login", user, password})
    });
    const data = await response.json();

    if(data.success){
      sessionStorage.setItem('user', user);
      sessionStorage.setItem('papel', data.papel);
      sessionStorage.setItem('primeiroLogin', data.primeiroLogin);
      mostrarDashboard(data.papel, user, data.primeiroLogin);
    } else {
      msg.textContent = "Usuário ou senha inválidos!";
    }
  }catch(err){
    console.error(err);
    msg.textContent = "Erro de conexão.";
  }
}

function logout(){
  sessionStorage.clear();
  document.getElementById('dashboard').style.display="none";
  document.getElementById('loginContainer').style.display="block";
}

// Função para mostrar dashboard de acordo com papel
function mostrarDashboard(papel, user, primeiroLogin){
  document.getElementById('loginContainer').style.display="none";
  document.getElementById('dashboard').style.display="block";
  document.getElementById('welcome').textContent = `Bem-vindo(a): ${user} (${papel})`;

  if(papel==="superadmin"){
    document.getElementById('listUsers').style.display="block";
    listarUsuarios(user);
  }

  if(primeiroLogin==="true" || primeiroLogin===true){
    alert("É seu primeiro login, altere sua senha!");
    const novaSenha = prompt("Digite a nova senha:");
    if(novaSenha) alterarSenha(user, novaSenha);
  }
}

// =================================
// Função de cadastrar novos usuários
// =================================
async function cadastrar(){
  const nome = document.getElementById('nome').value.trim();
  const numero = document.getElementById('numero').value.trim();
  const email = document.getElementById('email').value.trim();
  const estadoCivil = document.getElementById('estadoCivil').value.trim();
  const naturalidade = document.getElementById('naturalidade').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const papel = document.getElementById('papel').value;
  const msg = document.getElementById('msg');

  if(!nome||!numero||!email||!estadoCivil||!naturalidade||!senha){ msg.textContent="Preencha todos os campos!"; return; }

  const criador = sessionStorage.getItem('user');

  try{
    const response = await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:"cadastro", criador, nome, numero, email, estadoCivil, naturalidade, senha, papel})
    });
    const data = await response.json();
    msg.textContent = data.message;
  }catch(err){
    console.error(err);
    msg.textContent = "Erro de conexão.";
  }
}

// =================================
// Listar usuários (apenas superadmin)
// =================================
async function listarUsuarios(user){
  try{
    const response = await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:"listarUsuarios", user})
    });
    const data = await response.json();
    if(data.success){
      const ul = document.getElementById('usersList');
      ul.innerHTML = "";
      data.usuarios.forEach(u=>{
        ul.innerHTML += `<li>${u.nome} - ${u.email} - ${u.papel}</li>`;
      });
    }
  }catch(err){ console.error(err); }
}

// =================================
// Alterar senha
// =================================
async function alterarSenha(user, novaSenha){
  try{
    const response = await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:"alterarSenha", user, novaSenha})
    });
    const data = await response.json();
    if(data.success) alert("Senha alterada com sucesso!");
    else alert("Erro ao alterar senha: "+data.message);
  }catch(err){ console.error(err); }
}

// =================================
// Auto-login se já estiver logado
// =================================
window.onload = ()=>{
  const user = sessionStorage.getItem('user');
  const papel = sessionStorage.getItem('papel');
  const primeiroLogin = sessionStorage.getItem('primeiroLogin');
  if(user && papel){
    mostrarDashboard(papel, user, primeiroLogin);
  }
}
</script>

</body>
</html>
