<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Admin CFM - Multi-linhas</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================
       VARIÁVEIS E RESET
       ============================================ */
    :root {
      --primary: #0d47a1;
      --primary-dark: #0a3a8a;
      --primary-light: #e3f2fd;
      --secondary: #ff9800;
      --secondary-dark: #f57c00;
      --success: #2e7d32;
      --danger: #c62828;
      --warning: #f57c00;
      --info: #0277bd;
      --light: #f5f5f5;
      --dark: #222;
      --gray: #757575;
      --gray-light: #eee;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============================================
       ANIMAÇÕES
       ============================================ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(13, 71, 161, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(13, 71, 161, 0); }
      100% { box-shadow: 0 0 0 0 rgba(13, 71, 161, 0); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* ============================================
       LAYOUT PRINCIPAL
       ============================================ */
    .container {
      display: flex;
      min-height: 100vh;
    }

    /* ============================================
       SIDEBAR
       ============================================ */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo-icon {
      font-size: 2.5rem;
      animation: float 3s ease-in-out infinite;
    }

    .logo-text h1 {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
    }

    .logo-text p {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .user-info {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: var(--radius-sm);
      margin-bottom: 30px;
      animation: fadeIn 0.5s ease;
    }

    .user-info h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .user-role {
      display: inline-block;
      background: var(--secondary);
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-top: 5px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: rgba(255,255,255,0.9);
      font-weight: 500;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(5px);
    }

    .menu-item.active {
      background: rgba(255,255,255,0.15);
      border-left: 4px solid var(--secondary);
    }

    .menu-item i {
      width: 20px;
      text-align: center;
      font-size: 1.1rem;
    }

    .menu-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    /* ============================================
       CONTEÚDO PRINCIPAL
       ============================================ */
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 30px;
      animation: fadeIn 0.5s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--gray-light);
    }

    .page-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: var(--secondary);
    }

    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--success);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background: #b71c1c;
      transform: translateY(-2px);
    }

    /* ============================================
       BOTÃO PRINCIPAL DO DASHBOARD
       ============================================ */
    .quick-action {
      text-align: center;
      margin-bottom: 40px;
    }

    .send-update-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 20px 40px;
      border-radius: var(--radius);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      transition: var(--transition);
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.6s ease;
    }

    .send-update-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(13, 71, 161, 0.3);
    }

    .send-update-btn i {
      font-size: 1.5rem;
    }

    /* ============================================
       SEÇÕES DO PAINEL
       ============================================ */
    .section {
      background: white;
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.7s ease;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--gray-light);
    }

    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      font-family: 'Roboto', sans-serif;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--secondary);
      color: white;
    }

    .btn-secondary:hover {
      background: var(--secondary-dark);
      transform: translateY(-2px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #1b5e20;
      transform: translateY(-2px);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #b71c1c;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .btn-whatsapp {
      background: #25d366;
      color: white;
    }

    .btn-whatsapp:hover {
      background: #1da851;
      transform: translateY(-2px);
    }

    /* ============================================
       FORMULÁRIOS
       ============================================ */
    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--gray-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
    }

    .select-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--gray-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      background: white;
      cursor: pointer;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 15px;
      background: var(--gray-light);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .checkbox-label:hover {
      background: #ddd;
    }

    .checkbox-label input {
      margin: 0;
    }

    /* ============================================
       TABELAS
       ============================================ */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-light);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    thead {
      background: var(--primary-light);
    }

    th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 2px solid var(--gray-light);
    }

    td {
      padding: 15px;
      border-bottom: 1px solid var(--gray-light);
      vertical-align: middle;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .badge-success { background: #e8f5e9; color: var(--success); }
    .badge-warning { background: #fff3e0; color: var(--warning); }
    .badge-danger { background: #ffebee; color: var(--danger); }
    .badge-info { background: #e1f5fe; color: var(--info); }
    .badge-primary { background: var(--primary-light); color: var(--primary); }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      background: var(--gray-light);
      color: var(--gray);
    }

    .action-btn:hover {
      transform: scale(1.1);
    }

    .action-btn.edit:hover { background: var(--warning); color: white; }
    .action-btn.delete:hover { background: var(--danger); color: white; }
    .action-btn.view:hover { background: var(--info); color: white; }
    .action-btn.suspend:hover { background: var(--secondary); color: white; }

    /* ============================================
       CARDS DE LINHA
       ============================================ */
    .lines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .line-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 3px solid transparent;
    }

    .line-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .line-card.active {
      border-color: var(--success);
    }

    .line-header {
      padding: 20px;
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .line-header.bm { background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); }
    .line-header.bmar { background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%); }
    .line-header.bc { background: linear-gradient(135deg, #6a1b9a 0%, #8e24aa 100%); }

    .line-emoji {
      font-size: 2.5rem;
    }

    .line-info h3 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .line-info p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .line-body {
      padding: 20px;
    }

    .line-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .line-stat {
      text-align: center;
    }

    .line-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .line-stat-label {
      font-size: 0.8rem;
      color: var(--gray);
    }

    .line-actions {
      display: flex;
      gap: 10px;
    }

    /* ============================================
       MODAIS
       ============================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.3s ease;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .modal-lg {
      max-width: 800px;
    }

    .modal-header {
      padding: 25px;
      border-bottom: 1px solid var(--gray-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      color: var(--primary);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gray);
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--danger);
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 25px;
    }

    .modal-footer {
      padding: 20px 25px;
      border-top: 1px solid var(--gray-light);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ============================================
       TOAST NOTIFICATIONS
       ============================================ */
    .toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 3000;
    }

    .toast {
      background: white;
      border-radius: var(--radius);
      padding: 15px 20px;
      margin-top: 10px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 15px;
      animation: slideIn 0.3s ease;
      min-width: 300px;
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warning { border-left: 4px solid var(--warning); }
    .toast.info { border-left: 4px solid var(--info); }

    .toast-icon {
      font-size: 1.3rem;
    }

    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warning); }
    .toast.info .toast-icon { color: var(--info); }

    .toast-content {
      flex: 1;
    }

    .toast-title {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .toast-message {
      font-size: 0.9rem;
      color: var(--gray);
    }

    .toast-close {
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .toast-close:hover {
      color: var(--dark);
    }

    /* ============================================
       LOADERS
       ============================================ */
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid var(--gray-light);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4000;
    }

    /* ============================================
       MENSAGEM DE SUCESSO APÓS ENVIO
       ============================================ */
    .success-message {
      background: #e8f5e9;
      border: 2px solid var(--success);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin-top: 20px;
      animation: fadeIn 0.3s ease;
    }

    .success-message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      color: var(--success);
    }

    .success-message-header i {
      font-size: 1.5rem;
    }

    .success-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    /* ============================================
       RESPONSIVIDADE
       ============================================ */
    @media (max-width: 1200px) {
      .sidebar {
        width: 250px;
      }
      .main-content {
        margin-left: 250px;
      }
    }

    @media (max-width: 992px) {
      .sidebar {
        position: fixed;
        left: -280px;
        transition: var(--transition);
        z-index: 1001;
      }
      .sidebar.active {
        left: 0;
      }
      .main-content {
        margin-left: 0;
      }
      .menu-toggle {
        display: block !important;
      }
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      .lines-grid {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .send-update-btn {
        width: 100%;
        justify-content: center;
        padding: 15px;
      }
    }

    .menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1002;
      background: var(--primary);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .menu-toggle:hover {
      transform: scale(1.1);
    }

    /* ============================================
       LOGIN SCREEN
       ============================================ */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    .login-logo h1 {
      font-family: 'Poppins', sans-serif;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .login-logo p {
      color: var(--gray);
      font-size: 0.9rem;
    }

    .login-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-light);
      color: var(--gray);
      font-size: 0.85rem;
    }

    /* ============================================
       ADMIN STATUS
       ============================================ */
    .admin-status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 500;
      margin-left: 8px;
    }

    .status-active { background: #e8f5e9; color: var(--success); }
    .status-suspended { background: #ffebee; color: var(--danger); }
  </style>
</head>
<body>
  <!-- TELA DE LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-shield-alt"></i>
        <h1>Admin CFM</h1>

  <script>
    // ============================================
    // CONFIGURAÇÕES
    // ============================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxxkC9xBtgVV5wc84bWMEDVmRevyF2ZVo7k4SrUs_MDGxBctAMTuerLkLG9BZAzvXt2/exec";
    
    // Configuração das Linhas
    const LINHAS = {
      'bm': {
        id: 'bm',
        nome: 'Beira - Moatize',
        emoji: '🚂',
        color: '#0d47a1',
        updates_sheet: 'updates_bm',
        chat_sheet: 'chat_bm'
      },
      'bmar': {
        id: 'bmar',
        nome: 'Beira - Marromeu',
        emoji: '🚆',
        color: '#2e7d32',
        updates_sheet: 'updates_bmar',
        chat_sheet: 'chat_bmar'
      },
      'bc': {
        id: 'bc',
        nome: 'Beira - Chimoio',
        emoji: '🚄',
        color: '#6a1b9a',
        updates_sheet: 'updates_bc',
        chat_sheet: 'chat_bc'
      }
    };
    
    // Variáveis globais
    let currentUser = null;
    let currentToken = null;
    let currentSection = 'dashboard';
    let pollingInterval = null;
    let userPermittedLines = [];
    
    // ============================================
    // FUNÇÕES DE UTILIDADE
    // ============================================
    function showLoader() {
      document.getElementById('loaderOverlay').style.display = 'flex';
    }
    
    function hideLoader() {
      document.getElementById('loaderOverlay').style.display = 'none';
    }
    
    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icons = {
        success: 'fas fa-check-circle',
        error: 'fas fa-exclamation-circle',
        warning: 'fas fa-exclamation-triangle',
        info: 'fas fa-info-circle'
      };
      
      toast.innerHTML = `
        <div class="toast-icon">
          <i class="${icons[type]}"></i>
        </div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">
          <i class="fas fa-times"></i>
        </button>
      `;
      
      container.appendChild(toast);
      
      // Auto-remove após 5 segundos
      setTimeout(() => {
        if (toast.parentNode) {
          toast.remove();
        }
      }, 5000);
    }
    
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('pt-MZ', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    
    function formatTimeAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / (1000 * 60));
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      
      if (diffMins < 1) return 'Agora mesmo';
      if (diffMins < 60) return `Há ${diffMins} min`;
      if (diffHours < 24) return `Há ${diffHours}h`;
      if (diffDays === 1) return 'Ontem';
      if (diffDays < 7) return `Há ${diffDays} dias`;
      return formatDate(dateString);
    }
    
    function sanitizeInput(text, maxLength = 100) {
      if (!text) return '';
      // Remover tags HTML e limitar comprimento
      let sanitized = text.replace(/<[^>]*>/g, '');
      sanitized = sanitized.replace(/[<>'"`]/g, '');
      return sanitized.substring(0, maxLength);
    }
    
    // ============================================
    // FUNÇÕES DE API
    // ============================================
    async function apiCall(action, data = {}, method = 'POST') {
      try {
        console.log(`📡 API Call: ${action}`, data);
        
        const params = new URLSearchParams();
        params.append('action', action);
        
        if (currentToken) {
          params.append('token', currentToken);
        }
        
        Object.keys(data).forEach(key => {
          params.append(key, data[key]);
        });
        
        const response = await fetch(GAS_URL, {
          method: method,
          body: params
        });
        
        const result = await response.json();
        console.log(`📡 API Response ${action}:`, result);
        
        return result;
      } catch (error) {
        console.error('API Error:', error);
        showToast('Erro de conexão', 'Não foi possível conectar ao servidor', 'error');
        return { success: false, error: 'Erro de conexão' };
      }
    }
    
    async function login(identifier, password) {
      showLoader();
      try {
        console.log('🔐 Tentando login com:', identifier);
        
        const result = await apiCall('login', { identifier, password });
        
        if (result.success) {
          currentUser = result.user;
          currentToken = result.token;
          
          // Processar linhas permitidas
          userPermittedLines = result.user.linhas_permitidas ? 
            result.user.linhas_permitidas.split(',') : 
            Object.keys(LINHAS); // Super admin tem acesso a todas
          
          // Salvar sessão
          localStorage.setItem('cfm_admin_token', result.token);
          localStorage.setItem('cfm_admin_user', JSON.stringify(result.user));
          localStorage.setItem('cfm_admin_lines', JSON.stringify(userPermittedLines));
          
          showToast('Login bem-sucedido', `Bem-vindo, ${result.user.fullName}!`, 'success');
          
          // Mostrar painel
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'flex';
          
          // Inicializar
          loadUserInfo();
          loadDashboard();
          startPolling();
          
        } else {
          showToast('Erro no login', result.error || 'Credenciais inválidas', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        showToast('Erro', 'Não foi possível conectar ao servidor', 'error');
      } finally {
        hideLoader();
      }
    }
    
    async function validateSession() {
      const token = localStorage.getItem('cfm_admin_token');
      const user = JSON.parse(localStorage.getItem('cfm_admin_user'));
      const lines = JSON.parse(localStorage.getItem('cfm_admin_lines'));
      
      if (!token || !user) {
        return false;
      }
      
      showLoader();
      try {
        const result = await apiCall('validate_session', { token });
        
        if (result.success) {
          currentUser = user;
          currentToken = token;
          userPermittedLines = lines || [];
          
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'flex';
          
          loadUserInfo();
          loadDashboard();
          startPolling();
          
          return true;
        }
      } catch (error) {
        console.error('Session validation failed:', error);
      } finally {
        hideLoader();
      }
      
      return false;
    }
    
    function logout() {
      if (confirm('Tem certeza que deseja sair?')) {
        localStorage.removeItem('cfm_admin_token');
        localStorage.removeItem('cfm_admin_user');
        localStorage.removeItem('cfm_admin_lines');
        
        if (pollingInterval) {
          clearInterval(pollingInterval);
        }
        
        currentUser = null;
        currentToken = null;
        userPermittedLines = [];
        
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
        
        showToast('Logout', 'Sessão encerrada com sucesso', 'info');
      }
    }
    
    // ============================================
    // FUNÇÕES DE INTERFACE
    // ============================================
    function loadUserInfo() {
      if (!currentUser) return;
      
      const userInfo = document.getElementById('userInfo');
      const userEmail = document.getElementById('userEmail');
      const userRole = document.getElementById('userRole');
      const adminsMenuItem = document.getElementById('adminsMenuItem');
      
      userInfo.innerHTML = `
        <h3>${currentUser.fullName}</h3>
        <p>${currentUser.email}</p>
        <span class="user-role" id="userRole">${currentUser.role === 'superadmin' ? 'Super Admin' : 'Admin'}</span>
      `;
      
      userEmail.textContent = currentUser.email;
      userRole.textContent = currentUser.role === 'superadmin' ? 'Super Admin' : 'Admin';
      
      // Mostrar item de administradores apenas para super admins
      if (currentUser.role === 'superadmin') {
        adminsMenuItem.style.display = 'flex';
      }
    }
    
    function setupMenu() {
      // Menu toggle mobile
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('active');
      });
      
      // Menu items
      document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', () => {
          // Remover active de todos
          document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
          // Adicionar ao clicado
          item.classList.add('active');
          
          const section = item.dataset.section;
          currentSection = section;
          
          // Atualizar título
          const titles = {
            dashboard: { title: 'Dashboard', icon: 'fas fa-tachometer-alt' },
            updates: { title: 'Actualizações', icon: 'fas fa-bullhorn' },
            chat: { title: 'Chat', icon: 'fas fa-comments' },
            admins: { title: 'Administradores', icon: 'fas fa-user-shield' },
            lines: { title: 'Linhas', icon: 'fas fa-train' },
            settings: { title: 'Configurações', icon: 'fas fa-cog' }
          };
          
          const title = titles[section];
          document.getElementById('pageTitle').innerHTML = `
            <i class="${title.icon}"></i>
            ${title.title}
          `;
          document.getElementById('pageSubtitle').textContent = getSectionSubtitle(section);
          
          // Carregar seção
          loadSection(section);
          
          // Fechar sidebar no mobile
          if (window.innerWidth < 992) {
            document.getElementById('sidebar').classList.remove('active');
          }
        });
      });
      
      // Logout button
      document.getElementById('logoutBtn').addEventListener('click', logout);
      
      // Refresh button
      document.getElementById('refreshBtn').addEventListener('click', () => {
        refreshCurrentSection();
        showToast('Atualizado', 'Dados atualizados com sucesso', 'success');
      });
      
      // Quick send update button
      document.getElementById('quickSendUpdate').addEventListener('click', () => {
        openSendUpdateModal();
      });
    }
    
    function getSectionSubtitle(section) {
      const subtitles = {
        dashboard: 'Painel administrativo',
        updates: 'Gerir actualizações das linhas',
        chat: 'Monitorar mensagens dos passageiros',
        admins: 'Gerir administradores do sistema',
        lines: 'Visualizar linhas de comboio',
        settings: 'Configurações do sistema'
      };
      return subtitles[section] || '';
    }
    
    // ============================================
    // CARREGAMENTO DE SEÇÕES
    // ============================================
    async function loadSection(section) {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '<div class="loader"></div>';
      
      switch(section) {
        case 'dashboard':
          await loadDashboard();
          break;
        case 'updates':
          await loadUpdatesSection();
          break;
        case 'chat':
          await loadChatSection();
          break;
        case 'admins':
          await loadAdminsSection();
          break;
        case 'lines':
          await loadLinesSection();
          break;
        case 'settings':
          await loadSettingsSection();
          break;
      }
    }
    
    function refreshCurrentSection() {
      loadSection(currentSection);
    }
    
    // ============================================
    // DASHBOARD SIMPLIFICADO
    // ============================================
    async function loadDashboard() {
      const container = document.getElementById('sectionsContainer');
      
      try {
        // Verificar se tem linhas permitidas
        if (userPermittedLines.length === 0) {
          container.innerHTML = `
            <div class="section">
              <div style="text-align: center; padding: 40px;">
                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--warning); margin-bottom: 20px;"></i>
                <h3>Sem permissões</h3>
                <p>Você não tem permissão para nenhuma linha. Contacte o super administrador.</p>
              </div>
            </div>
          `;
          return;
        }
        
        // Construir dashboard simplificado
        let html = `
          <div class="section">
            <div class="section-header">
              <h2 class="section-title">
                <i class="fas fa-chart-line"></i>
                Linhas Atribuídas
              </h2>
            </div>
            
            <div class="lines-grid">
        `;
        
        // Cards apenas das linhas permitidas
        for (const linhaId of userPermittedLines) {
          const linha = LINHAS[linhaId];
          if (!linha) continue;
          
          // Buscar estatísticas da linha
          const stats = await getLineStats(linhaId);
          
          html += `
            <div class="line-card ${stats.today > 0 ? 'active' : ''}">
              <div class="line-header ${linhaId}">
                <div class="line-emoji">${linha.emoji}</div>
                <div class="line-info">
                  <h3>${linha.nome}</h3>
                  <p>ID: ${linhaId}</p>
                </div>
              </div>
              
              <div class="line-body">
                <div class="line-stats">
                  <div class="line-stat">
                    <div class="line-stat-value">${stats.today || 0}</div>
                    <div class="line-stat-label">Hoje</div>
                  </div>
                  <div class="line-stat">
                    <div class="line-stat-value">${stats.total || 0}</div>
                    <div class="line-stat-label">Total</div>
                  </div>
                </div>
                
                <div class="line-actions">
                  <button class="btn btn-primary" style="flex: 1;" onclick="openSendUpdateModal('${linhaId}')">
                    <i class="fas fa-bullhorn"></i>
                    Nova Actualização
                  </button>
                  <button class="btn btn-outline" onclick="openChatModal('${linhaId}')">
                    <i class="fas fa-comments"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }
        
        html += `
            </div>
          </div>
          
          <div class="section">
            <div class="section-header">
              <h2 class="section-title">
                <i class="fas fa-history"></i>
                Últimas Actualizações
              </h2>
              <button class="btn btn-primary" onclick="loadSection('updates')">
                <i class="fas fa-list"></i>
                Ver Todas
              </button>
            </div>
            
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Linha</th>
                    <th>Mensagem</th>
                    <th>Administrador</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="recentUpdatesTable">
                  <tr><td colspan="4" style="text-align: center;">Carregando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
        
        container.innerHTML = html;
        
        // Carregar atualizações recentes
        await loadRecentUpdates();
        
      } catch (error) {
        console.error('Error loading dashboard:', error);
        container.innerHTML = `
          <div class="section">
            <div style="text-align: center; padding: 40px;">
              <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--warning); margin-bottom: 20px;"></i>
              <h3>Erro ao carregar dashboard</h3>
              <p>${error.message}</p>
              <button class="btn btn-primary" onclick="loadDashboard()" style="margin-top: 20px;">
                <i class="fas fa-redo"></i>
                Tentar Novamente
              </button>
            </div>
          </div>
        `;
      }
    }
    
    async function getLineStats(linhaId) {
      try {
        const result = await apiCall('stats', { linha: linhaId }, 'GET');
        return result.success ? result.stats : { total: 0, today: 0, chat_total: 0, chat_today: 0 };
      } catch (error) {
        return { total: 0, today: 0, chat_total: 0, chat_today: 0 };
      }
    }
    
    async function loadRecentUpdates() {
      const table = document.getElementById('recentUpdatesTable');
      if (!table) return;
      
      try {
        let allUpdates = [];
        
        // Buscar atualizações apenas das linhas permitidas
        for (const linhaId of userPermittedLines) {
          const result = await apiCall('get_history', { linha: linhaId });
          if (result.success && result.updates) {
            const linhaUpdates = result.updates.slice(0, 3).map(update => ({
              ...update,
              linha: linhaId,
              linha_nome: LINHAS[linhaId].nome,
              linha_emoji: LINHAS[linhaId].emoji
            }));
            allUpdates = [...allUpdates, ...linhaUpdates];
          }
        }
        
        // Ordenar por data
        allUpdates.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        // Pegar as 10 mais recentes
        const recentUpdates = allUpdates.slice(0, 10);
        
        if (recentUpdates.length === 0) {
          table.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; padding: 30px;">
                <i class="fas fa-info-circle" style="color: var(--info); font-size: 2rem; margin-bottom: 10px;"></i>
                <p>Nenhuma actualização encontrada</p>
              </td>
            </tr>
          `;
          return;
        }
        
        table.innerHTML = recentUpdates.map(update => `
          <tr>
            <td>
              <span class="badge badge-primary">
                ${update.linha_emoji} ${update.linha_nome}
              </span>
            </td>
            <td>
              <div style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                ${update.textoOriginal.substring(0, 60)}${update.textoOriginal.length > 60 ? '...' : ''}
              </div>
            </td>
            <td>${update.adminName}</td>
            <td>${formatTimeAgo(update.timestamp)}</td>
          </tr>
        `).join('');
        
      } catch (error) {
        table.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--danger);">
              <i class="fas fa-exclamation-circle"></i>
              Erro ao carregar actualizações
            </td>
          </tr>
        `;
      }
    }
    
    // ============================================
    // MODAL: ENVIAR ACTUALIZAÇÃO COM WHATSAPP
    // ============================================
    function openSendUpdateModal(linhaId = null) {
      // Se não especificar linha, usar a primeira permitida
      if (!linhaId && userPermittedLines.length > 0) {
        linhaId = userPermittedLines[0];
      }
      
      const modalHtml = `
        <div class="modal-overlay" id="sendUpdateModal">
          <div class="modal">
            <div class="modal-header">
              <h2 class="modal-title">
                <i class="fas fa-bullhorn"></i>
                Nova Actualização
              </h2>
              <button class="modal-close" onclick="closeModal('sendUpdateModal')">
                <i class="fas fa-times"></i>
              </button>
            </div>
            
            <div class="modal-body">
              <form id="sendUpdateForm">
                <div class="form-group">
                  <label for="updateLinha">Linha</label>
                  <select id="updateLinha" class="select-control" required>
                    ${userPermittedLines.map(id => `
                      <option value="${id}" ${id === linhaId ? 'selected' : ''}>
                        ${LINHAS[id].emoji} ${LINHAS[id].nome}
                      </option>
                    `).join('')}
                  </select>
                </div>
                
                <div class="form-group">
                  <label for="updateMessage">Mensagem</label>
                  <textarea 
                    id="updateMessage" 
                    class="form-control" 
                    rows="5" 
                    placeholder="Digite a actualização aqui..."

    async function sendUpdate() {
      const linha = document.getElementById('updateLinha').value;
      const message = document.getElementById('updateMessage').value;
      const adminName = document.getElementById('updateAdminName').value;
      const urgent = document.getElementById('updateUrgent').checked;
      const sendBtn = document.getElementById('sendUpdateBtn');
      const successDiv = document.getElementById('successMessage');
      
      // Validar entrada
      const sanitizedMessage = sanitizeInput(message, 500);
      const sanitizedAdminName = sanitizeInput(adminName, 50);
      
      if (!sanitizedMessage.trim()) {
        showToast('Erro', 'Digite uma mensagem válida', 'error');
        return;
      }
      
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
      showLoader();
      
      try {
        const finalMessage = urgent ? `🚨 URGENTE: ${sanitizedMessage}` : sanitizedMessage;
        const result = await apiCall('admin_update', {
          linha,
          msg: finalMessage,
          adminName: sanitizedAdminName
        });
        
        if (result.success) {
          // Mostrar mensagem de sucesso com botão WhatsApp
          successDiv.innerHTML = `
            <div class="success-message">
              <div class="success-message-header">
                <i class="fas fa-check-circle"></i>
                <h3>Actualização enviada com sucesso!</h3>
              </div>
              <p><strong>Linha:</strong> ${LINHAS[linha].emoji} ${LINHAS[linha].nome}</p>
              <p><strong>Mensagem:</strong> ${finalMessage}</p>
              <div class="success-actions">
                <button class="btn btn-whatsapp" onclick="shareOnWhatsApp('${finalMessage.replace(/'/g, "\\'")}', '${LINHAS[linha].nome}')">
                  <i class="fab fa-whatsapp"></i>
                  Partilhar via WhatsApp
                </button>
                <button class="btn btn-outline" onclick="closeModal('sendUpdateModal')">
                  <i class="fas fa-times"></i>
                  Fechar
                </button>
              </div>
            </div>
          `;
          successDiv.style.display = 'block';
          
          // Resetar formulário mas manter valores
          document.getElementById('updateMessage').value = sanitizedMessage;
          document.getElementById('updateAdminName').value = sanitizedAdminName;
          document.getElementById('charCount').textContent = sanitizedMessage.length;
          
          // Mostrar notificação
          showToast('Sucesso', 'Actualização enviada com sucesso!', 'success');
          
          // Atualizar dashboard
          setTimeout(() => {
            refreshCurrentSection();
          }, 1000);
          
        } else {
          throw new Error(result.error || 'Falha ao enviar');
        }
      } catch (error) {
        showToast('Erro', error.message || 'Falha na comunicação', 'error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Actualização';
        hideLoader();
      }
    }

    async function createNewAdmin() {
      const fullName = document.getElementById('adminFullName').value.trim();
      const nickname = document.getElementById('adminNickname').value.trim();
      const phone = document.getElementById('adminPhone').value.trim();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const role = document.getElementById('adminRole').value;
      
      // Validar campos
      if (!fullName || !phone || !email || !password) {
        showToast('Erro', 'Preencha todos os campos obrigatórios', 'error');
        return;
      }
      
      // Validar email
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast('Erro', 'Email inválido', 'error');
        return;
      }
      
      // Validar telefone
      if (phone.length !== 9 || !/^\d+$/.test(phone)) {
        showToast('Erro', 'Telefone deve ter 9 dígitos', 'error');
        return;
      }
      
      // Validar senha
      if (password.length < 6 || password.length > 20) {
        showToast('Erro', 'Senha deve ter entre 6 e 20 caracteres', 'error');
        return;
      }
      
      // Coletar linhas permitidas se for admin
      let linhas_permitidas = '';
      if (role === 'admin') {
        const lineCheckboxes = document.querySelectorAll('input[name="adminLines"]:checked');
        const selectedLines = Array.from(lineCheckboxes).map(cb => cb.value);
        
        if (selectedLines.length === 0) {
          showToast('Erro', 'Selecione pelo menos uma linha', 'error');
          return;
        }
        
        linhas_permitidas = selectedLines.join(',');
      } else if (role === 'superadmin') {
        // Super admin tem acesso a todas as linhas
        linhas_permitidas = Object.keys(LINHAS).join(',');
      }
      
      showLoader();
      
      try {
        const result = await apiCall('create_user', {
          phone: '258' + phone, // Adicionar código do país
          fullName,
          nickname,
          email,
          password,
          role,
          linhas_permitidas
        });
        
        if (result.success) {
          showToast('Sucesso', 'Administrador criado com sucesso!', 'success');
          showToast('Informação', 'Email com instruções será enviado ao novo administrador', 'info');
          
          // Fechar modal e atualizar lista
          closeModal('newAdminModal');
          loadAdminsSection();
          
        } else {
          showToast('Erro', result.error || 'Falha ao criar administrador', 'error');
        }
      } catch (error) {
        showToast('Erro', 'Falha na comunicação com o servidor', 'error');
      } finally {
        hideLoader();
      }
    }

                    <i class="fas fa-eye"></i>
                    Ver Chat Completo
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      // Carregar mensagens para cada linha permitida
      for (const linhaId of userPermittedLines) {
        await loadLineChat(linhaId);
      }
    }
    
    async function loadLineChat(linhaId) {
      const container = document.getElementById(`chat-${linhaId}`);
      if (!container) return;
      
      try {
        const result = await apiCall('chat', { linha: linhaId }, 'GET');
        
        if (result.success && result.chat && result.chat.length > 0) {
          const lastMessages = result.chat.slice(-5);
          
          container.innerHTML = lastMessages.map(msg => `
            <div style="margin-bottom: 10px; padding: 8px; background: white; border-radius: var(--radius-sm); border-left: 3px solid var(--primary);">
              <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <strong style="color: var(--primary); font-size: 0.9rem;">${msg.usuario}</strong>
                <small style="color: var(--gray);">${formatTimeAgo(msg.timestamp)}</small>
              </div>
              <div style="font-size: 0.9rem;">${msg.mensagem}</div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div style="text-align: center; padding: 30px; color: var(--gray);">
              <i class="fas fa-comment-slash"></i>
              <p>Nenhuma mensagem</p>
            </div>
          `;
        }
      } catch (error) {
        container.innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--danger);">
            <i class="fas fa-exclamation-circle"></i>
            <p>Erro ao carregar</p>
          </div>
        `;
      }
    }
    
    function openChatModal(linhaId) {
      const linha = LINHAS[linhaId];
      const modalHtml = `
        <div class="modal-overlay" id="chatModal">
          <div class="modal modal-lg">
            <div class="modal-header">
              <h2 class="modal-title">
                ${linha.emoji} Chat - ${linha.nome}
              </h2>
              <button class="modal-close" onclick="closeModal('chatModal')">
                <i class="fas fa-times"></i>
              </button>
            </div>
            
            <div class="modal-body">
              <div id="chatMessages" style="height: 400px; overflow-y: auto; margin-bottom: 15px; padding: 15px; background: var(--light); border-radius: var(--radius-sm);">
                <div style="text-align: center; padding: 40px;">
                  <div class="loader"></div>
                  <p>Carregando mensagens...</p>
                </div>
              </div>
              
              <div class="form-group">
                <label for="chatFilter">Filtrar por usuário ou conteúdo</label>
                <input type="text" id="chatFilter" class="form-control" placeholder="Digite para filtrar..." onkeyup="filterChatMessages()">
              </div>
            </div>
            
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('chatModal')">
                Fechar
              </button>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('modalsContainer').innerHTML = modalHtml;
      loadChatMessages(linhaId);
    }
    
    async function loadChatMessages(linhaId) {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      
      try {
        const result = await apiCall('chat', { linha: linhaId }, 'GET');
        
        if (result.success && result.chat && result.chat.length > 0) {
          container.innerHTML = result.chat.map(msg => `
            <div class="chat-message" data-user="${msg.usuario}" data-content="${msg.mensagem.toLowerCase()}" style="margin-bottom: 15px; padding: 12px; background: white; border-radius: var(--radius-sm); border-left: 4px solid var(--primary);">
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <div>
                  <strong style="color: var(--primary);">${msg.usuario}</strong>
                  <small style="color: var(--gray); margin-left: 10px;">${formatDate(msg.timestamp)}</small>
                </div>
              </div>
              <div>${msg.mensagem}</div>
            </div>
          `).join('');
          
          container.scrollTop = container.scrollHeight;
        } else {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--gray);">
              <i class="fas fa-comment-slash" style="font-size: 2rem; margin-bottom: 15px;"></i>
              <h4>Nenhuma mensagem no chat</h4>
              <p>Os passageiros ainda não enviaram mensagens.</p>
            </div>
          `;
        }
      } catch (error) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--danger);">
            <i class="fas fa-exclamation-circle"></i>
            <h4>Erro ao carregar mensagens</h4>
            <p>${error.message}</p>
          </div>
        `;
      }
    }
    
    function filterChatMessages() {
      const filter = document.getElementById('chatFilter').value.toLowerCase();
      const messages = document.querySelectorAll('.chat-message');
      
      messages.forEach(msg => {
        const user = msg.dataset.user.toLowerCase();
        const content = msg.dataset.content;
        const matches = user.includes(filter) || content.includes(filter);
        msg.style.display = matches ? 'block' : 'none';
      });
    }
    
    async function loadLinesSection() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">
              <i class="fas fa-train"></i>
              Linhas de Comboio
            </h2>
          </div>
          
          <div class="lines-grid">
            ${userPermittedLines.map(linhaId => {
              const linha = LINHAS[linhaId];
              return `
                <div class="line-card">
                  <div class="line-header ${linhaId}">
                    <div class="line-emoji">${linha.emoji}</div>
                    <div class="line-info">
                      <h3>${linha.nome}</h3>
                      <p>ID: ${linhaId}</p>
                    </div>
                  </div>
                  <div class="line-body">
                    <div style="margin-bottom: 15px;">
                      <strong style="display: block; margin-bottom: 5px; color: var(--primary);">Configuração:</strong>
                      <div style="font-size: 0.9rem;">
                        <div><strong>Aba Updates:</strong> ${linha.updates_sheet}</div>
                        <div><strong>Aba Chat:</strong> ${linha.chat_sheet}</div>
                      </div>
                    </div>
                    <div class="line-actions">
                      <button class="btn btn-primary" style="flex: 1;" onclick="openSendUpdateModal('${linhaId}')">
                        <i class="fas fa-bullhorn"></i>
                        Nova Actualização
                      </button>
                      <button class="btn btn-outline" onclick="openChatModal('${linhaId}')">
                        <i class="fas fa-comments"></i>
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          
          <div style="margin-top: 30px; padding: 20px; background: var(--primary-light); border-radius: var(--radius-sm);">
            <h4 style="color: var(--primary); margin-bottom: 10px;">
              <i class="fas fa-info-circle"></i>
              Sobre as Linhas
            </h4>
            <p style="font-size: 0.9rem;">
              Você tem acesso a ${userPermittedLines.length} linha(s). Cada linha tem suas próprias abas no Google Sheets para actualizações e chat.
            </p>
          </div>
        </div>
      `;
    }
    
    async function loadSettingsSection() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">
              <i class="fas fa-cog"></i>
              Configurações do Sistema
            </h2>
          </div>
          
          <div class="form-group">
            <label for="systemName">Nome do Sistema</label>
            <input type="text" id="systemName" class="form-control" value="CFM Multi-linhas" disabled>
          </div>
          
          <div class="form-group">
            <label for="gasUrl">URL do Google Apps Script</label>
            <input type="text" id="gasUrl" class="form-control" value="${GAS_URL}" disabled>
            <small style="color: var(--gray);">URL do backend</small>
          </div>
          
          <div class="form-group">
            <label>Suas Linhas Permitidas</label>
            <div style="background: var(--light); padding: 15px; border-radius: var(--radius-sm);">
              ${userPermittedLines.map(linhaId => `
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--gray-light);">
                  <span style="font-size: 1.5rem;">${LINHAS[linhaId].emoji}</span>
                  <div style="flex: 1;">
                    <strong>${LINHAS[linhaId].nome}</strong><br>
                    <small style="color: var(--gray);">ID: ${linhaId}</small>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          
          <div style="margin-top: 30px; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: var(--radius-sm);">
            <h4 style="margin-bottom: 10px;">
              <i class="fas fa-info-circle"></i>
              Suas Informações
            </h4>
            <div style="font-size: 0.9rem;">
              <div><strong>Nome:</strong> ${currentUser ? currentUser.fullName : 'N/A'}</div>
              <div><strong>Email:</strong> ${currentUser ? currentUser.email : 'N/A'}</div>
              <div><strong>Nível:</strong> ${currentUser ? (currentUser.role === 'superadmin' ? 'Super Admin' : 'Admin') : 'N/A'}</div>
              <div><strong>Linhas:</strong> ${userPermittedLines.length}</div>
            </div>
          </div>
        </div>
      `;
    }
    
    // ============================================
    // FUNÇÕES AUXILIARES
    // ============================================
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copiado', 'Texto copiado para a área de transferência', 'success');
      }).catch(() => {
        showToast('Erro', 'Não foi possível copiar o texto', 'error');
      });
    }
    
    // ============================================
    // POLLING E ATUALIZAÇÃO AUTOMÁTICA
    // ============================================
    function startPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }
      
      // Atualizar a cada 30 segundos
      pollingInterval = setInterval(async () => {
        await updateBadges();
      }, 30000);
      
      // Primeira atualização
      updateBadges();
    }
    
    async function updateBadges() {
      try {
        // Atualizar contador de updates
        let totalUpdatesToday = 0;
        for (const linhaId of userPermittedLines) {
          const stats = await getLineStats(linhaId);
          totalUpdatesToday += stats.today || 0;
        }
        
        const updatesBadge = document.getElementById('updatesBadge');
        if (updatesBadge) {
          updatesBadge.textContent = totalUpdatesToday;
          updatesBadge.style.display = totalUpdatesToday > 0 ? 'inline' : 'none';
        }
        
        // Atualizar contador de chat
        let totalChatToday = 0;
        for (const linhaId of userPermittedLines) {
          const stats = await getLineStats(linhaId);
          totalChatToday += stats.chat_today || 0;
        }
        
        const chatBadge = document.getElementById('chatBadge');
        if (chatBadge) {
          chatBadge.textContent = totalChatToday;
          chatBadge.style.display = totalChatToday > 0 ? 'inline' : 'none';
        }
        
      } catch (error) {
        console.error('Error updating badges:', error);
      }
    }
    
    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      // Evento de login
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const identifier = document.getElementById('loginIdentifier').value;
        const password = document.getElementById('loginPassword').value;
        login(identifier, password);
      });
      
      // Tentar validar sessão existente
      validateSession().then(valid => {
        if (!valid) {
          // Mostrar tela de login
          document.getElementById('loginScreen').style.display = 'flex';
          document.getElementById('adminPanel').style.display = 'none';
        }
      });
      
      // Configurar menu
      setupMenu();
    });
  </script>
</body>
</html>
